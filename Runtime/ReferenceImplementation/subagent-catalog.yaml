schema_version: '3.0'
default_profile: artist_subagent
profiles:
  artist_subagent:
    profile_id: artist_subagent
    display_name: ArtistSubAgent
    provider_id: unity_artist_cli
    audience: artist_subagent
    goal_type: artist.camera.refine
    capabilities:
    - artist.camera.inspect
    - artist.camera.refine
    - visual.capture
    primary_capability: artist.camera.refine
    required_evidence:
    - mutation_diff
    - editor_observation
    - visual_capture
    activation:
      install_mode: optional
      auto_install: false
      required_environment:
      - unity_artist_cli.available
      - unity_artist_cli.compatible
      - unity_artist_cli.project_bound
      - unity_artist_cli.package_installed
      - unity_artist_cli.pipeline_reachable
    scope:
      default_target_guid: camera-guid-001
      component_type: UnityEngine.Camera
      property_paths:
      - Camera.fieldOfView
      mutation_channels:
      - serialized_property
      max_targets: 1
    value:
      type: float
      unit: degree
      minimum: 0
      maximum: 180
      maximum_exclusive: true
    approval:
      default_minimum: 35
      default_maximum: 50
      minimum_exclusive: true
      maximum_exclusive: true
    evidence:
      source_type: artist_subagent_reference
      producer: UnityAgent.ReferenceImplementation.v1.1
      provenance_token: artist_subagent
    execution:
      kind: provider_backed
  graphics_subagent:
    profile_id: graphics_subagent
    display_name: GraphicsSubAgent
    audience: graphics_subagent
    goal_type: graphics.diagnose
    capabilities:
    - graphics.inspect
    - graphics.diagnose
    - graphics.validate
    required_evidence:
    - graphics_diagnosis
    primary_capability: graphics.diagnose
    activation:
      install_mode: optional
      auto_install: false
      required_environment:
      - project.exists
      - filesystem.readable
    evidence:
      source_type: reasoning_execution
      producer: Runtime/CodexRunner
      provenance_token: graphics_subagent
    execution:
      kind: reasoning
      reasoning_runtime: codex_runner
      execution_mode: read_only_analysis
      source_context_binding: required
      required_observation_capabilities:
      - project.inspect
      - source.read
      instructions_ref: .agents/skills/graphics-analysis/SKILL.md
      output_contract_ref: Runtime/Contracts/graphics-analysis-result.schema.json
      hub_contract_refs:
        instructions_ref: SubAgents/graphics_subagent/instructions.md
        output_contract_ref: SubAgents/graphics_subagent/contracts/graphics-analysis-result.schema.json
    selection:
      compatibility:
        unity_version_prefixes:
        - '6000.'
        context_values:
          project_fact:render_pipeline:
          - builtin
          - urp
          - hdrp
      capability_context:
        graphics.inspect:
          all_of:
          - project_fact:unity_version
          - project_fact:render_pipeline
          any_of:
          - project_fact:relevant_source
          - project_fact:renderer_feature_state
          receipt_required: false
        graphics.diagnose:
          all_of:
          - project_fact:unity_version
          - project_fact:render_pipeline
          - task_fact:rendering_symptom
          any_of:
          - project_fact:relevant_source
          - project_fact:renderer_feature_state
          receipt_required: false
        graphics.validate:
          all_of:
          - project_fact:unity_version
          - project_fact:render_pipeline
          - task_fact:validation_claim
          any_of:
          - project_fact:relevant_source
          - project_fact:renderer_feature_state
          receipt_required: false
      supported_targets: &id001
      - unity_version: Unity 6.x+
        render_pipeline: builtin
      - unity_version: Unity 6.x+
        render_pipeline: urp
      - unity_version: Unity 6.x+
        render_pipeline: hdrp
  world_creator_subagent:
    profile_id: world_creator_subagent
    display_name: WorldCreatorSubAgent
    audience: world_creator_subagent
    goal_type: world.plan
    capabilities:
    - world.plan
    required_evidence:
    - world_plan
    primary_capability: world.plan
    activation:
      install_mode: optional
      auto_install: false
      required_environment:
      - project.exists
      - filesystem.readable
    evidence:
      source_type: reasoning_execution
      producer: Runtime/CodexRunner
      provenance_token: world_creator_subagent
    execution:
      kind: reasoning
      reasoning_runtime: codex_runner
      execution_mode: planning_only
      source_context_binding: required
      required_observation_capabilities: []
      instructions_ref: .agents/skills/world-planning/SKILL.md
      output_contract_ref: Runtime/Contracts/world-plan-result.schema.json
      hub_contract_refs:
        instructions_ref: SubAgents/world_creator_subagent/instructions.md
        output_contract_ref: SubAgents/world_creator_subagent/contracts/world-plan-result.schema.json
    selection:
      compatibility:
        unity_version_prefixes:
        - '6000.'
        context_values: {}
      capability_context:
        world.plan:
          all_of:
          - task_fact:world_goal
          - task_fact:requested_scope
          any_of: []
          receipt_required: false
      supported_targets: *id001
  performance_subagent:
    profile_id: performance_subagent
    display_name: PerformanceSubAgent
    audience: performance_subagent
    goal_type: performance.analyze
    capabilities:
    - performance.analyze
    required_evidence:
    - performance_analysis
    primary_capability: performance.analyze
    activation:
      install_mode: optional
      auto_install: false
      required_environment:
      - project.exists
      - filesystem.readable
      - pipeline.reachable
      - unity_editor.project_bound
    evidence:
      source_type: reasoning_execution
      producer: Runtime/CodexRunner
      provenance_token: performance_subagent
    execution:
      kind: reasoning
      reasoning_runtime: codex_runner
      execution_mode: read_only_analysis
      source_context_binding: required
      required_observation_capabilities:
      - profiler.observe
      instructions_ref: .agents/skills/performance-analysis/SKILL.md
      output_contract_ref: Runtime/Contracts/performance-analysis-result.schema.json
      hub_contract_refs:
        instructions_ref: SubAgents/performance_subagent/instructions.md
        output_contract_ref: SubAgents/performance_subagent/contracts/performance-analysis-result.schema.json
    selection:
      compatibility:
        unity_version_prefixes:
        - '6000.'
        context_values: {}
      capability_context:
        performance.analyze:
          all_of:
          - project_fact:unity_version
          - task_fact:performance_symptom
          - task_fact:requested_scope
          any_of:
          - platform_fact:requested_target
          receipt_required: true
      supported_targets: *id001
