$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:runtime:entry-request-v2
title: UnityAgentEntryRequestV2
type: object
additionalProperties: false
required:
- schema_version
- request_id
- entry_point
- project_root
- intent
properties:
  schema_version:
    const: '2.0'
  request_id:
    type: string
    minLength: 1
    pattern: ^[A-Za-z0-9._-]+$
  entry_point:
    enum:
    - unity_ui
    - codex_plugin
  project_root:
    type: string
    minLength: 1
  intent:
    type: object
    additionalProperties: true
    required: [kind, task_fingerprint]
    properties:
      kind: {type: string, minLength: 1}
      task_fingerprint:
        type: object
        additionalProperties: false
        required: [intent, artifact, scope, failure_mode, architecture_state, mutation_target, evidence_state]
        properties:
          intent: {type: string, minLength: 1}
          artifact: {type: string, minLength: 1}
          scope: {type: string, minLength: 1}
          failure_mode: {type: string, minLength: 1}
          architecture_state: {type: string, minLength: 1}
          mutation_target: {type: string, minLength: 1}
          evidence_state: {type: string, minLength: 1}
  approval_ref: {type: [string, 'null'], minLength: 1}
