$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:runtime:entry-request-v2
title: UnityAgentEntryRequestV2
type: object
additionalProperties: false
required:
- schema_version
- request_id
- entry_point
- project_root
- intent
properties:
  schema_version:
    const: '2.0'
  request_id:
    type: string
    minLength: 1
    pattern: ^[A-Za-z0-9._-]+$
  entry_point:
    enum:
    - unity_ui
    - codex_plugin
  project_root:
    type: string
    minLength: 1
  intent:
    oneOf:
    - type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {const: project_inspection}
    - type: object
      additionalProperties: false
      required: [kind, visual_intent, exact_scene_or_asset_scope, reference_or_visual_definition]
      properties:
        kind: {const: visual_capture}
        visual_intent: {type: string, minLength: 1, pattern: '\S'}
        exact_scene_or_asset_scope: {type: string, minLength: 1, pattern: '\S'}
        reference_or_visual_definition: {type: string, minLength: 1, pattern: '\S'}
    - type: object
      additionalProperties: false
      required: [kind, symptom, target_scope]
      properties:
        kind: {const: rendering_diagnosis}
        symptom: {type: string, minLength: 1, pattern: '\S'}
        target_scope: {type: string, minLength: 1, pattern: '\S'}
        change_requested: {type: boolean}
    - type: object
      additionalProperties: false
      required: [kind, symptom, target_scope]
      properties:
        kind: {const: performance_analysis}
        symptom: {type: string, minLength: 1, pattern: '\S'}
        target_scope: {type: string, minLength: 1, pattern: '\S'}
        comparison_requested: {type: boolean}
    - type: object
      additionalProperties: false
      required: [kind, world_goal, scene_scope]
      properties:
        kind: {const: world_planning}
        world_goal: {type: string, minLength: 1, pattern: '\S'}
        scene_scope: {type: string, minLength: 1, pattern: '\S'}
        environment_type: {type: string, minLength: 1, pattern: '\S'}
        desired_mood: {type: string, minLength: 1, pattern: '\S'}
        target_platforms: {type: array, minItems: 1, items: {type: string, minLength: 1, pattern: '\S'}, uniqueItems: true}
        prohibited_changes: {type: array, items: {type: string, minLength: 1, pattern: '\S'}, uniqueItems: true}
        acceptance_criteria: {type: array, items: {type: string, minLength: 1, pattern: '\S'}, uniqueItems: true}
    - type: object
      additionalProperties: false
      required: [kind, plan_id, target_scope]
      properties:
        kind: {const: fixed_full_e2e_probe}
        plan_id: {type: string, pattern: '^[0-9a-f]{64}$'}
        target_scope: {const: Assets/UnityAgentE2E}
  approval_ref: {type: [string, 'null'], minLength: 1}
