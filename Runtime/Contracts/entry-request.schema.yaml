$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:runtime:entry-request
title: UnityAgentEntryRequest
type: object
additionalProperties: false
required:
  - schema_version
  - request_id
  - entry_point
  - project_root
  - intent
  - route_id
  - execution_profile
  - context_id
  - context_fingerprint
  - task_contract_runtime_projection
  - mutation_scope
  - validation_requirements
  - capability_requests
properties:
  schema_version: {const: "1.0"}
  request_id: {type: string, minLength: 1, pattern: "^[A-Za-z0-9._-]+$"}
  entry_point: {enum: [unity_ui, codex_plugin]}
  project_root: {type: string, minLength: 1}
  intent:
    type: object
    additionalProperties: true
    minProperties: 1
  route_id: {type: string, minLength: 1}
  node_id: {type: string, minLength: 1}
  loop_id: {type: string, minLength: 1}
  execution_profile: {type: string, minLength: 1}
  context_id: {type: string, minLength: 1}
  context_fingerprint: {type: string, minLength: 1}
  task_contract_runtime_projection: {type: object}
  mutation_scope: {type: object}
  validation_requirements:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  capability_requests:
    type: array
    minItems: 1
    items: {type: object}
