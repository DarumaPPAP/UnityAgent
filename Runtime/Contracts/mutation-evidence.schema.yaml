$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:runtime:mutation-evidence
title: MutationEvidence
type: object
additionalProperties: false
required:
- schema_version
- mutation_id
- run_id
- step_id
- scope
- changed_paths
- diff_ref
- before_fingerprint
- after_fingerprint
- scope_status
- verification_refs
properties:
  schema_version:
    const: '1.0'
  mutation_id:
    type: string
    minLength: 1
  run_id:
    type: string
    minLength: 1
  step_id:
    type: string
    minLength: 1
  scope:
    type: object
    additionalProperties: false
    required: [allowed_paths, prohibited_paths]
    properties:
      allowed_paths:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      prohibited_paths:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
  changed_paths:
    $ref: urn:unityagent:runtime:execution-result#/$defs/changed_paths
  diff_ref:
    type: [string, 'null']
  before_fingerprint:
    type: [string, 'null']
  after_fingerprint:
    type: [string, 'null']
  scope_status:
    enum: [within_scope, escaped, not_observed]
  verification_refs:
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
allOf:
- if:
    properties:
      changed_paths:
        properties:
          observation_state:
            const: not_observed
    required: [changed_paths]
  then:
    properties:
      scope_status:
        const: not_observed
