schema_version: "1.1"

channels:
  csharp:
    preferred:
      - source_patch
  shader:
    preferred:
      - source_patch
  scene:
    preferred:
      - connected_editor_command
      - editor_script
    raw_yaml_edit: prohibited
  prefab:
    preferred:
      - connected_editor_command
      - editor_script
    raw_yaml_edit: prohibited
  material:
    preferred:
      - serialized_object
      - connected_editor_command
    raw_yaml_edit: prohibited
  package:
    preferred:
      - package_manager_client
      - portable_upm_package
    manifest_direct_edit: prohibited
  my_unity_mcp_tooling:
    repository: DarumaPPAP/MyUnityMCP
    preferred: [source_patch, portable_upm_package, declarative_catalog_manifest_and_workflow]
    allowed: [MCP specifications, Creator workflows, Domain MCP manifests, Tool schemas, Capability modules, package source, isolated tests]
    prohibited: [target_project_specific_scenes, target_project_specific_prefabs, target_project_specific_materials, target_project_specific_timelines]
  mcp_generated_unity_asset:
    owner: target_unity_project
    preferred: [connected_editor_command, editor_script, serialized_object]
    explicit_plan_and_permission_required: true
    repository_export_by_default: prohibited
  project_settings:
    preferred: [editor_api, serialized_object_when_supported]
    explicit_approval_required: true
  render_pipeline_asset:
    preferred: [editor_api, serialized_object]
    explicit_approval_required: true
  generated_context:
    preferred: [personal_project_context_generator]
    required_for_planning: false
    team_safe_import: prohibited

profiles:
  generic_planning:
    direct_project_mutation: prohibited
    output: [portable_source, setup_wizard, manual_bindings]
  personal_full_control:
    direct_project_mutation: authorized_only
    project_context_generator: optional
  team_safe_import:
    allowed_direction: package_to_project_only
    project_to_external_export: prohibited
    staging_required: true
    automatic_project_settings_change: prohibited
