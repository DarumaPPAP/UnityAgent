[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unityagent-control-plane"
version = "0.0.2b0"
description = "UnityAgent Control Plane and evidence-backed Unity provider routing"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]
license = { text = "MIT" }

[project.scripts]
unity-agent = "Tools.unity_agent_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ControlPlane*", "Runtime*", "Persistence*", "Orchestration*", "Tools*", "Policy*", "Context*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md"]
