[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unityagent-control-plane"
version = "0.0.8b0"
description = "UnityAgent Control Plane and evidence-backed Unity provider routing"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]
license = { text = "MIT" }

[project.scripts]
unity-agent = "unityagent.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["unityagent*"]
exclude = ["unityagent._resources*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt", "*.cs"]
"unityagent" = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.md", "**/*.txt", "**/*.cs", "_resources/**/*", "_resources/.agents/**/*"]
