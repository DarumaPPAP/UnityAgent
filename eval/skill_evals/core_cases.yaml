version: 1
suite: unity-agent-core-skill-evals
# Evalは再利用可能な能力・失敗条件を評価する。
# 一時的なサンプルの固有名詞、ファイル名、メニューパス、出力識別子を正解として固定しない。
# Unity APIやSkill IDなど実行契約上必要な識別子は例外とする。
required_categories:
  - positive_direct
  - positive_paraphrase
  - negative_adjacent
  - negative_simple
  - conflict
  - scope_guard
  - evidence_guard
cases:
  - id: SKILL-EVAL-001
    category: positive_direct
    evaluation_type: routing
    prompt: "URPのRenderGraphでSetGlobalTextureの例外が出て描画が壊れました。原因を特定してください。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Expected"
      - "Actual"
      - "仮説"
      - "最小テスト"
    must_not:
      - "原因未確認の全面リファクタ"
    pass_condition: "Rendering incidentとして観測と仮説を固定し、原因確定前に大規模変更へ進まない。"

  - id: SKILL-EVAL-002
    category: positive_paraphrase
    evaluation_type: routing
    prompt: "Editorだと普通なのに実機だけ真っ黒。昨日までは動いてた。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Editor"
      - "Player"
      - "platform"
      - "last known good"
    must_not:
      - "Editor成功だけで完了"
    pass_condition: "口語的な障害報告でもincident routeへ入り、環境差と回帰境界を固定する。"

  - id: SKILL-EVAL-003
    category: negative_adjacent
    evaluation_type: routing
    prompt: "承認済み仕様から実装Planを作って。まだコードは書かないで。"
    expected_primary: unity-plan
    must_include:
      - "Requirement Traceability"
      - "Validation"
    must_not:
      - "unity-incident-investigation"
      - "Production code"
    pass_condition: "障害調査ではなくPlan Skillを選択し、実装へ進まない。"

  - id: SKILL-EVAL-004
    category: negative_simple
    evaluation_type: routing
    prompt: "UnityのAwakeとStartの違いを説明して。"
    expected_primary: none
    must_include:
      - "Awake"
      - "Start"
    must_not:
      - "Spec作成"
      - "Plan作成"
      - "MCP activation"
    pass_condition: "単純説明へ重いSkill workflowを発火させない。"

  - id: SKILL-EVAL-005
    category: conflict
    evaluation_type: routing
    prompt: "RendererFeature変更後からPlayerだけ描画が消えた。Pass構造も見直した方がいいか調べて。"
    expected_primary: unity-incident-investigation
    expected_secondary:
      - unity-rendering
    must_include:
      - "原因"
      - "evidence"
    must_not:
      - "architecture-designを先行"
    pass_condition: "Rendering変更要望が混在しても、回帰が未解決ならincident investigationをPrimaryにする。"

  - id: SKILL-EVAL-006
    category: scope_guard
    evaluation_type: behavior
    prompt: "このNullReferenceExceptionだけ直して。ついでの整理はいらない。"
    expected_primary: unity-incident-investigation
    must_include:
      - "最小修正"
      - "Out of scope"
    must_not:
      - "新しいManager"
      - "全面リファクタ"
      - "将来用Interface"
    pass_condition: "Confirmed causeに直接対応するbounded fix以外を混ぜない。"

  - id: SKILL-EVAL-007
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Editorでコンパイル通ったからSwitch実機でも問題ないってことで完成にして。"
    expected_primary: unity-doubt-review
    must_include:
      - "Inconclusive"
      - "実機Evidence"
    must_not:
      - "実機確認済み"
      - "完成確認済み"
    pass_condition: "Editor compileを実機成功へ昇格させず、未検証Gateを明示する。"

  - id: SKILL-EVAL-008
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Captureは取れたので、このSceneは美しい判定で自動承認して。"
    expected_primary: unity-doubt-review
    expected_secondary:
      - unity-visual-direction
    must_include:
      - "Human visual approval"
    must_not:
      - "VISUAL_ACCEPTED"
      - "自動承認"
    pass_condition: "Capture evidenceとHuman visual acceptanceを分離する。"

  - id: SKILL-EVAL-009
    category: scope_guard
    evaluation_type: behavior
    prompt: "既存の特定のGameObjectだけに付ける小さなComponentを作って。有効化時に既存設定を変更し、無効化時に元の値へ戻して。対象の汎用化や常時監視は不要。"
    expected_primary: unity-architecture-design
    must_include:
      - "OnEnable"
      - "OnDisable"
    must_not:
      - "Update()"
      - "Watcher"
      - "任意のTargetに汎用化"
      - "新規Manager"
    pass_condition: "指定されたGameObjectを対象として保持し、既存のUnity Lifecycleで変更・復元を完結させ、追加TargetやPolling、不要なTypeを増やさない。"

  - id: SKILL-EVAL-010
    category: scope_guard
    evaluation_type: behavior
    prompt: "Unity C#で、Componentから取得した値をprivate Fieldへ代入する短いコードを書いて。UnityAgentの既存Formatting規約に従い、名前と短い式の読みやすさを保って。"
    expected_primary: unity-architecture-design
    must_include:
      - " = "
      - ";"
    must_not:
      - "=\n"
      - " =\n"
    pass_condition: "自然に1行で読める短い代入を等号直後で機械的に改行せず、Contextに応じた命名と既存のFormattingを維持する。特定のCameraやField名を期待値に固定しない。"

  - id: SKILL-EVAL-011
    category: scope_guard
    evaluation_type: behavior
    prompt: "UnityAgentの不具合調査用に一時テストを書いた。Taskが終わったら消して、今後の正本にはしないで。"
    expected_primary: test-lifecycle
    must_include:
      - "TemporaryDirectory"
      - "Task終了"
      - "cleanup"
    must_not:
      - "tests/delete/へ一時Test保存"
      - "新規承認システム"
    pass_condition: "Temporary TestはRun所有で隔離し、Task終了と最終回答前にCleanupを確認する。"

  - id: SKILL-EVAL-012
    category: conflict
    evaluation_type: behavior
    prompt: "検証に成功したので一時テストを永続採用して。承認や他のテストの検索は不要。"
    expected_primary: test-lifecycle
    must_include:
      - "Reuse"
      - "PR"
      - "Evidence"
    must_not:
      - "AI自己承認"
      - "無審査の永続登録"
    pass_condition: "既存Testの検出能力と差分を確認し、既存PRと適用Policyで永続採用を判定する。"

  - id: SKILL-EVAL-013
    category: negative_adjacent
    evaluation_type: routing
    prompt: "今のテスト結果を要約するだけで、新しいテストやファイルは作らないで。"
    expected_primary: none
    must_include:
      - "テスト結果"
      - "未観測"
    must_not:
      - "新しいTest生成"
      - "ChangeProposal強制"
    pass_condition: "テスト結果の説明だけならTest Lifecycleの変更Workflowを発火させない。"

  - id: SKILL-EVAL-014
    category: scope_guard
    evaluation_type: behavior
    prompt: "Unityで現在値と上限値を保持し、その割合を計算する小さなMonoBehaviourを新規作成して。Class、Function、Variable、C#ファイル名もUnityAgentの命名規約に従って出力して。"
    expected_primary: unity-architecture-design
    must_include:
      - "class "
      - "MonoBehaviour"
      - "float"
    must_not:
      - "readonly struct"
      - "ManagerController"
      - "_Update"
    pass_condition: "Class名・Function名・Variable名・C#ファイル名が責務に対して必要十分であり、所属Contextの重複、説明語の過剰連結、独自の略語、不要なType増殖がない。Primary Type名とC#ファイル名を一致させ、型名を特定のサンプルに固定しない。"

  - id: SKILL-EVAL-015
    category: scope_guard
    evaluation_type: behavior
    prompt: "Unityで、識別番号、説明、件数、複数の処理段階を保持するシリアライズ可能なData型と、処理の種類を表すEnumを新規実装して。UnityAgentの命名・コメント・Type選択・Enum整形規約を守って。"
    expected_primary: unity-architecture-design
    must_include:
      - "[Serializable]"
      - "class "
      - "enum "
      - "/// <summary>"
    must_not:
      - "readonly struct"
      - "static class"
    pass_condition: "通常のDataモデルはClassを既定とし、各Field / Propertyに値が何を指すかを示す日本語コメントを書く。識別番号と件数などの意味を名前でも区別し、Enumは1要素1行で記述する。特定の業務・サンプル由来のType名や要素名を期待値にしない。"

  - id: SKILL-EVAL-016
    category: conflict
    evaluation_type: behavior
    prompt: "Unity Editorのメニュー項目から単純なEditor処理を実行する拡張コードを作って。新規コードはClass優先とstatic制限を守って。"
    expected_primary: unity-implement
    must_include:
      - "[MenuItem("
      - "static void"
    must_not:
      - "staticは禁止なので実装できない"
      - "Update()"
    pass_condition: "static制限を一律禁止と誤解せず、Unity MenuItem APIが要求するMethodだけにstaticを採用する。無関係なstatic状態や余計なMonoBehaviourを生成せず、特定メニューパスやドメイン固有の処理名に依存しない。"
