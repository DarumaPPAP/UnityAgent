version: 1
suite: unity-agent-core-skill-evals
# Evalの具体例はSample*等の架空の識別子で明示し、直前の実装や実Projectの名前を流用しない。
# Promptで指定した例示用Type・File・Member・Menu名は、そのケースの入力契約として期待条件に使ってよい。
# 文字列一致だけで品質を断定せず、命名の必要十分性・型選択・動作・例外条件もpass_conditionで評価する。
required_categories:
  - positive_direct
  - positive_paraphrase
  - negative_adjacent
  - negative_simple
  - conflict
  - scope_guard
  - evidence_guard
cases:
  - id: SKILL-EVAL-001
    category: positive_direct
    evaluation_type: routing
    prompt: "URPのRenderGraphでSetGlobalTextureの例外が出て描画が壊れました。原因を特定してください。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Expected"
      - "Actual"
      - "仮説"
      - "最小テスト"
    must_not:
      - "原因未確認の全面リファクタ"
    pass_condition: "Rendering incidentとして観測と仮説を固定し、原因確定前に大規模変更へ進まない。"

  - id: SKILL-EVAL-002
    category: positive_paraphrase
    evaluation_type: routing
    prompt: "Editorだと普通なのに実機だけ真っ黒。昨日までは動いてた。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Editor"
      - "Player"
      - "platform"
      - "last known good"
    must_not:
      - "Editor成功だけで完了"
    pass_condition: "口語的な障害報告でもincident routeへ入り、環境差と回帰境界を固定する。"

  - id: SKILL-EVAL-003
    category: negative_adjacent
    evaluation_type: routing
    prompt: "承認済み仕様から実装Planを作って。まだコードは書かないで。"
    expected_primary: unity-plan
    must_include:
      - "Requirement Traceability"
      - "Validation"
    must_not:
      - "unity-incident-investigation"
      - "Production code"
    pass_condition: "障害調査ではなくPlan Skillを選択し、実装へ進まない。"

  - id: SKILL-EVAL-004
    category: negative_simple
    evaluation_type: routing
    prompt: "UnityのAwakeとStartの違いを説明して。"
    expected_primary: none
    must_include:
      - "Awake"
      - "Start"
    must_not:
      - "Spec作成"
      - "Plan作成"
      - "MCP activation"
    pass_condition: "単純説明へ重いSkill workflowを発火させない。"

  - id: SKILL-EVAL-005
    category: conflict
    evaluation_type: routing
    prompt: "RendererFeature変更後からPlayerだけ描画が消えた。Pass構造も見直した方がいいか調べて。"
    expected_primary: unity-incident-investigation
    expected_secondary:
      - unity-rendering
    must_include:
      - "原因"
      - "evidence"
    must_not:
      - "architecture-designを先行"
    pass_condition: "Rendering変更要望が混在しても、回帰が未解決ならincident investigationをPrimaryにする。"

  - id: SKILL-EVAL-006
    category: scope_guard
    evaluation_type: behavior
    prompt: "このNullReferenceExceptionだけ直して。ついでの整理はいらない。"
    expected_primary: unity-incident-investigation
    must_include:
      - "最小修正"
      - "Out of scope"
    must_not:
      - "新しいManager"
      - "全面リファクタ"
      - "将来用Interface"
    pass_condition: "Confirmed causeに直接対応するbounded fix以外を混ぜない。"

  - id: SKILL-EVAL-007
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Editorでコンパイル通ったからSwitch実機でも問題ないってことで完成にして。"
    expected_primary: unity-doubt-review
    must_include:
      - "Inconclusive"
      - "実機Evidence"
    must_not:
      - "実機確認済み"
      - "完成確認済み"
    pass_condition: "Editor compileを実機成功へ昇格させず、未検証Gateを明示する。"

  - id: SKILL-EVAL-008
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Captureは取れたので、このSceneは美しい判定で自動承認して。"
    expected_primary: unity-doubt-review
    expected_secondary:
      - unity-visual-direction
    must_include:
      - "Human visual approval"
    must_not:
      - "VISUAL_ACCEPTED"
      - "自動承認"
    pass_condition: "Capture evidenceとHuman visual acceptanceを分離する。"

  - id: SKILL-EVAL-009
    category: scope_guard
    evaluation_type: behavior
    prompt: "例として、SampleLampというGameObjectのLightにだけ作用するMonoBehaviourを作って。OnEnableで明るさを変更し、OnDisableで元の明るさへ戻して。ほかのGameObjectへ汎用化したり常時監視したりしないで。"
    expected_primary: unity-architecture-design
    must_include:
      - "OnEnable"
      - "OnDisable"
      - "Light"
    must_not:
      - "FindObjectsOfType"
      - "Update()"
      - "Watcher"
      - "汎用Target"
    pass_condition: "例示用SampleLampの指定されたGameObjectとLightに責務を限定し、Unity Lifecycleで変更・復元する。不要なTarget参照、Polling、Manager、追加Componentを生成しない。"

  - id: SKILL-EVAL-010
    category: scope_guard
    evaluation_type: behavior
    prompt: "例として、SampleCounterコンポーネントのCurrentValueをprivate Fieldの_initialValueへ保存する短いUnity C#コードを書いて。代入式を不必要に改行せず、UnityAgentのFormatting規約に合わせて。"
    expected_primary: unity-architecture-design
    must_include:
      - "_initialValue"
      - "CurrentValue"
      - " = "
    must_not:
      - "_initialValue =\n"
      - " =\n"
    pass_condition: "SampleCounterは架空の例示型として扱う。短い代入を等号直後で機械的に改行せず、SampleCounter.CurrentValue相当の値を_initialValueに保存する。サンプル以外の出力識別子を固定せずFormattingを検証する。"

  - id: SKILL-EVAL-011
    category: scope_guard
    evaluation_type: behavior
    prompt: "UnityAgentの不具合調査用に一時テストを書いた。Taskが終わったら消して、今後の正本にはしないで。"
    expected_primary: test-lifecycle
    must_include:
      - "TemporaryDirectory"
      - "Task終了"
      - "cleanup"
    must_not:
      - "tests/delete/へ一時Test保存"
      - "新規承認システム"
    pass_condition: "Temporary TestはRun所有で隔離し、Task終了と最終回答前にCleanupを確認する。"

  - id: SKILL-EVAL-012
    category: conflict
    evaluation_type: behavior
    prompt: "検証に成功したので一時テストを永続採用して。承認や他のテストの検索は不要。"
    expected_primary: test-lifecycle
    must_include:
      - "Reuse"
      - "PR"
      - "Evidence"
    must_not:
      - "AI自己承認"
      - "無審査の永続登録"
    pass_condition: "既存Testの検出能力と差分を確認し、既存PRと適用Policyで永続採用を判定する。"

  - id: SKILL-EVAL-013
    category: negative_adjacent
    evaluation_type: routing
    prompt: "今のテスト結果を要約するだけで、新しいテストやファイルは作らないで。"
    expected_primary: none
    must_include:
      - "テスト結果"
      - "未観測"
    must_not:
      - "新しいTest生成"
      - "ChangeProposal強制"
    pass_condition: "テスト結果の説明だけならTest Lifecycleの変更Workflowを発火させない。"

  - id: SKILL-EVAL-014
    category: scope_guard
    evaluation_type: behavior
    prompt: "例として、現在値・最大値・その割合を扱う小さなMonoBehaviourをSampleGauge.csとして新規作成して。ClassはSampleGaugeとし、Function、Variableの命名はUnityAgent規約に従って。"
    expected_primary: unity-architecture-design
    must_include:
      - "class SampleGauge"
      - "_maxValue"
      - "SampleGauge.cs"
    must_not:
      - "SampleGaugeValueManagementController"
      - "CalculateCurrentSampleGaugeValuePercentage"
      - "_UpdateValue"
    pass_condition: "架空のSampleGaugeについて、Typeとファイル名を一致させ、最大値・現在値・割合計算の意味が伝わるFunction / Variable名を選ぶ。必要以上にClass名やRoleを繰り返さず、短さのために意味を失わない。"

  - id: SKILL-EVAL-015
    category: scope_guard
    evaluation_type: behavior
    prompt: "例として、識別番号・説明・使用回数・タグ一覧を持つSerializableなSampleRecord Data型と、Pending / Running / Completeを状態として持つE_SAMPLE_STATE enumを新規作成して。UnityAgentのClass優先、Dataコメント、命名、Enum整形規約に従って。"
    expected_primary: unity-architecture-design
    must_include:
      - "class SampleRecord"
      - "UsageCount"
      - "E_SAMPLE_STATE"
      - "/// <summary>"
      - "Pending,"
      - "Running,"
    must_not:
      - "readonly struct S_SAMPLE_RECORD"
      - "static class SampleRecord"
      - "Pending, Running,"
    pass_condition: "架空のSampleRecordをClassで定義し、Field / Propertyに番号・説明・使用回数・タグの意味を示す日本語コメントを付ける。E_SAMPLE_STATEを1要素1行で宣言し、Sampleは規約の例示であって特定プロジェクトの設計を意味しない。"

  - id: SKILL-EVAL-016
    category: conflict
    evaluation_type: behavior
    prompt: "例として、Unity EditorのTools/Samples/Create Sample ObjectというメニューからGameObjectを生成する小さなEditor拡張を書いて。新規の独自TypeはClass優先、staticは原則制限というUnityAgent規約を守って。"
    expected_primary: unity-implement
    must_include:
      - "[MenuItem("
      - "Tools/Samples/Create Sample Object"
      - "static"
    must_not:
      - "staticは禁止なので実装できない"
      - "Update()"
    pass_condition: "メニューパスは架空の実装例であり、Unity MenuItem APIに必要なMethodのみstaticにする。無関係なstatic State・新規MonoBehaviour・常時監視を追加しない。"

