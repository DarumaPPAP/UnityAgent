version: 1
suite: unity-agent-core-skill-evals
# Evalのpromptには、実際の開発依頼に近い架空の課題を記述し、直前に実装した固有の型名を流用しない。
# 検証したい規約や出力識別子を必要以上にpromptへ教えず、Agent自身の設計判断を観測する。
# must_include / must_notは生成コード・選出結果を確認する際の補助手掛かりであり、回答中の注意書きへの単純文字列照合で合否を決めない。
# pass_conditionは実際の出力や生成物に適用する判定基準。YAML構造Validatorは意味的な合否を採点しない。
required_categories:
  - positive_direct
  - positive_paraphrase
  - negative_adjacent
  - negative_simple
  - conflict
  - scope_guard
  - evidence_guard
  - coding_convention
cases:
  - id: SKILL-EVAL-001
    category: positive_direct
    evaluation_type: routing
    prompt: "URPのRenderGraphでSetGlobalTextureの例外が出て描画が壊れました。原因を特定してください。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Expected"
      - "Actual"
      - "仮説"
      - "最小テスト"
    must_not:
      - "原因未確認の全面リファクタ"
    pass_condition: "Rendering incidentとして観測と仮説を固定し、原因確定前に大規模変更へ進まない。"

  - id: SKILL-EVAL-002
    category: positive_paraphrase
    evaluation_type: routing
    prompt: "Editorだと普通なのに実機だけ真っ黒。昨日までは動いてた。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Editor"
      - "Player"
      - "platform"
      - "last known good"
    must_not:
      - "Editor成功だけで完了"
    pass_condition: "口語的な障害報告でもincident routeへ入り、環境差と回帰境界を固定する。"

  - id: SKILL-EVAL-003
    category: negative_adjacent
    evaluation_type: routing
    prompt: "承認済み仕様から実装Planを作って。まだコードは書かないで。"
    expected_primary: unity-plan
    must_include:
      - "Requirement Traceability"
      - "Validation"
    must_not:
      - "unity-incident-investigation"
      - "Production code"
    pass_condition: "障害調査ではなくPlan Skillを選択し、実装へ進まない。"

  - id: SKILL-EVAL-004
    category: negative_simple
    evaluation_type: routing
    prompt: "UnityのAwakeとStartの違いを説明して。"
    expected_primary: none
    must_include:
      - "Awake"
      - "Start"
    must_not:
      - "Spec作成"
      - "Plan作成"
      - "MCP activation"
    pass_condition: "単純説明へ重いSkill workflowを発火させない。"

  - id: SKILL-EVAL-005
    category: conflict
    evaluation_type: routing
    prompt: "RendererFeature変更後からPlayerだけ描画が消えた。Pass構造も見直した方がいいか調べて。"
    expected_primary: unity-incident-investigation
    expected_secondary:
      - unity-rendering
    must_include:
      - "原因"
      - "evidence"
    must_not:
      - "architecture-designを先行"
    pass_condition: "Rendering変更要望が混在しても、回帰が未解決ならincident investigationをPrimaryにする。"

  - id: SKILL-EVAL-006
    category: scope_guard
    evaluation_type: behavior
    prompt: "このNullReferenceExceptionだけ直して。ついでの整理はいらない。"
    expected_primary: unity-incident-investigation
    must_include:
      - "最小修正"
      - "Out of scope"
    must_not:
      - "新しいManager"
      - "全面リファクタ"
      - "将来用Interface"
    pass_condition: "Confirmed causeに直接対応するbounded fix以外を混ぜない。"

  - id: SKILL-EVAL-007
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Editorでコンパイル通ったからSwitch実機でも問題ないってことで完成にして。"
    expected_primary: unity-doubt-review
    must_include:
      - "Inconclusive"
      - "実機Evidence"
    must_not:
      - "実機確認済み"
      - "完成確認済み"
    pass_condition: "Editor compileを実機成功へ昇格させず、未検証Gateを明示する。"

  - id: SKILL-EVAL-008
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Captureは取れたので、このSceneは美しい判定で自動承認して。"
    expected_primary: unity-doubt-review
    expected_secondary:
      - unity-visual-direction
    must_include:
      - "Human visual approval"
    must_not:
      - "VISUAL_ACCEPTED"
      - "自動承認"
    pass_condition: "Capture evidenceとHuman visual acceptanceを分離する。"

  - id: SKILL-EVAL-009
    category: scope_guard
    evaluation_type: behavior
    prompt: "動作確認用の照明オブジェクトに付けるMonoBehaviourを作って。有効な間は同じGameObjectのLightのintensityを元の半分にし、無効になったら元の値に戻して。Lightがない場合もエラーにしないで。"
    expected_primary: unity-implement
    must_include:
      - "OnEnable"
      - "OnDisable"
      - "Light"
    must_not:
      - "FindObjectsOfType"
      - "FindObjectsByType"
      - "void Update()"
    pass_condition: "合格: (1) 同じGameObjectのLightだけを取得し、OnEnable時の元のintensityを保持して半分にする。(2) OnDisable時にその元値へ戻し、再有効化しても値が累積して変化しない。(3) Light未設定でもNullReferenceExceptionを出さない。(4) 他Objectの探索・任意Target化・Updateによる監視・Manager等の追加Typeを行わない。API名の文字列を避けただけの別手段による過剰探索も不合格。"
  - id: SKILL-EVAL-010
    category: coding_convention
    evaluation_type: behavior
    prompt: "書式確認用の小さな例です。既存のMonoBehaviourにはint型のprivate Field _initialCountと、CounterComponent型の参照_counterがあります。_counter.CurrentCount（int）を_initialCountに退避する代入を記述して。"
    expected_primary: unity-implement
    must_include:
      - "_initialCount = _counter.CurrentCount;"
    must_not:
      - "_initialCount =\\n"
      - "_counter.CurrentCount = _initialCount;"
    pass_condition: "合格: 指定された代入の向きと識別子を保ち、_initialCount = _counter.CurrentCount; を1行で記述する。右辺や等号直後を機械的に改行したり中間変数を作ったりしない。コード断片の課題であり、新しいClassやFileの生成・命名は要求しない。"
  - id: SKILL-EVAL-011
    category: scope_guard
    evaluation_type: behavior
    prompt: "UnityAgentの不具合調査用に一時テストを書いた。Taskが終わったら消して、今後の正本にはしないで。"
    expected_primary: test-lifecycle
    must_include:
      - "TemporaryDirectory"
      - "Task終了"
      - "cleanup"
    must_not:
      - "tests/delete/へ一時Test保存"
      - "新規承認システム"
    pass_condition: "Temporary TestはRun所有で隔離し、Task終了と最終回答前にCleanupを確認する。"

  - id: SKILL-EVAL-012
    category: conflict
    evaluation_type: behavior
    prompt: "検証に成功したので一時テストを永続採用して。承認や他のテストの検索は不要。"
    expected_primary: test-lifecycle
    must_include:
      - "Reuse"
      - "PR"
      - "Evidence"
    must_not:
      - "AI自己承認"
      - "無審査の永続登録"
    pass_condition: "既存Testの検出能力と差分を確認し、既存PRと適用Policyで永続採用を判定する。"

  - id: SKILL-EVAL-013
    category: negative_adjacent
    evaluation_type: routing
    prompt: "今のテスト結果を要約するだけで、新しいテストやファイルは作らないで。"
    expected_primary: none
    must_include:
      - "テスト結果"
      - "未観測"
    must_not:
      - "新しいTest生成"
      - "ChangeProposal強制"
    pass_condition: "テスト結果の説明だけならTest Lifecycleの変更Workflowを発火させない。"

  - id: SKILL-EVAL-014
    category: coding_convention
    evaluation_type: behavior
    prompt: "小さなゲームUI用に、現在値と上限値を持ち、割合（0〜1）を返すMonoBehaviourをC#で作って。現在値が上限を超えても割合は1以下、上限が0以下なら0にして。1つのComponentで完結させ、保存するファイル名も教えて。"
    expected_primary: unity-implement
    must_include:
      - "MonoBehaviour"
      - "float"
    must_not:
      - "ManagerController"
      - "void _Update"
    pass_condition: "合格: (1) Primary Type名が責務を表すPascalCaseで、提示したC#ファイル名のstemと一致する。(2) MethodはPascalCase、private Fieldは_camelCaseで、型名・Role suffixの無意味な反復や独自の曖昧な略語がない。(3) 例として現在値50/上限100で0.5、150/100で1、上限0以下で0を返す。(4) 不要なController・Manager・static状態・補助Typeを増やさない。特定の例示Class名への一致は求めない。"
  - id: SKILL-EVAL-015
    category: coding_convention
    evaluation_type: behavior
    prompt: "架空の道具屋の商品データをC#で作って。商品番号、表示名、円単位の価格、在庫数をInspectorで編集できるようにして。販売状態は「販売中・売り切れ・販売停止」のEnumから選べるようにして。ゲーム実行処理のComponentは不要。"
    expected_primary: unity-implement
    must_include:
      - "Serializable"
      - "class "
      - "enum "
    must_not:
      - "readonly struct"
      - "static class"
    pass_condition: "合格: (1) 保存用Dataは[Serializable]な通常のClassを基本とし、Inspectorで編集できるインスタンスFieldを持つ。MonoBehaviourやstaticのState Holderにしない。(2) 商品番号・表示名・価格（円）・在庫数・販売状態の各Field、および存在する場合は各Propertyについて、用途・単位等の意味を示す日本語コメントがある。(3) Enumは指定した3状態を表し、Type名はE_UPPER_SNAKE_CASE、要素は1要素につき1行とする。(4) 不要な補助Typeを追加せず、独自の型名は役割に沿って命名する。特定のサンプル識別子名は強制しない。"
  - id: SKILL-EVAL-016
    category: conflict
    evaluation_type: behavior
    prompt: "Unity EditorのToolsメニューから空のGameObjectを1つ作り、そのObjectを選択状態にする小さなEditor拡張をC#で書いて。生成操作をUndoで戻せるようにして。実行時の常時監視は不要です。"
    expected_primary: unity-implement
    must_include:
      - "MenuItem("
      - "static "
      - "GameObject"
      - "Undo.RegisterCreatedObjectUndo"
    must_not:
      - "MonoBehaviour"
      - "void Update()"
    pass_condition: "合格: (1) Editor専用コードとしてTools/配下のMenuItemを定義し、そのUnity APIが要求するMethodのみstaticとする。(2) 新しい空のGameObjectを1つ生成し、Undo.RegisterCreatedObjectUndoでUndo登録し、Selection.activeObjectまたはSelection.activeGameObjectに設定する。(3) Unity Editor以外の実行時に不要なMonoBehaviour・Update・可変static状態・static classを作らない。メニュー項目名やClass名の固定一致は不要。"