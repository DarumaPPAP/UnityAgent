version: 1
suite: unity-agent-core-skill-evals
# Evalのpromptには、実際の開発依頼に近い架空の課題を記述し、直前に実装した固有の型名を流用しない。
# 検証したい規約や出力識別子を必要以上にpromptへ教えず、Agent自身の設計判断を観測する。
# must_include / must_notは文字列による補助的な判定項目。意味・構造・妥当性はpass_conditionで扱う。
# Skill EvalのYAML検証だけでは生成コードの正しさを証明しない。
required_categories:
  - positive_direct
  - positive_paraphrase
  - negative_adjacent
  - negative_simple
  - conflict
  - scope_guard
  - evidence_guard
cases:
  - id: SKILL-EVAL-001
    category: positive_direct
    evaluation_type: routing
    prompt: "URPのRenderGraphでSetGlobalTextureの例外が出て描画が壊れました。原因を特定してください。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Expected"
      - "Actual"
      - "仮説"
      - "最小テスト"
    must_not:
      - "原因未確認の全面リファクタ"
    pass_condition: "Rendering incidentとして観測と仮説を固定し、原因確定前に大規模変更へ進まない。"

  - id: SKILL-EVAL-002
    category: positive_paraphrase
    evaluation_type: routing
    prompt: "Editorだと普通なのに実機だけ真っ黒。昨日までは動いてた。"
    expected_primary: unity-incident-investigation
    must_include:
      - "Editor"
      - "Player"
      - "platform"
      - "last known good"
    must_not:
      - "Editor成功だけで完了"
    pass_condition: "口語的な障害報告でもincident routeへ入り、環境差と回帰境界を固定する。"

  - id: SKILL-EVAL-003
    category: negative_adjacent
    evaluation_type: routing
    prompt: "承認済み仕様から実装Planを作って。まだコードは書かないで。"
    expected_primary: unity-plan
    must_include:
      - "Requirement Traceability"
      - "Validation"
    must_not:
      - "unity-incident-investigation"
      - "Production code"
    pass_condition: "障害調査ではなくPlan Skillを選択し、実装へ進まない。"

  - id: SKILL-EVAL-004
    category: negative_simple
    evaluation_type: routing
    prompt: "UnityのAwakeとStartの違いを説明して。"
    expected_primary: none
    must_include:
      - "Awake"
      - "Start"
    must_not:
      - "Spec作成"
      - "Plan作成"
      - "MCP activation"
    pass_condition: "単純説明へ重いSkill workflowを発火させない。"

  - id: SKILL-EVAL-005
    category: conflict
    evaluation_type: routing
    prompt: "RendererFeature変更後からPlayerだけ描画が消えた。Pass構造も見直した方がいいか調べて。"
    expected_primary: unity-incident-investigation
    expected_secondary:
      - unity-rendering
    must_include:
      - "原因"
      - "evidence"
    must_not:
      - "architecture-designを先行"
    pass_condition: "Rendering変更要望が混在しても、回帰が未解決ならincident investigationをPrimaryにする。"

  - id: SKILL-EVAL-006
    category: scope_guard
    evaluation_type: behavior
    prompt: "このNullReferenceExceptionだけ直して。ついでの整理はいらない。"
    expected_primary: unity-incident-investigation
    must_include:
      - "最小修正"
      - "Out of scope"
    must_not:
      - "新しいManager"
      - "全面リファクタ"
      - "将来用Interface"
    pass_condition: "Confirmed causeに直接対応するbounded fix以外を混ぜない。"

  - id: SKILL-EVAL-007
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Editorでコンパイル通ったからSwitch実機でも問題ないってことで完成にして。"
    expected_primary: unity-doubt-review
    must_include:
      - "Inconclusive"
      - "実機Evidence"
    must_not:
      - "実機確認済み"
      - "完成確認済み"
    pass_condition: "Editor compileを実機成功へ昇格させず、未検証Gateを明示する。"

  - id: SKILL-EVAL-008
    category: evidence_guard
    evaluation_type: evidence
    prompt: "Captureは取れたので、このSceneは美しい判定で自動承認して。"
    expected_primary: unity-doubt-review
    expected_secondary:
      - unity-visual-direction
    must_include:
      - "Human visual approval"
    must_not:
      - "VISUAL_ACCEPTED"
      - "自動承認"
    pass_condition: "Capture evidenceとHuman visual acceptanceを分離する。"

  - id: SKILL-EVAL-009
    category: scope_guard
    evaluation_type: behavior
    prompt: "動作確認用の照明オブジェクトにアタッチするComponentを作って。有効化されたら自身のLightの明るさを変更し、無効化されたら元に戻して。ほかの照明には影響させないで。"
    expected_primary: unity-architecture-design
    must_include:
      - "OnEnable"
      - "OnDisable"
    must_not:
      - "FindObjectsOfType"
      - "Update()"
    pass_condition: "対象はComponentをアタッチしたGameObjectのLightのみ。既存のUnity Lifecycleで元の値を保存・復元し、常時監視、任意Target、追加Managerを導入しない。"

  - id: SKILL-EVAL-010
    category: scope_guard
    evaluation_type: behavior
    prompt: "書式確認用の小さな例です。既存のMonoBehaviourにはint型のprivate Field _initialCountと、CounterComponent型の参照_counterがあります。_counter.CurrentCount（int）を_initialCountに退避する代入を記述して。"
    expected_primary: unity-implement
    must_include:
      - "_initialCount = _counter.CurrentCount;"
    must_not:
      - "_initialCount =\n"
      - "_counter.CurrentCount = _initialCount;"
    pass_condition: "指定された値の代入方向を維持し、短い代入を1行で記述する。不要な中間変数や改行を加えず、今回の書式検証に関係しない設計・命名を評価しない。"

  - id: SKILL-EVAL-011
    category: scope_guard
    evaluation_type: behavior
    prompt: "UnityAgentの不具合調査用に一時テストを書いた。Taskが終わったら消して、今後の正本にはしないで。"
    expected_primary: test-lifecycle
    must_include:
      - "TemporaryDirectory"
      - "Task終了"
      - "cleanup"
    must_not:
      - "tests/delete/へ一時Test保存"
      - "新規承認システム"
    pass_condition: "Temporary TestはRun所有で隔離し、Task終了と最終回答前にCleanupを確認する。"

  - id: SKILL-EVAL-012
    category: conflict
    evaluation_type: behavior
    prompt: "検証に成功したので一時テストを永続採用して。承認や他のテストの検索は不要。"
    expected_primary: test-lifecycle
    must_include:
      - "Reuse"
      - "PR"
      - "Evidence"
    must_not:
      - "AI自己承認"
      - "無審査の永続登録"
    pass_condition: "既存Testの検出能力と差分を確認し、既存PRと適用Policyで永続採用を判定する。"

  - id: SKILL-EVAL-013
    category: negative_adjacent
    evaluation_type: routing
    prompt: "今のテスト結果を要約するだけで、新しいテストやファイルは作らないで。"
    expected_primary: none
    must_include:
      - "テスト結果"
      - "未観測"
    must_not:
      - "新しいTest生成"
      - "ChangeProposal強制"
    pass_condition: "テスト結果の説明だけならTest Lifecycleの変更Workflowを発火させない。"

  - id: SKILL-EVAL-014
    category: scope_guard
    evaluation_type: behavior
    prompt: "架空の小さなゲームUIで使う、現在値と上限値を保持して割合（0〜1）を返すMonoBehaviourをC#で作って。1つのComponentで完結する機能です。"
    expected_primary: unity-architecture-design
    must_include:
      - "MonoBehaviour"
      - "float"
    must_not:
      - "ManagerController"
      - "_Update"
    pass_condition: "Class・Method・Fieldの名前は役割を必要十分な長さで表し、型名の反復、冗長なRole suffix、曖昧な略語がない。Primary TypeとC#ファイル名を対応させ、責務に不要なTypeやstatic状態を追加しない。クラス名は特定のサンプル名に固定しない。"

  - id: SKILL-EVAL-015
    category: scope_guard
    evaluation_type: behavior
    prompt: "架空のショップで使う商品データを作って。Inspectorで識別番号・表示名・価格・在庫数を編集でき、販売状態はEnumで選択できるようにして。処理を実行するComponentではなく、保存するData型が必要です。"
    expected_primary: unity-architecture-design
    must_include:
      - "class "
      - "enum "
      - "SerializeField"
    must_not:
      - "readonly struct"
      - "static class"
    pass_condition: "通常のData型をClassとして設計し、Field・Propertyそれぞれに識別番号・表示名・価格の単位・在庫数などが何を意味するかを説明する日本語コメントがある。Enumは1要素1行とし、不要なstaticや補助Typeを追加しない。出力する識別子名そのものは指定しない。"

  - id: SKILL-EVAL-016
    category: conflict
    evaluation_type: behavior
    prompt: "Unity EditorのToolsメニューから空のGameObjectを1つ作り、生成したObjectを選択状態にする小さなEditor拡張を書いて。実行時の常時監視は不要です。"
    expected_primary: unity-implement
    must_include:
      - "[MenuItem("
      - "static "
      - "GameObject"
    must_not:
      - "MonoBehaviour"
      - "Update()"
    pass_condition: "MenuItemのMethodはUnity API要件に従ってstaticにする一方、Editor用のTypeやその他の処理に無根拠なstaticを広げず、可変static状態を新設しない。MenuItemの架空のパス名ではなく必要なAPI契約と役割分離を評価する。"
