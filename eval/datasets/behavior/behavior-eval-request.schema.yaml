schema_version: "1.1"
kind: unityagent_behavior_eval_request_schema

required_fields:
  - schema_version
  - run_id
  - golden_task_id
  - unityagent_revision
  - task
  - execution
  - workspace
  - evidence
  - result_root

task_fields:
  summary: optional
  production_prompt:
    required_for: [production_smoke]
    type: string

execution_fields:
  mode:
    required: true
    allowed:
      - prompt
      - graph_loop
  profile: required
  work_kind: required
  max_agent_attempts:
    required: true
    minimum: 1

workspace_fields:
  fixture: required
  mutation_mode:
    required: true
    allowed:
      - sandbox
  allowed_paths:
    required: false
    item: repository_relative_path
  prohibited_paths:
    required: false
    item: repository_relative_path

evidence_fields:
  require: []
  optional: []

observed_evidence_fields:
  required: false
  item:
    id: required
    gate: required
    status:
      allowed: [passed, failed, unavailable]
    source: required
    scope: optional
    statement: optional

rules:
  golden_expectation_is_not_part_of_request: true
  production_prompt_is_user_facing_task_not_expected_answer: true
  expected_route_is_forbidden_in_production_prompt_contract: true
  required_signals_are_forbidden_in_production_prompt_contract: true
  forbidden_signals_are_forbidden_in_production_prompt_contract: true
  observed_evidence_is_trusted_input_evidence_not_golden_expectation: true
  smoke_max_agent_attempts_must_equal_one: true
  production_smoke_max_agent_attempts_must_equal_one: true
  mutation_mode_must_be_sandbox: true
  fixture_must_be_repository_relative: true
  mutation_scope_paths_must_be_repository_relative: true
  mutation_scope_must_be_transferred_to_execution_owner: true
  result_root_must_be_under_Artifacts_BehaviorEval: true
  provider_credentials_are_forbidden: true
  provider_selection_policy_is_not_owned_by_request: true
  execution_budget_is_not_owned_by_request: true
  loop_or_retry_policy_is_not_owned_by_request: true
  production_execution_mode_vocabulary_must_match_execution_owner: true
