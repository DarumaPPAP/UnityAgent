schema_version: "1.1"
kind: unityagent_golden_task_schema

required_fields:
  - id
  - category
  - kind
  - pair_id
  - boundary
  - task
  - expectation
  - graders

allowed:
  kind:
    - regression
  boundary:
    - require
    - forbid
  grader_type:
    - deterministic
    - domain
    - human_or_model

expectation_fields:
  route: optional
  fingerprint: optional
  required_policies: []
  required_gates: []
  required_signals: []
  forbidden_signals: []
  required_knowledge: []
  naming: optional
  outcome: required

naming_expectation_fields:
  required_type_names: []
  forbidden_type_names: []
  required_identifiers: []
  forbidden_identifiers: []
  require_no_new_type: false
  require_naming_gate: true

rules:
  ids_are_unique: true
  pair_id_requires_at_least_two_cases: true
  pair_should_cover_opposite_boundary_decisions: true
  deterministic_grader_is_required: true
  naming_category_requires_type_naming_grader: true
  naming_category_requires_artifact_evidence: true
  required_and_forbidden_identifiers_must_not_overlap: true
  require_no_new_type_conflicts_with_required_type_names: true
  exact_generated_source_match_is_forbidden_by_default: true
  unavailable_is_not_passed: true
