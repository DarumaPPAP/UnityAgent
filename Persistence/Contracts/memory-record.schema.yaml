$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:persistence:memory-record
title: MemoryRecord
type: object
additionalProperties: false
required: [schema_version, memory_id, statement, scope_class, confidence, source_evidence_refs, created_at, updated_at]
properties:
  schema_version: {const: '1.0'}
  memory_id: {type: string, minLength: 1}
  statement: {type: string, minLength: 1}
  scope_class:
    enum: [project_internal, portable_artifact, public_reference]
  confidence:
    enum: [verified, probable, unverified]
  source_evidence_refs:
    type: array
    items: {type: string, minLength: 1}
    minItems: 1
    uniqueItems: true
  created_at: {type: string, format: date-time}
  updated_at: {type: string, format: date-time}
  applicability:
    type: array
    items: {type: string}
  limits:
    type: array
    items: {type: string}
