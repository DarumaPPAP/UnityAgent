$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:persistence:loop-control-state
title: LoopControlState
type: object
additionalProperties: false
required: [schema_version, run_id, loop_id, semantic_attempt, progress_marker, decision, updated_at]
properties:
  schema_version: {const: '1.0'}
  run_id: {type: string, minLength: 1}
  loop_id: {type: string, minLength: 1}
  semantic_attempt: {type: integer, minimum: 0}
  progress_marker: {type: [string, 'null']}
  decision:
    enum: [continue, replan, exit, blocked]
  replan_reason: {type: [string, 'null']}
  updated_at: {type: string, format: date-time}
