$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:persistence:run-checkpoint
title: RunCheckpoint
type: object
additionalProperties: false
required: [schema_version, checkpoint_id, run_id, created_at, reason, execution_state_ref, workflow_state_ref, loop_control_state_refs, evidence_refs, definition_fingerprint]
properties:
  schema_version:
    enum: ['1.0', '1.1']
  checkpoint_id: {type: string, minLength: 1}
  run_id: {type: string, minLength: 1}
  created_at: {type: string, format: date-time}
  reason: {type: string, minLength: 1}
  execution_state_ref: {type: string, minLength: 1}
  workflow_state_ref: {type: string, minLength: 1}
  loop_control_state_refs:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  evidence_refs:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  definition_fingerprint:
    $ref: urn:unityagent:persistence:definition-fingerprint
  state_snapshot_hashes:
    type: object
    additionalProperties: false
    required: [execution_state, workflow_state, loop_control_states]
    properties:
      execution_state: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      workflow_state: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      loop_control_states:
        type: object
        additionalProperties:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
  checkpoint_hash:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  migration_from:
    anyOf:
      - type: 'null'
      - type: object
        additionalProperties: false
        required: [checkpoint_id, schema_version]
        properties:
          checkpoint_id: {type: string, minLength: 1}
          schema_version: {type: string, minLength: 1}
allOf:
  - if:
      properties:
        schema_version: {const: '1.1'}
    then:
      required: [state_snapshot_hashes, checkpoint_hash, migration_from]
