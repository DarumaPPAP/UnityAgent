$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:rag:retrieval-request
title: RetrievalRequest
type: object
additionalProperties: false
required: [schema_version, request_id, query, route_id, execution_profile, filters, limits, sources]
properties:
  schema_version: {const: '1.0'}
  request_id: {type: string, pattern: '^[A-Za-z0-9._:-]+$'}
  query:
    type: object
    additionalProperties: false
    required: [raw, normalized, tokens, technical_tokens]
    properties:
      raw: {type: string, minLength: 1}
      normalized: {type: string, minLength: 1}
      tokens: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      technical_tokens: {type: array, items: {type: string, minLength: 1}}
  route_id: {type: string, minLength: 1}
  execution_profile: {enum: [generic_planning, personal_full_control, team_safe_import]}
  filters:
    type: object
    additionalProperties: false
    properties:
      repository: {type: [string, 'null']}
      project_id: {type: [string, 'null']}
      engine: {type: [string, 'null']}
      unity_version: {type: [string, 'null']}
      unity_version_major: {type: [string, 'null']}
      render_pipeline: {type: [string, 'null']}
      pipeline_version: {type: [string, 'null']}
      platforms: {type: array, items: {type: string, minLength: 1}}
      domains: {type: array, items: {type: string, minLength: 1}}
      topics: {type: array, items: {type: string, minLength: 1}}
      tags: {type: array, items: {type: string, minLength: 1}}
      source_kind: {type: [string, 'null']}
      document_id: {type: [string, 'null']}
      review_status: {type: [string, 'null']}
      confidence: {type: [string, 'null']}
  limits:
    type: object
    additionalProperties: false
    required: [top_k, candidate_k, max_chars]
    properties:
      top_k: {type: integer, minimum: 1, maximum: 20}
      candidate_k: {type: integer, minimum: 1, maximum: 200}
      max_chars: {type: integer, minimum: 256, maximum: 100000}
  sources: {type: array, items: {type: string, minLength: 1}}
