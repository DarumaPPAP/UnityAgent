$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:rag:qdrant-collection
title: QdrantCollectionSchema
type: object
additionalProperties: false
required: [schema_version, kind, dense, sparse, payload_indexes]
properties:
  schema_version: {const: '1.0'}
  kind: {const: qdrant_collection_schema}
  dense:
    type: object
    additionalProperties: false
    required: [name, size, distance]
    properties:
      name: {type: string, minLength: 1}
      size: {type: integer, minimum: 1}
      distance: {enum: [Cosine, Dot, Euclid, Manhattan]}
  sparse:
    type: object
    additionalProperties: false
    required: [name, encoding]
    properties:
      name: {type: string, minLength: 1}
      encoding: {enum: [bm25, sparse_keyword]}
  payload_indexes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [field_name, field_schema]
      properties:
        field_name: {type: string, minLength: 1}
        field_schema: {enum: [keyword, integer, float, bool, geo, text, datetime]}
