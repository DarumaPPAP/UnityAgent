$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:rag:ranking-config
title: RAGRankingConfig
type: object
additionalProperties: false
required: [schema_version, kind, algorithm, rrf, reranker, candidate_k, top_k]
properties:
  schema_version: {const: '1.0'}
  kind: {const: rag_ranking_config}
  algorithm: {enum: [rrf, weighted_rrf]}
  rrf:
    type: object
    additionalProperties: false
    required: [k, weights, revision]
    properties:
      k: {type: integer, minimum: 1}
      weights:
        type: object
        additionalProperties: {type: number, minimum: 0}
      revision: {type: string, minLength: 1}
  reranker:
    type: object
    additionalProperties: false
    required: [enabled, revision]
    properties:
      enabled: {type: boolean}
      revision: {type: string, minLength: 1}
  candidate_k: {type: integer, minimum: 1, maximum: 200}
  top_k: {type: integer, minimum: 1, maximum: 20}
