name: One-shot v0.0.7 Release Prep

on:
  push:
    branches:
      - release/0.0.7-beta-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare canonical v0.0.7-beta version
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '\r\n' < VERSION)"
          if [ "$current" = "0.0.7-beta" ]; then
            echo "v0.0.7-beta is already prepared; nothing to do."
            exit 0
          fi
          if [ "$current" != "0.0.6-beta" ]; then
            echo "::error::Unexpected VERSION: $current"
            exit 1
          fi
          python tools/one_shot_prepare_v007.py

      - name: Validate version contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.0.7-beta"
          grep -q '"version": "0.0.7-beta"' Packages/com.darumappap.unity-agent/package.json
          grep -q 'version = "0.0.7b0"' pyproject.toml
          grep -q 'internal const string Channel = "0.0.7-beta"' Packages/com.darumappap.unity-agent/Editor/UnityAgentControlPlaneBootstrap.cs
          grep -q 'internal const string ReleaseTag = "v0.0.7-beta"' Packages/com.darumappap.unity-agent/Editor/UnityAgentControlPlaneBootstrap.cs
          grep -q '^# UnityAgent 0.0.7-beta$' RELEASE_NOTES.md
          old_refs="$(git grep -l '0.0.6-beta' -- ':!/.github/workflows/validate-agent-contracts.yml' ':!/.github/workflows/one-shot-v007-version-inventory.yml' ':!/.github/workflows/one-shot-v007-release-prep.yml' ':!/tools/one_shot_prepare_v007.py' || true)"
          if [ -n "$old_refs" ]; then
            echo "::error::Unexpected old canonical version references remain:"
            echo "$old_refs"
            exit 1
          fi

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python Tools/validate_all.py
          python Tools/SkillValidator/validate_skills.py --strict

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No release-prep changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v0.0.7-beta"
          git push origin HEAD:release/0.0.7-beta-prep
