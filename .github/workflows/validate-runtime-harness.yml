name: Validate Runtime Harness

on:
  pull_request:
    paths:
      - "Runtime/**"
      - "AGENTS.md"
      - "docs/migration/runtime-harness.md"
      - ".github/workflows/validate-runtime-harness.yml"
  push:
    branches: [main]
    paths:
      - "Runtime/**"
      - "AGENTS.md"
      - ".github/workflows/validate-runtime-harness.yml"

jobs:
  runtime-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Runtime contracts and integration
        run: python -m unittest discover -s Runtime/Tests -p "test_*.py"
      - name: Canonical legacy replay remains valid
        run: python -m unittest discover -s Eval/Tests -p "test_*.py"
