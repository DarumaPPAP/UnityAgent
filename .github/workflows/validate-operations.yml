name: Validate Operations

on:
  pull_request:
    paths:
      - "Operations/**"
      - "Runtime/Telemetry/**"
      - "Runtime/Control/**"
      - "Orchestration/Control/**"
      - "Policy/Approval/**"
      - "AGENTS.md"
      - "docs/migration/operations.md"
      - ".github/workflows/validate-operations.yml"
  push:
    branches: [main]
    paths:
      - "Operations/**"
      - "Runtime/Telemetry/**"
      - "Runtime/Control/**"
      - "Orchestration/Control/**"
      - "AGENTS.md"
      - ".github/workflows/validate-operations.yml"

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Operations tests
        run: python -m unittest discover -s Operations/Tests -p "test_*.py"
      - name: Previous authority boundaries remain green
        run: |
          python -m unittest discover -s Runtime/Tests -p "test_*.py"
          python -m unittest discover -s Orchestration/Tests -p "test_*.py"
          python -m unittest discover -s Persistence/Tests -p "test_*.py"
          python -m unittest discover -s Eval/Tests -p "test_*.py"
      - name: Local contract validator remains green
        run: python Tools/validate_all.py
