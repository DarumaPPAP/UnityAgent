name: Production E2E Contract (smoke-only; E2E not verified)
on:
  pull_request:
    paths:
      - 'src/unityagent/control_plane/private_production_ci.py'
      - 'src/unityagent/control_plane/rock_import.py'
      - 'tests/smoke/**'
      - 'ci/private/**'
      - '.github/workflows/production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical UnityAgent dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Smoke-only compatibility (NOT Production E2E)
        run: |
          python tools/validate_all.py --profile smoke
          echo "::warning::BLOCKED_NOT_RUN: private approval, E2E evidence and Unity Editor regressions were deleted. This job does not verify Production E2E."
      - name: Public workflow must not dispatch onto a licensed self-hosted runner
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/production-e2e.yml').read_text())
          for job in workflow['jobs'].values():
              assert 'self-hosted' not in str(job.get('runs-on'))
          triggers = workflow.get('on', workflow.get(True, {}))
          dispatch = triggers.get('workflow_dispatch') or {}
          assert 'staged_fbx' not in (dispatch.get('inputs') or {})
          PY
