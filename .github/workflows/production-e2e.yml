name: Production E2E Contract (public)
on:
  pull_request:
    paths:
      - 'src/unityagent/control_plane/private_production_ci.py'
      - 'src/unityagent/control_plane/rock_import.py'
      - 'tests/runtime/test_private_production_ci.py'
      - 'tests/runtime/test_production_e2e_evidence.py'
      - 'tests/unity/verify/collect_evidence.py'
      - 'ci/private/**'
      - '.github/workflows/production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical UnityAgent dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Private CI approval and state contract tests (no Editor)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.runtime.test_private_production_ci tests.runtime.test_production_e2e_evidence -v
      - name: Public workflow must not dispatch onto a licensed self-hosted runner
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/production-e2e.yml').read_text())
          for job in workflow['jobs'].values():
              assert 'self-hosted' not in str(job.get('runs-on'))
          triggers = workflow.get('on', workflow.get(True, {}))
          assert 'staged_fbx' not in triggers.get('workflow_dispatch', {}).get('inputs', {})
          PY
