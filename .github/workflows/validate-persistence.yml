name: Validate Persistence

on:
  pull_request:
    paths:
      - "Persistence/**"
      - "Context/Retrieval/Memory/**"
      - "AGENTS.md"
      - "docs/migration/phase5-persistence.md"
      - ".github/workflows/validate-persistence.yml"
  push:
    branches: [main]
    paths:
      - "Persistence/**"
      - "Context/Retrieval/Memory/**"
      - "AGENTS.md"
      - ".github/workflows/validate-persistence.yml"

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Persistence contracts and integration
        run: python -m unittest discover -s Persistence/Tests -p "test_*.py"
      - name: Context memory boundary remains green
        run: python -m unittest discover -s Context/Tests -p "test_*.py"
      - name: Orchestration state projection boundary remains green
        run: python -m unittest discover -s Orchestration/Tests -p "test_*.py"
      - name: Runtime evidence boundary remains green
        run: python -m unittest discover -s Runtime/Tests -p "test_*.py"
      - name: Canonical Eval replay remains green
        run: python -m unittest discover -s Eval/Tests -p "test_*.py"
