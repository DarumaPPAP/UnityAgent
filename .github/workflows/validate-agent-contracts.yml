name: Validate UnityAgent Contracts

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".ai/**"
      - "AGENTS.md"
      - "README.md"
      - "SkillReferences/**"
      - "Tools/**"
      - "Tests/**"
      - ".github/workflows/validate-agent-contracts.yml"
      - ".github/workflows/actual-behavior-eval.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/skills/**"
      - ".ai/**"
      - "AGENTS.md"
      - "README.md"
      - "SkillReferences/**"
      - "Tools/**"
      - "Tests/**"
      - ".github/workflows/validate-agent-contracts.yml"
      - ".github/workflows/actual-behavior-eval.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate UnityAgent locally-equivalent contracts
        run: python Tools/validate_all.py
