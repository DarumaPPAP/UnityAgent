name: Validate UnityAgent Contracts

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".ai/**"
      - "Tools/SkillValidator/**"
      - "Tools/ContractValidator/**"
      - "Tests/ContractValidator/**"
      - ".github/workflows/validate-agent-contracts.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/skills/**"
      - ".ai/**"
      - "Tools/SkillValidator/**"
      - "Tools/ContractValidator/**"
      - "Tests/ContractValidator/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted((Path('.ai')).rglob('*.yaml'))
          paths += sorted((Path('Tests/ContractValidator')).rglob('*.yaml'))
          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'validated: {path}')
          PY

      - name: Validate Skills
        run: python Tools/SkillValidator/validate_skills.py

      - name: Validate Knowledge and Task Contracts
        run: python Tools/ContractValidator/validate_contracts.py
