name: Validate UnityAgent Contracts

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "Policy/**"
      - "Context/**"
      - "Orchestration/**"
      - "Runtime/**"
      - "Persistence/**"
      - "Operations/**"
      - "Eval/**"
      - "SkillReferences/**"
      - "Tools/**"
      - "scripts/**"
      - ".github/workflows/validate-agent-contracts.yml"
      - ".github/workflows/actual-behavior-eval.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "Policy/**"
      - "Context/**"
      - "Orchestration/**"
      - "Runtime/**"
      - "Persistence/**"
      - "Operations/**"
      - "Eval/**"
      - "SkillReferences/**"
      - "Tools/**"
      - "scripts/**"
      - ".github/workflows/validate-agent-contracts.yml"
      - ".github/workflows/actual-behavior-eval.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate UnityAgent canonical contracts
        run: python Tools/validate_all.py

      - name: Enforce Skill authoring quality
        run: python Tools/SkillValidator/validate_skills.py --strict

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell installer syntax validation passed."
