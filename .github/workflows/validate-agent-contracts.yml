name: UnityAgent CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unityagent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Canonical Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e . build "setuptools>=68" wheel

      - name: Validate pull request branch policy
        run: python tools/branch_policy/validate_branch_policy.py --branch "${{ github.head_ref || github.ref_name }}" --event "${{ github.event_name }}"

      - name: Validate canonical repository contracts
        run: python tools/validate_all.py

      - name: Build and verify installed Python wheel
        run: |
          python -m build
          python tools/verify_installed_wheel.py --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Set up .NET for co-located Artist CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile co-located Artist CLI and validate contracts
        run: |
          dotnet build subagent/artist_subagent/tools/host/UnityArtist.Tools.csproj --configuration Release
          python -m unittest discover -s tests/subagent/artist/tools -p "test_*.py" -v

      - name: Validate migrated Unity P9 fixtures and host runner
        run: |
          python tests/unity/verify/validate_unity_fixtures.py
          python -m unittest discover -s tests/unity/verify -p "test_unity_ci*.py" -v
          python -m unittest discover -s tests/packaging -p "test_p9_release_evidence.py" -v

      - name: Validate Unity Editor PackageInfo qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Packages/com.darumappap.unity-agent/Editor/ControlPlaneBootstrap.cs")
          text = path.read_text(encoding="utf-8")
          required = "UnityEditor.PackageManager.PackageInfo.FindForAssembly"
          if required not in text:
              raise SystemExit(
                  "ControlPlaneBootstrap.cs must fully qualify "
                  "UnityEditor.PackageManager.PackageInfo.FindForAssembly to avoid CS0104."
              )
          if "using UnityEditor.PackageManager;" in text:
              raise SystemExit(
                  "ControlPlaneBootstrap.cs must not import UnityEditor.PackageManager "
                  "while UnityEditor is also imported; PackageInfo becomes ambiguous on Unity 6."
              )
          print("Unity PackageInfo qualification validation passed.")
          PY

      - name: Validate checksum parser hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/install.ps1"),
              Path("Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "Resolve-ExpectedHash" not in text:
                  raise SystemExit(f"{path} must use the canonical checksum parser")
              if "[IO.Path]::GetFileName" not in text:
                  raise SystemExit(f"{path} must normalize checksum entry paths to basenames")
              if "^[.][\\\\/]+" not in text:
                  raise SystemExit(f"{path} must accept legacy ./ or .\\ checksum prefixes")
          print("Checksum parser hardening validation passed.")
          PY

      - name: Validate managed Control Plane and Codex Desktop discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          installers = [
              Path("scripts/install.ps1"),
              Path("Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1"),
          ]
          for path in installers:
              text = path.read_text(encoding="utf-8")
              required = (
                  "LocalApplicationData",
                  "UnityAgent\\ControlPlane\\",
                  '"-m", "venv"',
                  "UnityAgent\\bin",
                  "UNITY_AGENT_CONTROL_PLANE",
                  "--disable-pip-version-check",
                  "GITHUB_TOKEN",
                  'headers["Authorization"]',
              )
              for token in required:
                  if token not in text:
                      raise SystemExit(f"{path} is missing managed Control Plane contract: {token}")
              if '"--user"' in text:
                  raise SystemExit(f"{path} must not install the Control Plane with pip --user")

          resolver = Path("Packages/com.darumappap.unity-agent/Editor/ControlPlanePathResolver.cs").read_text(encoding="utf-8")
          if "UnityAgent LocalAppData runtime" not in resolver or 'Path.Combine(localAppData, "UnityAgent", "ControlPlane")' not in resolver:
              raise SystemExit("Control Plane resolver must prefer the managed LocalAppData runtime")

          codex = Path("Packages/com.darumappap.unity-agent/Editor/CodexPathResolver.cs").read_text(encoding="utf-8")
          for token in ("Codex Desktop managed runtime", '".codex", "packages", "standalone", "releases"', '"Programs", "OpenAI", "Codex", "bin"'):
              if token not in codex:
                  raise SystemExit(f"Codex resolver is missing desktop runtime discovery: {token}")
          print("Managed runtime and Codex Desktop discovery validation passed.")
          PY

      - name: Enforce Skill authoring quality
        run: python tools/skill_validator/validate_skills.py --strict

      - name: Validate co-located SubAgent source compatibility
        run: python tools/validate_local_subagent_catalog.py

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/install.ps1",
            "Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              exit 1
            }
            Write-Host "PowerShell syntax validation passed: $script"
          }

      - name: Validate packed UPM bootstrap contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-upm
          (
            cd Packages/com.darumappap.unity-agent
            npm pack --pack-destination "$GITHUB_WORKSPACE/.tmp-upm" >/dev/null
          )
          archive="$(find .tmp-upm -maxdepth 1 -type f -name 'com.darumappap.unity-agent-*.tgz' -print -quit)"
          test -n "$archive"
          python3 - "$archive" <<'PY'
          import sys
          import tarfile

          archive = sys.argv[1]
          required = {
              "package/package.json",
              "package/package.json.meta",
              "package/Editor.meta",
              "package/Editor/DarumaPPAP.UnityAgent.Editor.asmdef.meta",
              "package/Editor/CodexPathResolver.cs.meta",
              "package/Editor/ControlPlanePathResolver.cs.meta",
              "package/Editor/ControlPlaneBootstrap.cs",
              "package/Editor/ControlPlaneBootstrap.cs.meta",
              "package/Editor/ControlPlaneClient.cs.meta",
              "package/Editor/SetupWindow.cs.meta",
              "package/Editor/SetupVerificationPanel.cs.meta",
              "package/Editor/VerificationFixtureSource.cs",
              "package/Editor/VerificationFixtureSource.cs.meta",
              "package/Editor/Verification~/p9-source-manifest.json",
              "package/Editor/Verification~/tests/unity/scripts/run-unity-tests.ps1",
              "package/Editor/Verification~/tests/unity/matrix.yaml",
              "package/Editor/Verification~/subagent/artist_subagent/tools/editor/package.json",
              "package/Editor/Bootstrap~/install-control-plane.ps1",
          }
          with tarfile.open(archive, "r:gz") as package:
              names = set(package.getnames())
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Packed UPM is missing bootstrap/meta files: " + ", ".join(missing))
          print(f"Packed UPM bootstrap validation passed: {len(required)} required files")
          PY

      - name: Validate Production Smoke integration contract
        run: |
          python -m unittest discover -s .github/ProductionSmoke -p "test_*.py"
          python -m unittest tests.eval.test_rebaseline
          python -m py_compile \
            .github/ProductionSmoke/run_one_repo_smoke.py \
            eval/behavior/grade_production_smoke.py \
            eval/rebaseline/rebaseline.py \
            eval/rebaseline/build_rebaseline_summary.py \
            eval/rebaseline/validate_rebaseline_summary.py \
            eval/regression/baseline_comparator.py \
            eval/regression/compare_baseline.py \
            tools/run_regression_gate.py

      - name: Enforce manual-only Production Smoke
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*pull_request:' .github/workflows/production-smoke.yml; then
            echo "::error::Real Production Smoke must not be an automatic pull_request workflow."
            exit 1
          fi
          grep -Eq '^[[:space:]]*workflow_dispatch:' .github/workflows/production-smoke.yml
          grep -Fq 'BLOCKED_NOT_RUN' .github/workflows/production-smoke.yml
          grep -Fq 'eval/rebaseline/build_rebaseline_summary.py' .github/workflows/production-smoke.yml
          if grep -Fq 'SMOKE_CASE' .github/workflows/production-smoke.yml; then
            echo "::error::Production Smoke must execute the complete suite."
            exit 1
          fi
          test -f .github/ProductionSmoke/run_one_repo_smoke.py
          test ! -e tools/production_smoke/run_one_repo_smoke.py
          test ! -e tests/operations/test_one_repo_production_smoke.py

  project-lease-windows:
    name: Windows Project Lease
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Control Plane
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify OS lease and environment-independent namespace
        run: python -m unittest tests.runtime.test_project_lease -v
