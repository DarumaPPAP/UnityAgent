name: UnityAgent CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unityagent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    # Required check name is retained for branch-protection compatibility.
    # Validation SCOPE is deliberately narrower: no full product regression.
    name: Canonical Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e . build "setuptools>=68" wheel

      - name: Validate pull request branch policy
        run: python tools/branch_policy/validate_branch_policy.py --branch "${{ github.head_ref || github.ref_name }}" --event "${{ github.event_name }}"

      - name: Enforce Japanese PR title and required sections
        if: github.event_name == 'pull_request'
        run: python tools/pr_quality/validate_pr.py --event "$GITHUB_EVENT_PATH"

      - name: Bootstrap / connection / read-only Smoke ONLY
        run: |
          python tools/validate_all.py --profile smoke
          python -m py_compile tests/smoke/live_connection.py

      - name: Skill authoring quality
        run: python tools/skill_validator/validate_skills.py --strict

      - name: Build and verify installed Python wheel
        run: |
          python -m build
          python tools/verify_installed_wheel.py --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Explicitly report removed regression coverage
        run: |
          echo "::warning::Mutation, Approval, Evidence, Unity Editor/Player/Device E2E and old test fixtures are NOT VERIFIED. This CI gate is smoke-only."
