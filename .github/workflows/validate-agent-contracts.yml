name: UnityAgent CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unityagent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Canonical Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate canonical repository contracts
        run: python Tools/validate_all.py

      - name: Validate Unity Editor PackageInfo qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Packages/com.darumappap.unity-agent/Editor/UnityAgentControlPlaneBootstrap.cs")
          text = path.read_text(encoding="utf-8")
          required = "UnityEditor.PackageManager.PackageInfo.FindForAssembly"
          if required not in text:
              raise SystemExit(
                  "UnityAgentControlPlaneBootstrap.cs must fully qualify "
                  "UnityEditor.PackageManager.PackageInfo.FindForAssembly to avoid CS0104."
              )
          if "using UnityEditor.PackageManager;" in text:
              raise SystemExit(
                  "UnityAgentControlPlaneBootstrap.cs must not import UnityEditor.PackageManager "
                  "while UnityEditor is also imported; PackageInfo becomes ambiguous on Unity 6."
              )
          print("Unity PackageInfo qualification validation passed.")
          PY

      - name: Validate checksum parser hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/install.ps1"),
              Path("Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "Resolve-ExpectedHash" not in text:
                  raise SystemExit(f"{path} must use the canonical checksum parser")
              if "[IO.Path]::GetFileName" not in text:
                  raise SystemExit(f"{path} must normalize checksum entry paths to basenames")
              if "^[.][\\/]+" not in text:
                  raise SystemExit(f"{path} must accept legacy ./ or .\\ checksum prefixes")
          print("Checksum parser hardening validation passed.")
          PY

      - name: Validate managed Control Plane and Codex Desktop discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          installers = [
              Path("scripts/install.ps1"),
              Path("Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1"),
          ]
          for path in installers:
              text = path.read_text(encoding="utf-8")
              required = (
                  "LocalApplicationData",
                  "UnityAgent\\ControlPlane\\",
                  '"-m", "venv"',
                  "UnityAgent\\bin",
                  "UNITY_AGENT_CONTROL_PLANE",
                  "--disable-pip-version-check",
                  "GITHUB_TOKEN",
                  'headers["Authorization"]',
              )
              for token in required:
                  if token not in text:
                      raise SystemExit(f"{path} is missing managed Control Plane contract: {token}")
              if '"--user"' in text:
                  raise SystemExit(f"{path} must not install the Control Plane with pip --user")

          resolver = Path("Packages/com.darumappap.unity-agent/Editor/UnityAgentControlPlanePathResolver.cs").read_text(encoding="utf-8")
          if "UnityAgent LocalAppData runtime" not in resolver or 'Path.Combine(localAppData, "UnityAgent", "ControlPlane")' not in resolver:
              raise SystemExit("Control Plane resolver must prefer the managed LocalAppData runtime")

          codex = Path("Packages/com.darumappap.unity-agent/Editor/UnityAgentCodexPathResolver.cs").read_text(encoding="utf-8")
          for token in ("Codex Desktop managed runtime", '".codex", "packages", "standalone", "releases"', '"Programs", "OpenAI", "Codex", "bin"'):
              if token not in codex:
                  raise SystemExit(f"Codex resolver is missing desktop runtime discovery: {token}")
          print("Managed runtime and Codex Desktop discovery validation passed.")
          PY

      - name: Enforce Skill authoring quality
        run: python Tools/SkillValidator/validate_skills.py --strict

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/install.ps1",
            "Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              exit 1
            }
            Write-Host "PowerShell syntax validation passed: $script"
          }

      - name: Validate packed UPM bootstrap contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-upm
          (
            cd Packages/com.darumappap.unity-agent
            npm pack --pack-destination "$GITHUB_WORKSPACE/.tmp-upm" >/dev/null
          )
          archive="$(find .tmp-upm -maxdepth 1 -type f -name 'com.darumappap.unity-agent-*.tgz' -print -quit)"
          test -n "$archive"
          python3 - "$archive" <<'PY'
          import sys
          import tarfile

          archive = sys.argv[1]
          required = {
              "package/package.json",
              "package/package.json.meta",
              "package/Editor.meta",
              "package/Editor/DarumaPPAP.UnityAgent.Editor.asmdef.meta",
              "package/Editor/UnityAgentCodexPathResolver.cs.meta",
              "package/Editor/UnityAgentControlPlanePathResolver.cs.meta",
              "package/Editor/UnityAgentControlPlaneBootstrap.cs",
              "package/Editor/UnityAgentControlPlaneBootstrap.cs.meta",
              "package/Editor/UnityAgentControlPlaneClient.cs.meta",
              "package/Editor/UnityAgentSetupWindow.cs.meta",
              "package/Editor/Bootstrap~/install-control-plane.ps1",
          }
          with tarfile.open(archive, "r:gz") as package:
              names = set(package.getnames())
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Packed UPM is missing bootstrap/meta files: " + ", ".join(missing))
          print(f"Packed UPM bootstrap validation passed: {len(required)} required files")
          PY

      - name: Validate Production Smoke integration contract
        run: |
          python -m unittest discover -s .github/ProductionSmoke -p "test_*.py"
          python -m unittest Eval.Tests.test_rebaseline
          python -m py_compile \
            .github/ProductionSmoke/run_one_repo_smoke.py \
            Eval/Behavior/grade_production_smoke.py \
            Eval/Rebaseline/rebaseline.py \
            Eval/Rebaseline/build_rebaseline_summary.py \
            Eval/Rebaseline/validate_rebaseline_summary.py \
            Eval/Regression/baseline_comparator.py \
            Eval/Regression/compare_baseline.py \
            Tools/run_regression_gate.py

      - name: Enforce manual-only Production Smoke
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*pull_request:' .github/workflows/production-smoke.yml; then
            echo "::error::Real Production Smoke must not be an automatic pull_request workflow."
            exit 1
          fi
          grep -Eq '^[[:space:]]*workflow_dispatch:' .github/workflows/production-smoke.yml
          grep -Fq 'BLOCKED_NOT_RUN' .github/workflows/production-smoke.yml
          grep -Fq 'Eval/Rebaseline/build_rebaseline_summary.py' .github/workflows/production-smoke.yml
          if grep -Fq 'SMOKE_CASE' .github/workflows/production-smoke.yml; then
            echo "::error::Production Smoke must execute the complete suite."
            exit 1
          fi
          test -f .github/ProductionSmoke/run_one_repo_smoke.py
          test ! -e Tools/ProductionSmoke/run_one_repo_smoke.py
          test ! -e Operations/Tests/test_one_repo_production_smoke.py
