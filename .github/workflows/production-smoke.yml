name: One-repo Production Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Codex model used by the canonical Runtime runner
        required: true
        default: gpt-5.6-sol
        type: string
      reasoning_effort:
        description: Runtime reasoning effort
        required: true
        default: high
        type: choice
        options:
          - medium
          - high
          - xhigh

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMOKE_RUN_ID: phase9-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_MODEL: ${{ inputs.model }}
      SMOKE_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate smoke and re-baseline integration boundaries
        run: |
          python -m unittest discover -s .github/ProductionSmoke -p "test_*.py"
          python -m unittest Eval.Tests.test_phase9_rebaseline
          python -m py_compile \
            .github/ProductionSmoke/run_one_repo_smoke.py \
            Eval/Behavior/grade_production_smoke.py \
            Eval/Rebaseline/rebaseline.py \
            Eval/Rebaseline/build_rebaseline_summary.py

      - name: Production credential preflight
        shell: bash
        run: |
          mkdir -p "Artifacts/ProductionSmoke/$SMOKE_RUN_ID"
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            cat > "Artifacts/ProductionSmoke/$SMOKE_RUN_ID/preflight.json" <<'JSON'
          {
            "schema_version": "1.0",
            "status": "BLOCKED_NOT_RUN",
            "reason": "OPENAI_API_KEY repository secret is not configured",
            "production_execution_observed": false
          }
          JSON
            echo "::error::Real Production Smoke was not executed because OPENAI_API_KEY is not configured."
            exit 1
          fi
          cat > "Artifacts/ProductionSmoke/$SMOKE_RUN_ID/preflight.json" <<'JSON'
          {
            "schema_version": "1.0",
            "status": "READY",
            "reason": null,
            "production_execution_observed": false
          }
          JSON

      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Record runtime versions
        shell: bash
        run: |
          codex_version="$(codex --version | head -n 1)"
          echo "CODEX_VERSION=$codex_version" >> "$GITHUB_ENV"
          echo "$codex_version"
          python --version
          dotnet --version

      - name: Execute, grade and aggregate one-repo Production Smoke
        shell: bash
        run: |
          set +e
          python .github/ProductionSmoke/run_one_repo_smoke.py \
            --run-id "$SMOKE_RUN_ID" \
            --model "$SMOKE_MODEL" \
            --reasoning-effort "$SMOKE_REASONING_EFFORT" \
            --timeout-seconds 240
          execution_code=$?

          python Eval/Behavior/grade_production_smoke.py --run-id "$SMOKE_RUN_ID"
          grade_code=$?

          python Eval/Rebaseline/build_rebaseline_summary.py \
            --run-id "$SMOKE_RUN_ID" \
            --source-revision "$GITHUB_SHA" \
            --model "$SMOKE_MODEL" \
            --reasoning-effort "$SMOKE_REASONING_EFFORT" \
            --codex-version "$CODEX_VERSION"
          rebaseline_code=$?

          echo "execution_exit=$execution_code"
          echo "grade_exit=$grade_code"
          echo "rebaseline_exit=$rebaseline_code"
          if [ "$execution_code" -ne 0 ] || [ "$grade_code" -ne 0 ] || [ "$rebaseline_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Production Smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-repo-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/ProductionSmoke/${{ env.SMOKE_RUN_ID }}/
          if-no-files-found: error
