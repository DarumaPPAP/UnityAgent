name: Validate Eval

on:
  pull_request:
    paths:
      - "Eval/**"
      - "Tools/BehaviorEval/**"
      - "Tools/GoldenEval/**"
      - "Tests/BehaviorEval/**"
      - "Tests/GoldenTasks/**"
      - "AGENTS.md"
      - "docs/migration/phase6-eval-consolidation.md"
      - ".github/workflows/validate-eval.yml"
      - ".github/workflows/actual-behavior-eval.yml"
  push:
    branches: [main]
    paths:
      - "Eval/**"
      - "Tools/BehaviorEval/**"
      - "Tools/GoldenEval/**"
      - "AGENTS.md"
      - ".github/workflows/validate-eval.yml"

permissions:
  contents: read

jobs:
  phase6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Phase 6 Eval consolidation tests
        run: python -m unittest discover -s Eval/Tests -p "test_*.py"
      - name: Canonical Golden validators
        run: |
          python Eval/Golden/validate_gate_catalog.py
          python Eval/Golden/validate_required_knowledge.py
          python Eval/Golden/validate_golden_tasks.py
          python Eval/Golden/validate_naming_grader.py
      - name: Canonical Behavior validators
        run: |
          python Eval/Behavior/validate_behavior_eval.py
          python Eval/Behavior/validate_policy_provenance.py
          python Eval/Behavior/validate_naming_production_contract.py
          python Eval/Behavior/validate_mutation_production_contract.py
          python Eval/Behavior/validate_production_smoke.py
          python Eval/Behavior/validate_run_integrity.py
      - name: Previous authority boundaries remain green
        run: |
          python -m unittest discover -s Persistence/Tests -p "test_*.py"
          python -m unittest discover -s Orchestration/Tests -p "test_*.py"
          python -m unittest discover -s Runtime/Tests -p "test_*.py"
