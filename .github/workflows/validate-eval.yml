name: Validate Eval

on:
  pull_request:
    paths:
      - "Eval/**"
      - "Context/**"
      - "Persistence/**"
      - "Tools/Phase10/**"
      - "Tools/DocumentationValidator/**"
      - "Tools/GraphObservatory/**"
      - "Tests/SkillRouting/**"
      - "Tests/GraphObservatory/**"
      - "SkillReferences/**"
      - "Specs/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "Tools/validate_all.py"
      - ".github/workflows/validate-eval.yml"
      - ".github/workflows/actual-behavior-eval.yml"
      - ".github/workflows/baseline-regression-gate.yml"
  push:
    branches: [main]
    paths:
      - "Eval/**"
      - "Context/**"
      - "Persistence/**"
      - "Tools/Phase10/**"
      - "Tools/DocumentationValidator/**"
      - "Tools/GraphObservatory/**"
      - "Tests/SkillRouting/**"
      - "Tests/GraphObservatory/**"
      - "SkillReferences/**"
      - "Specs/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "Tools/validate_all.py"
      - ".github/workflows/validate-eval.yml"
      - ".github/workflows/baseline-regression-gate.yml"

permissions:
  contents: read

jobs:
  canonical-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Canonical Eval tests
        run: python -m unittest discover -s Eval/Tests -p "test_*.py"
      - name: Validate active documentation and Context Explorer
        run: |
          python Tools/DocumentationValidator/validate_documentation.py
          python Tools/GraphObservatory/validate_context_explorer.py
          python -m unittest Tests.GraphObservatory.test_context_explorer_projection
      - name: Validate frozen Phase 9 baseline
        run: python Eval/Rebaseline/validate_baseline_freeze.py Eval/Rebaseline/Baselines/phase9-baseline-20260830-09.yaml
      - name: Validate Phase 10 comparator and local gate entry points
        run: |
          python -m py_compile \
            Eval/Regression/baseline_comparator.py \
            Eval/Regression/compare_baseline.py \
            Eval/Regression/validate_baseline_comparison.py \
            Tools/Phase10/run_local_regression_gate.py
      - name: Canonical Golden validators
        run: |
          python Eval/Golden/validate_gate_catalog.py
          python Eval/Golden/validate_required_knowledge.py
          python Eval/Golden/validate_golden_tasks.py
          python Eval/Golden/validate_naming_grader.py
          python Eval/Golden/validate_typed_context_v3.py
          python Eval/Golden/validate_context_budget_v1.py
      - name: Canonical Behavior validators
        run: |
          python Eval/Behavior/validate_behavior_eval.py
          python Eval/Behavior/validate_policy_provenance.py
          python Eval/Behavior/validate_naming_production_contract.py
          python Eval/Behavior/validate_mutation_production_contract.py
          python Eval/Behavior/validate_production_smoke.py
          python Eval/Behavior/validate_run_integrity.py
          python Eval/Behavior/validate_phase8_cutover.py
      - name: Previous authority boundaries remain green
        run: |
          python -m unittest discover -s Persistence/Tests -p "test_*.py"
          python -m unittest discover -s Orchestration/Tests -p "test_*.py"
          python -m unittest discover -s Runtime/Tests -p "test_*.py"
          python -m unittest discover -s Operations/Tests -p "test_*.py"
