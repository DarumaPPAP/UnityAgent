name: Actual Behavior Eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: Canonical Eval protocol validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate canonical Actual Behavior protocol
        run: |
          python Eval/Behavior/validate_behavior_eval.py
          python -m unittest discover -s Eval/Tests -p "test_phase6_eval.py"

      - name: Explain execution boundary
        run: |
          echo "## Actual Behavior Eval" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Eval validates and grades already-observed Runtime/Persistence facts." >> "$GITHUB_STEP_SUMMARY"
          echo "Actual process/tool/Unity/Codex execution is owned by UnityAgent Runtime, not Eval and not Unity-Graph-Engineering." >> "$GITHUB_STEP_SUMMARY"
          echo "Golden expectations remain evaluator-only and are never injected into Runtime prompts." >> "$GITHUB_STEP_SUMMARY"
          echo "Historical Production archives are replayed through Eval/Replay when supplied; raw archives are not committed here." >> "$GITHUB_STEP_SUMMARY"
