name: UnityAgent Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable beta release tag to publish after human review
        required: true
        type: string

jobs:
  release:
    name: Human-gated beta release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check release source, tag, and version contract
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          version="$(tr -d '\r\n' < VERSION)"
          test "$REQUESTED_TAG" = "v$version"

          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          expected_python = version.replace("-beta", "b0")

          upm = json.loads(pathlib.Path("Packages/com.darumappap.unity-agent/package.json").read_text(encoding="utf-8"))
          plugin = json.loads(pathlib.Path(".agents/plugins/unity-agent/plugin.json").read_text(encoding="utf-8"))
          codex_plugin = json.loads(pathlib.Path(".agents/plugins/unity-agent/.codex-plugin/plugin.json").read_text(encoding="utf-8"))
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          marketplace = json.loads(pathlib.Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          license_text = pathlib.Path("LICENSE").read_text(encoding="utf-8")
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          bootstrap = pathlib.Path("scripts/install.ps1").read_text(encoding="utf-8")
          codex_installer = pathlib.Path("Runtime/Tooling/Providers/Installer/codex_plugin_installer.py").read_text(encoding="utf-8")

          assert upm["version"] == version, (upm["version"], version)
          assert plugin["version"] == version, (plugin["version"], version)
          assert codex_plugin["version"] == version, (codex_plugin["version"], version)
          assert pyproject["project"]["version"] == expected_python, (pyproject["project"]["version"], expected_python)

          assert upm.get("license") == "MIT", upm.get("license")
          assert plugin.get("license") == "MIT", plugin.get("license")
          assert codex_plugin.get("license") == "MIT", codex_plugin.get("license")
          assert license_text.startswith("MIT License\n"), "LICENSE is not the canonical MIT license text"

          assert marketplace.get("name") == "unity-agent", marketplace.get("name")
          assert marketplace.get("interface", {}).get("displayName") == "UnityAgent"
          assert 'MARKETPLACE_NAME = "unity-agent"' in codex_installer
          assert f'CHANNEL = "{version}"' in codex_installer
          assert "unity-agent@unity-agent" in readme
          assert "unity-agent@personal" not in readme
          assert "UNITY_AGENT_CONTROL_PLANE" in bootstrap

          artist = next(item for item in marketplace["plugins"] if item["name"] == "unity-artist")
          artist_ref = artist["source"].get("ref", "")
          assert artist_ref.startswith("v") and artist_ref != "main", artist_ref
          print(f"Release version: {version}")
          print(f"Python version: {expected_python}")
          print("Codex marketplace: unity-agent")
          print("Control Plane discovery hint: UNITY_AGENT_CONTROL_PLANE")
          print("License: MIT")
          print(f"Pinned UnityArtistCLI ref: {artist_ref}")
          PY

          if git ls-remote --exit-code --tags origin "refs/tags/$REQUESTED_TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to move or replace it."
            exit 1
          fi

      - name: Install validation and build dependencies
        run: python3 -m pip install --disable-pip-version-check -e . build

      - name: Validate repository and regression contracts
        run: |
          set -euo pipefail
          python3 Tools/validate_all.py
          python3 Tools/ProductionToolRuntime/validate_production_tool_runtime.py
          python3 Eval/Rebaseline/validate_baseline_freeze.py Eval/Rebaseline/Baselines/phase9-baseline-20260830-09.yaml
          python3 -m unittest Eval.Tests.test_baseline_comparator Eval.Tests.test_local_regression_gate
          python3 -m py_compile \
            Eval/Regression/baseline_comparator.py \
            Eval/Regression/compare_baseline.py \
            Tools/run_regression_gate.py

      - name: Verify pinned UnityArtistCLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artist_ref="$(python3 - <<'PY'
          import json
          data = json.load(open('.agents/plugins/marketplace.json', encoding='utf-8'))
          print(next(item for item in data['plugins'] if item['name'] == 'unity-artist')['source']['ref'])
          PY
          )"
          gh api "repos/DarumaPPAP/UnityArtistCLI/releases/tags/$artist_ref" >/dev/null

      - name: Build Python distribution
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m build --outdir artifacts

      - name: Pack Unity UPM package
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts
          (
            cd Packages/com.darumappap.unity-agent
            npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          )
          upm_source="$(find artifacts -maxdepth 1 -type f -name 'com.darumappap.unity-agent-*.tgz' -print -quit)"
          test -n "$upm_source"
          upm_target="artifacts/UnityAgent-UPM-$version.tgz"
          mv "$upm_source" "$upm_target"

          python3 - "$upm_target" <<'PY'
          import sys
          import tarfile

          archive = sys.argv[1]
          required = {
              "package/package.json.meta",
              "package/Editor.meta",
              "package/Editor/DarumaPPAP.UnityAgent.Editor.asmdef.meta",
              "package/Editor/UnityAgentCodexPathResolver.cs.meta",
              "package/Editor/UnityAgentControlPlanePathResolver.cs.meta",
              "package/Editor/UnityAgentControlPlaneClient.cs.meta",
              "package/Editor/UnityAgentSetupWindow.cs.meta",
          }
          with tarfile.open(archive, "r:gz") as package:
              names = set(package.getnames())
          missing = sorted(required - names)
          if missing:
              raise SystemExit("UPM artifact is missing Unity .meta files: " + ", ".join(missing))
          print(f"UPM artifact meta validation passed: {len(required)} required .meta files")
          PY

      - name: Pack Codex plugin
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts
          (
            cd .agents/plugins/unity-agent
            zip -qr "$GITHUB_WORKSPACE/artifacts/UnityAgent-CodexPlugin-$version.zip" .
          )

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          (
            cd artifacts
            sha256sum ./* > SHA256SUMS.txt
          )

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create immutable tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: git tag -a "$REQUESTED_TAG" -m "UnityAgent $REQUESTED_TAG"

      - name: Push immutable tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: git push origin "$REQUESTED_TAG"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$REQUESTED_TAG" \
            --verify-tag \
            --prerelease \
            --title "UnityAgent $REQUESTED_TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*

      - uses: actions/upload-artifact@v7
        with:
          name: UnityAgent-${{ inputs.tag }}-Distribution
          path: artifacts
