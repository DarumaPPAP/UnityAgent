name: UnityAgent Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Publish the canonical VERSION from main as an immutable prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Human-gated unified beta release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UnityAgent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve canonical release tag
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release workflow must run from main. Current ref: $GITHUB_REF"
            exit 1
          fi
          if [ "$CONFIRM_RELEASE" != "true" ]; then
            echo "::error::Check confirm_release before publishing a release."
            exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Check release and distribution contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          expected_python = version.replace("-beta", "b0")
          upm = json.loads(pathlib.Path("Packages/com.darumappap.unity-agent/package.json").read_text(encoding="utf-8"))
          plugin = json.loads(pathlib.Path(".agents/plugins/unity-agent/plugin.json").read_text(encoding="utf-8"))
          codex_plugin = json.loads(pathlib.Path(".agents/plugins/unity-agent/.codex-plugin/plugin.json").read_text(encoding="utf-8"))
          marketplace = json.loads(pathlib.Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          lock = json.loads(pathlib.Path("Runtime/Distribution/subagent-sources.lock.json").read_text(encoding="utf-8"))
          installer = pathlib.Path("Runtime/Tooling/Providers/Installer/release_installer.py").read_text(encoding="utf-8")

          assert upm["version"] == version
          assert plugin["version"] == version
          assert codex_plugin["version"] == version
          assert pyproject["project"]["version"] == expected_python
          assert [item.get("name") for item in marketplace.get("plugins", [])] == ["unity-agent"]
          assert lock["hub"]["repository"] == "DarumaPPAP/UnitySubAgentHub"
          assert re.fullmatch(r"[0-9a-f]{40}", lock["hub"]["commit"])
          assert 'DISTRIBUTION_REPOSITORY = "DarumaPPAP/UnityAgent"' in installer
          assert f'DISTRIBUTION_TAG = "v{version}"' in installer
          assert f'ARCHIVE_NAME = "UnityAgent-ArtistSubAgent-host-windows-x64-{version}.zip"' in installer
          print(f"UnityAgent release: v{version}")
          print(f"Pinned Hub source: {lock['hub']['repository']}@{lock['hub']['commit']}")
          PY

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; refusing to move or replace it."
            exit 1
          fi

      - name: Install UnityAgent validation and build dependencies
        run: python3 -m pip install --disable-pip-version-check -e . build

      - name: Validate UnityAgent repository and regression contracts
        run: |
          set -euo pipefail
          python3 Tools/validate_all.py
          python3 Tools/ProductionToolRuntime/validate_production_tool_runtime.py
          python3 Eval/Rebaseline/validate_baseline_freeze.py Eval/Rebaseline/Baselines/phase9-baseline-20260830-09.yaml
          python3 -m unittest Eval.Tests.test_baseline_comparator Eval.Tests.test_local_regression_gate
          python3 -m py_compile \
            Eval/Regression/baseline_comparator.py \
            Eval/Regression/compare_baseline.py \
            Tools/run_regression_gate.py

      - name: Resolve pinned Hub source
        id: hub-source
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("Runtime/Distribution/subagent-sources.lock.json", encoding="utf-8"))
          print(f"repository={lock['hub']['repository']}")
          print(f"commit={lock['hub']['commit']}")
          PY

      - name: Checkout pinned UnitySubAgentHub source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.hub-source.outputs.repository }}
          ref: ${{ steps.hub-source.outputs.commit }}
          path: .release-sources/UnitySubAgentHub
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify pinned Hub source and contracts
        run: |
          set -euo pipefail
          expected="${{ steps.hub-source.outputs.commit }}"
          actual="$(git -C .release-sources/UnitySubAgentHub rev-parse HEAD)"
          test "$actual" = "$expected"
          python3 .release-sources/UnitySubAgentHub/Tests/Hub/validate_registry.py
          python3 -m unittest discover -s .release-sources/UnitySubAgentHub/Tests/Hub -p 'test_*.py' -v
          python3 .release-sources/UnitySubAgentHub/Tests/Backend/verify_artist_backend_contract.py
          python3 .release-sources/UnitySubAgentHub/Tests/Compatibility/verify-unity-api-compatibility.py

      - name: Build pinned SubAgent distribution
        run: |
          set -euo pipefail
          hub=".release-sources/UnitySubAgentHub"
          mkdir -p artifacts .release-build/artist-host-windows-x64

          dotnet publish "$hub/src/UnityArtist.Cli/UnityArtist.Cli.csproj" \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output .release-build/artist-host-windows-x64

          artist_archive="UnityAgent-ArtistSubAgent-host-windows-x64-$RELEASE_VERSION.zip"
          (cd .release-build/artist-host-windows-x64 && zip -qr "$GITHUB_WORKSPACE/artifacts/$artist_archive" .)
          sha256sum "artifacts/$artist_archive" > "artifacts/$artist_archive.sha256"

          (
            cd "$hub/Packages/com.darumappap.artist-subagent"
            npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          )
          artist_upm_source="$(find artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$artist_upm_source"
          mv "$artist_upm_source" "artifacts/UnityAgent-ArtistSubAgent-UPM-$RELEASE_VERSION.tgz"

          python3 "$hub/Tests/Hub/export_agent_snapshot.py" \
            --output "artifacts/UnityAgent-SubAgent-Catalog-$RELEASE_VERSION.yaml"
          cp "$hub/Registry/subagents.yaml" "artifacts/UnityAgent-SubAgent-Registry-$RELEASE_VERSION.yaml"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          lock = json.loads(pathlib.Path("Runtime/Distribution/subagent-sources.lock.json").read_text(encoding="utf-8"))
          hub = pathlib.Path(".release-sources/UnitySubAgentHub")
          package = json.loads((hub / "Packages/com.darumappap.artist-subagent/package.json").read_text(encoding="utf-8"))
          version = os.environ["RELEASE_VERSION"]
          provenance = {
              "schema_version": "1.0",
              "unity_agent_version": version,
              "hub_repository": lock["hub"]["repository"],
              "hub_commit": lock["hub"]["commit"],
              "artist_backend_version": package["version"],
              "artist_package_id": package["name"],
          }
          pathlib.Path(f"artifacts/UnityAgent-SubAgent-Provenance-{version}.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate bundled Artist backend version
        run: |
          set -euo pipefail
          backend_version="$(python3 - <<'PY'
          import json
          print(json.load(open(".release-sources/UnitySubAgentHub/Packages/com.darumappap.artist-subagent/package.json", encoding="utf-8"))["version"])
          PY
          )"
          python3 - "$backend_version" <<'PY'
          import pathlib
          import sys
          source = pathlib.Path("Runtime/Tooling/Providers/Installer/release_installer.py").read_text(encoding="utf-8")
          expected = sys.argv[1]
          token = f'BACKEND_VERSION = "{expected}"'
          if token not in source:
              raise SystemExit(f"release installer backend version pin does not match bundled Hub source: {expected}")
          PY

      - name: Build Python distribution
        run: python3 -m build --outdir artifacts

      - name: Pack UnityAgent UPM package
        run: |
          set -euo pipefail
          (
            cd Packages/com.darumappap.unity-agent
            npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          )
          upm_source="$(find artifacts -maxdepth 1 -type f -name 'com.darumappap.unity-agent-*.tgz' -print -quit)"
          test -n "$upm_source"
          upm_target="artifacts/UnityAgent-UPM-$RELEASE_VERSION.tgz"
          mv "$upm_source" "$upm_target"

          python3 - "$upm_target" <<'PY'
          import sys
          import tarfile
          archive = sys.argv[1]
          required = {
              "package/package.json.meta",
              "package/Editor.meta",
              "package/Editor/DarumaPPAP.UnityAgent.Editor.asmdef.meta",
              "package/Editor/UnityAgentCodexPathResolver.cs.meta",
              "package/Editor/UnityAgentControlPlanePathResolver.cs.meta",
              "package/Editor/UnityAgentControlPlaneBootstrap.cs.meta",
              "package/Editor/UnityAgentControlPlaneClient.cs.meta",
              "package/Editor/UnityAgentSetupWindow.cs.meta",
              "package/Editor/Bootstrap~/install-control-plane.ps1",
          }
          with tarfile.open(archive, "r:gz") as package:
              names = set(package.getnames())
          missing = sorted(required - names)
          if missing:
              raise SystemExit("UPM artifact is missing bootstrap/meta files: " + ", ".join(missing))
          PY

      - name: Pack Codex plugin
        run: |
          set -euo pipefail
          (
            cd .agents/plugins/unity-agent
            zip -qr "$GITHUB_WORKSPACE/artifacts/UnityAgent-CodexPlugin-$RELEASE_VERSION.zip" .
          )

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          (
            cd artifacts
            : > SHA256SUMS.txt
            for artifact in *; do
              [ "$artifact" = "SHA256SUMS.txt" ] && continue
              [ -f "$artifact" ] || continue
              sha256sum -- "$artifact" >> SHA256SUMS.txt
            done
          )

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create immutable UnityAgent tag
        run: git tag -a "$RELEASE_TAG" -m "UnityAgent $RELEASE_TAG"

      - name: Push immutable UnityAgent tag
        run: git push origin "$RELEASE_TAG"

      - name: Create unified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "UnityAgent $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*

      - uses: actions/upload-artifact@v7
        with:
          name: UnityAgent-${{ env.RELEASE_TAG }}-Distribution
          path: artifacts
