name: UnityAgent Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Publish the canonical VERSION from main as an immutable prerelease
        required: true
        type: boolean
        default: false
      p9_evidence_run_id:
        description: Private P9 verification run ID for this exact UnityAgent commit
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Human-gated unified beta release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UnityAgent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve canonical release tag
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release workflow must run from main. Current ref: $GITHUB_REF"
            exit 1
          fi
          if [ "$CONFIRM_RELEASE" != "true" ]; then
            echo "::error::Check confirm_release before publishing a release."
            exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Check release and distribution contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          expected_python = version.replace("-beta", "b0")
          upm = json.loads(pathlib.Path("Packages/com.darumappap.unity-agent/package.json").read_text(encoding="utf-8"))
          plugin = json.loads(pathlib.Path(".agents/plugins/unity-agent/plugin.json").read_text(encoding="utf-8"))
          codex_plugin = json.loads(pathlib.Path(".agents/plugins/unity-agent/.codex-plugin/plugin.json").read_text(encoding="utf-8"))
          marketplace = json.loads(pathlib.Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          installer = pathlib.Path("src/unityagent/runtime/tooling/providers/installer/release_installer.py").read_text(encoding="utf-8")

          assert upm["version"] == version
          assert plugin["version"] == version
          assert codex_plugin["version"] == version
          assert pyproject["project"]["version"] == expected_python
          assert [item.get("name") for item in marketplace.get("plugins", [])] == ["unity-agent"]
          assert pathlib.Path("subagent/registry.yaml").is_file()
          assert 'DISTRIBUTION_REPOSITORY = "DarumaPPAP/UnityAgent"' in installer
          assert f'DISTRIBUTION_TAG = "v{version}"' in installer
          assert f'ARCHIVE_NAME = "UnityAgent-ArtistSubAgent-host-windows-x64-{version}.zip"' in installer
          print(f"UnityAgent release: v{version}")
          print("SubAgent source: UnityAgent checkout")
          PY

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; refusing to move or replace it."
            exit 1
          fi

      - name: Install UnityAgent validation and build dependencies
        run: python3 -m pip install --disable-pip-version-check -e . build "setuptools>=68" wheel

      - name: Validate UnityAgent repository and regression contracts
        run: |
          set -euo pipefail
          python3 tools/validate_all.py
          python3 tools/production_tool_runtime/validate_production_tool_runtime.py
          python3 eval/rebaseline/validate_baseline_freeze.py eval/rebaseline/baselines/phase9-baseline-20260830-09.yaml
          python3 -m unittest tests.eval.test_baseline_comparator tests.eval.test_local_regression_gate
          python3 -m py_compile \
            eval/regression/baseline_comparator.py \
            eval/regression/compare_baseline.py \
            tools/run_regression_gate.py

      - name: Verify co-located SubAgent source and contracts
        run: |
          set -euo pipefail
          python3 tools/validate_local_subagent_catalog.py
          python3 subagent/tools/validate_registry.py
          python3 -m unittest discover -s tests/subagent -p 'test_*.py' -v
          python3 tools/validate_artist_product_identity.py
          python3 tests/unity/verify/validate_unity_fixtures.py
          dotnet build subagent/artist_subagent/tools/host/UnityArtist.Tools.csproj --configuration Release
          python3 -m unittest discover -s tests/subagent/artist/tools -p 'test_*.py' -v

      - name: Build co-located SubAgent distribution
        run: |
          set -euo pipefail
          mkdir -p artifacts .release-build/artist-host-windows-x64

          dotnet publish "subagent/artist_subagent/tools/host/UnityArtist.Tools.csproj" \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output .release-build/artist-host-windows-x64

          artist_archive="UnityAgent-ArtistSubAgent-host-windows-x64-$RELEASE_VERSION.zip"
          (cd .release-build/artist-host-windows-x64 && zip -qr "$GITHUB_WORKSPACE/artifacts/$artist_archive" .)
          sha256sum "artifacts/$artist_archive" > "artifacts/$artist_archive.sha256"

          (
            cd "subagent/artist_subagent/tools/editor"
            npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          )
          artist_upm_source="$(find artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$artist_upm_source"
          mv "$artist_upm_source" "artifacts/UnityAgent-ArtistSubAgent-UPM-$RELEASE_VERSION.tgz"

          python3 "subagent/tools/export_snapshot.py" \
            --output "artifacts/UnityAgent-SubAgent-Catalog-$RELEASE_VERSION.yaml"
          cp "subagent/registry.yaml" "artifacts/UnityAgent-SubAgent-Registry-$RELEASE_VERSION.yaml"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          package = json.loads(pathlib.Path("subagent/artist_subagent/tools/editor/package.json").read_text(encoding="utf-8"))
          version = os.environ["RELEASE_VERSION"]
          provenance = {
              "schema_version": "1.0",
              "unity_agent_version": version,
              "unity_agent_repository": "DarumaPPAP/UnityAgent",
              "unity_agent_commit": os.environ["GITHUB_SHA"],
              "subagent_source": "subagent/registry.yaml",
              "artist_backend_version": package["version"],
              "artist_package_id": package["name"],
          }
          pathlib.Path(f"artifacts/UnityAgent-SubAgent-Provenance-{version}.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate bundled Artist backend version
        run: |
          set -euo pipefail
          backend_version="$(python3 - <<'PY'
          import json
          print(json.load(open("subagent/artist_subagent/tools/editor/package.json", encoding="utf-8"))["version"])
          PY
          )"
          python3 - "$backend_version" <<'PY'
          import pathlib
          import sys
          source = pathlib.Path("src/unityagent/runtime/tooling/providers/installer/release_installer.py").read_text(encoding="utf-8")
          expected = sys.argv[1]
          token = f'BACKEND_VERSION = "{expected}"'
          if token not in source:
              raise SystemExit(f"release installer backend version pin does not match bundled UnityAgent source: {expected}")
          PY

      - name: Build Python distribution
        run: python3 -m build --outdir artifacts

      - name: Pack UnityAgent UPM package
        run: |
          set -euo pipefail
          (
            cd Packages/com.darumappap.unity-agent
            npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          )
          upm_source="$(find artifacts -maxdepth 1 -type f -name 'com.darumappap.unity-agent-*.tgz' -print -quit)"
          test -n "$upm_source"
          upm_target="artifacts/UnityAgent-UPM-$RELEASE_VERSION.tgz"
          mv "$upm_source" "$upm_target"

          python3 - "$upm_target" <<'PY'
          import sys
          import tarfile
          archive = sys.argv[1]
          required = {
              "package/package.json.meta",
              "package/Editor.meta",
              "package/Editor/DarumaPPAP.UnityAgent.Editor.asmdef.meta",
              "package/Editor/CodexPathResolver.cs.meta",
              "package/Editor/ControlPlanePathResolver.cs.meta",
              "package/Editor/ControlPlaneBootstrap.cs.meta",
              "package/Editor/ControlPlaneClient.cs.meta",
              "package/Editor/SetupWindow.cs.meta",
              "package/Editor/SetupVerificationPanel.cs.meta",
              "package/Editor/VerificationFixtureSource.cs",
              "package/Editor/VerificationFixtureSource.cs.meta",
              "package/Editor/Verification~/p9-source-manifest.json",
              "package/Editor/Verification~/tests/unity/scripts/run-unity-tests.ps1",
              "package/Editor/Verification~/tests/unity/matrix.yaml",
              "package/Editor/Verification~/subagent/artist_subagent/tools/editor/package.json",
              "package/Editor/Bootstrap~/install-control-plane.ps1",
          }
          with tarfile.open(archive, "r:gz") as package:
              names = set(package.getnames())
          missing = sorted(required - names)
          if missing:
              raise SystemExit("UPM artifact is missing bootstrap/meta files: " + ", ".join(missing))
          PY

      - name: Pack Codex plugin
        run: |
          set -euo pipefail
          (
            cd .agents/plugins/unity-agent
            zip -qr "$GITHUB_WORKSPACE/artifacts/UnityAgent-CodexPlugin-$RELEASE_VERSION.zip" .
          )

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          (
            cd artifacts
            : > SHA256SUMS.txt
            for artifact in *; do
              [ "$artifact" = "SHA256SUMS.txt" ] && continue
              [ -f "$artifact" ] || continue
              sha256sum -- "$artifact" >> SHA256SUMS.txt
            done
          )

      - name: Verify private P9 Unity 6.3 LTS Editor evidence (fail closed before tag)
        env:
          GH_TOKEN: ${{ secrets.UNITYAGENT_P9_EVIDENCE_TOKEN }}
          P9_REPO: ${{ vars.UNITYAGENT_P9_REPOSITORY }}
          P9_RUN_ID: ${{ inputs.p9_evidence_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$P9_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo "::error::P9 run ID must be a positive decimal GitHub Actions run ID"
            exit 1
          fi
          if [[ ! "$P9_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Private P9 evidence repository and read-only token are required"
            exit 1
          fi
          mkdir -p .p9-evidence
          gh api "repos/$P9_REPO/actions/runs/$P9_RUN_ID" > .p9-evidence/run.json
          python3 -c 'import json,os,sys; d=json.load(open(".p9-evidence/run.json")); sys.exit(0 if d.get("conclusion") == "success" and d.get("event") == "workflow_dispatch" and d.get("head_branch") == "main" and d.get("name") == "UnityAgent P9 Release Verification" and "/.github/workflows/p9-release-verification.yml@" in d.get("path", "") else 1)'
          mkdir -p .p9-evidence/artifact
          gh run download "$P9_RUN_ID" --repo "$P9_REPO" --name unityagent-p9-lts-urp --dir .p9-evidence/artifact
          python3 tools/release/verify_p9_evidence.py \
            --evidence .p9-evidence/artifact \
            --run-metadata .p9-evidence/run.json \
            --source-sha "$GITHUB_SHA" \
            --repository "$P9_REPO" \
            --run-id "$P9_RUN_ID"

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create immutable UnityAgent tag
        run: git tag -a "$RELEASE_TAG" -m "UnityAgent $RELEASE_TAG"

      - name: Push immutable UnityAgent tag
        run: git push origin "$RELEASE_TAG"

      - name: Create unified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "UnityAgent $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*

      - uses: actions/upload-artifact@v7
        with:
          name: UnityAgent-${{ env.RELEASE_TAG }}-Distribution
          path: artifacts
