name: Windows Bootstrap Smoke

on:
  pull_request:
    paths:
      - "scripts/install.ps1"
      - "Packages/com.darumappap.unity-agent/Editor/Bootstrap~/**"
      - "Packages/com.darumappap.unity-agent/Editor/ControlPlanePathResolver.cs"
      - "Packages/com.darumappap.unity-agent/Editor/ControlPlaneBootstrap.cs"
      - "Packages/com.darumappap.unity-agent/Editor/SetupWindow.cs"
      - ".github/workflows/windows-bootstrap-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install.ps1"
      - "Packages/com.darumappap.unity-agent/Editor/Bootstrap~/**"
      - "Packages/com.darumappap.unity-agent/Editor/ControlPlanePathResolver.cs"
      - "Packages/com.darumappap.unity-agent/Editor/ControlPlaneBootstrap.cs"
      - "Packages/com.darumappap.unity-agent/Editor/SetupWindow.cs"
      - ".github/workflows/windows-bootstrap-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Published Installer Compatibility
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PUBLISHED_SMOKE_TAG: v0.0.8-beta
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Report retired cleanup regression
        shell: pwsh
        run: |
          Write-Warning "BLOCKED_NOT_RUN: tests/packaging cleanup regression is retired. Installer smoke below is not a replacement."

      - name: Bootstrap published release through UPM installer
        shell: pwsh
        run: |
          # Simulate a legitimate obsolete managed runtime in this ephemeral CI user profile.
          $oldRuntime = Join-Path $env:LOCALAPPDATA "UnityAgent\ControlPlane\v0.0.6-beta"
          if (Test-Path -LiteralPath $oldRuntime) { throw "Unexpected preexisting managed runtime: $oldRuntime" }
          $oldScripts = Join-Path $oldRuntime 'venv\Scripts'
          New-Item -ItemType Directory -Path $oldScripts -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $oldRuntime 'venv\pyvenv.cfg') -Value 'home = CI synthetic fixture'
          Set-Content -LiteralPath (Join-Path $oldScripts 'unity-agent.exe') -Value 'CI synthetic fixture'
          & "Packages/com.darumappap.unity-agent/Editor/Bootstrap~/install-control-plane.ps1" -ReleaseTag $env:PUBLISHED_SMOKE_TAG
          if (Test-Path -LiteralPath $oldRuntime) {
            throw "UPM installer failed to clean up obsolete managed runtime: $oldRuntime"
          }
          $controlPlane = [Environment]::GetEnvironmentVariable("UNITY_AGENT_CONTROL_PLANE", "User")
          if (-not $controlPlane) { throw "UNITY_AGENT_CONTROL_PLANE was not persisted." }
          $expectedRoot = Join-Path $env:LOCALAPPDATA "UnityAgent\ControlPlane\$env:PUBLISHED_SMOKE_TAG\venv\Scripts"
          if (-not $controlPlane.StartsWith($expectedRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Control Plane was not installed into the managed LocalAppData runtime: $controlPlane"
          }
          if ($controlPlane -match 'AppData\\Roaming\\Python') { throw "Legacy pip --user path is still in use: $controlPlane" }
          if (-not (Test-Path -LiteralPath $controlPlane)) { throw "Managed Control Plane executable is missing: $controlPlane" }
          $shim = Join-Path $env:LOCALAPPDATA "UnityAgent\bin\unity-agent.cmd"
          if (-not (Test-Path -LiteralPath $shim)) { throw "Stable unity-agent shim is missing: $shim" }

      - name: Bootstrap published release through stable installer
        shell: pwsh
        env:
          UNITY_AGENT_TAG: ${{ env.PUBLISHED_SMOKE_TAG }}
        run: |
          $oldRuntime = Join-Path $env:LOCALAPPDATA "UnityAgent\ControlPlane\v0.0.7-beta"
          if (Test-Path -LiteralPath $oldRuntime) { throw "Unexpected preexisting managed runtime: $oldRuntime" }
          $oldScripts = Join-Path $oldRuntime 'venv\Scripts'
          New-Item -ItemType Directory -Path $oldScripts -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $oldRuntime 'venv\pyvenv.cfg') -Value 'home = CI synthetic fixture'
          Set-Content -LiteralPath (Join-Path $oldScripts 'unity-agent.exe') -Value 'CI synthetic fixture'
          & "scripts/install.ps1"
          if (Test-Path -LiteralPath $oldRuntime) {
            throw "Stable installer failed to clean up obsolete managed runtime: $oldRuntime"
          }
          $controlPlane = [Environment]::GetEnvironmentVariable("UNITY_AGENT_CONTROL_PLANE", "User")
          if (-not $controlPlane) { throw "Stable installer did not persist UNITY_AGENT_CONTROL_PLANE." }
          if ($controlPlane -match 'AppData\\Roaming\\Python') { throw "Stable installer regressed to pip --user: $controlPlane" }
