name: Use Setup Logo Safely Once

on:
  push:
    branches:
      - fix/use-setup-logo-safely
    paths:
      - .github/workflows/use-setup-logo-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/use-setup-logo-safely
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Re-enable UnityAgent logo with layout-safe IMGUI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Packages/com.darumappap.unity-agent/Editor/UnityAgentSetupWindow.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '        private const string CODEX_PLUGIN_SOURCE = "DarumaPPAP/UnityAgent@v0.0.6-beta";\n',
              '        private const string CODEX_PLUGIN_SOURCE = "DarumaPPAP/UnityAgent@v0.0.6-beta";\n'
              '        private const string SETUP_LOGO_ASSET_PATH = "Packages/com.darumappap.unity-agent/Editor/Resources/UnityAgentSetupLogo.png";\n',
              1)

          text = text.replace(
              '        private Vector2 diagnosticsScroll;\n\n        private GUIStyle titleStyle;\n',
              '        private Vector2 diagnosticsScroll;\n        private Texture2D setupLogoTexture;\n\n        private GUIStyle titleStyle;\n',
              1)

          text = text.replace(
              '        private void OnEnable()\n        {\n            minSize = new Vector2(620f, 520f);\n            RefreshAllPaths();\n',
              '        private void OnEnable()\n        {\n            minSize = new Vector2(620f, 520f);\n            setupLogoTexture = AssetDatabase.LoadAssetAtPath<Texture2D>(SETUP_LOGO_ASSET_PATH);\n            RefreshAllPaths();\n',
              1)

          old_header = '''        private void DrawHeader()\n        {\n            EditorGUILayout.BeginVertical(EditorStyles.helpBox);\n\n            var accentRect = EditorGUILayout.GetControlRect(false, 4f);\n            EditorGUI.DrawRect(accentRect, BrandRed);\n            EditorGUILayout.Space(8);\n\n            EditorGUILayout.LabelField("UNITYAGENT", titleStyle, GUILayout.Height(40f));\n            EditorGUILayout.LabelField("SETUP  /  CONTROL PLANE  /  CODEX", heroSubtitleStyle);\n\n            using (new EditorGUILayout.HorizontalScope())\n            {\n                GUILayout.FlexibleSpace();\n                GUILayout.Label("v" + CHANNEL + "  BETA", heroVersionStyle);\n            }\n\n            EditorGUILayout.Space(6);\n            EditorGUILayout.EndVertical();\n        }\n'''

          new_header = '''        private void DrawHeader()\n        {\n            EditorGUILayout.BeginVertical(EditorStyles.helpBox);\n\n            var accentRect = EditorGUILayout.GetControlRect(false, 4f);\n            EditorGUI.DrawRect(accentRect, BrandRed);\n            EditorGUILayout.Space(8);\n\n            var logoSlot = GUILayoutUtility.GetRect(0f, 84f, GUILayout.ExpandWidth(true));\n            if (setupLogoTexture != null)\n            {\n                var logoRect = new Rect(\n                    logoSlot.x + 18f,\n                    logoSlot.y + 4f,\n                    Mathf.Max(0f, logoSlot.width - 36f),\n                    Mathf.Max(0f, logoSlot.height - 8f));\n                GUI.DrawTexture(logoRect, setupLogoTexture, ScaleMode.ScaleToFit, true);\n            }\n            else\n            {\n                GUI.Label(logoSlot, "UNITYAGENT", titleStyle);\n            }\n\n            EditorGUILayout.Space(4);\n            EditorGUILayout.LabelField("SETUP  /  CONTROL PLANE  /  CODEX", heroSubtitleStyle);\n\n            using (new EditorGUILayout.HorizontalScope())\n            {\n                GUILayout.FlexibleSpace();\n                GUILayout.Label("v" + CHANNEL + "  BETA", heroVersionStyle);\n            }\n\n            EditorGUILayout.Space(6);\n            EditorGUILayout.EndVertical();\n        }\n'''

          if old_header not in text:
              raise SystemExit('expected DrawHeader block not found')
          text = text.replace(old_header, new_header, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          FILE='Packages/com.darumappap.unity-agent/Editor/UnityAgentSetupWindow.cs'
          grep -q 'SETUP_LOGO_ASSET_PATH' "$FILE"
          grep -q 'AssetDatabase.LoadAssetAtPath<Texture2D>' "$FILE"
          grep -q 'GUILayoutUtility.GetRect(0f, 84f' "$FILE"
          grep -q 'GUI.DrawTexture(logoRect, setupLogoTexture, ScaleMode.ScaleToFit, true)' "$FILE"
          grep -q 'EditorGUILayout.BeginVertical(EditorStyles.helpBox)' "$FILE"
          ! grep -q 'DrawWindowBackdrop' "$FILE"
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/use-setup-logo-once.yml
          git add Packages/com.darumappap.unity-agent/Editor/UnityAgentSetupWindow.cs
          git commit -m 'Use UnityAgent logo in layout-safe header'
          git push origin HEAD:fix/use-setup-logo-safely
