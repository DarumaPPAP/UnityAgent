name: Production E2E G1 (licensed Windows runner)
on:
  workflow_dispatch:
    inputs:
      staged_fbx:
        description: Approved Control Plane Staging FBX path on the runner
        required: true
        type: string
      artifact_manifest:
        description: Matching Staging artifact.json path on the runner
        required: true
        type: string
permissions:
  contents: read
jobs:
  g1-editor:
    runs-on: [self-hosted, Windows, unity-6000.3.12f1]
    timeout-minutes: 35
    env:
      UNITYAGENT_G1_FBX: ${{ inputs.staged_fbx }}
      UNITYAGENT_G1_ARTIFACT: ${{ inputs.artifact_manifest }}
      UNITYAGENT_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Initialize evidence before checking prerequisites
        shell: pwsh
        run: |
          $env:UNITYAGENT_G1_EVIDENCE = Join-Path $env:RUNNER_TEMP "unityagent-g1-${{ github.run_id }}"
          "UNITYAGENT_G1_EVIDENCE=$env:UNITYAGENT_G1_EVIDENCE" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:UNITYAGENT_G1_EVIDENCE | Out-Null
          $record = @{status='BLOCKED_NOT_RUN';reason='Editor validation has not completed';source_revision=$env:UNITYAGENT_SOURCE_REVISION}
          $record | ConvertTo-Json | Set-Content (Join-Path $env:UNITYAGENT_G1_EVIDENCE 'preflight.json')
      - name: Run fixed G1 Editor fixture (graphics required)
        shell: pwsh
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR)) { throw 'BLOCKED_NOT_RUN: UNITY_EDITOR must point to licensed Unity 6000.3.12f1' }
          if (-not (Test-Path $env:UNITYAGENT_G1_FBX)) { throw 'BLOCKED_NOT_RUN: Control Plane FBX unavailable' }
          if (-not (Test-Path $env:UNITYAGENT_G1_ARTIFACT)) { throw 'BLOCKED_NOT_RUN: Artifact manifest unavailable' }
          $project = Join-Path $env:GITHUB_WORKSPACE 'tests/unity/projects/production-e2e'
          & $env:UNITY_EDITOR -batchmode -projectPath $project -runTests -testPlatform EditMode -testFilter UnityAgent.G1.RockProductionTests -testResults "$env:UNITYAGENT_G1_EVIDENCE/results.xml" -logFile "$env:UNITYAGENT_G1_EVIDENCE/Editor.log"
          if ($LASTEXITCODE -ne 0) { throw "Editor test failed: $LASTEXITCODE" }
      - name: Collect fail-closed Production Gate status
        if: always()
        shell: pwsh
        run: |
          $hash = 'unobserved'
          if (Test-Path $env:UNITYAGENT_G1_FBX) { $hash = (Get-FileHash -Algorithm SHA256 $env:UNITYAGENT_G1_FBX).Hash.ToLowerInvariant() }
          python tests/unity/verify/collect_evidence.py --directory $env:UNITYAGENT_G1_EVIDENCE --source-revision $env:UNITYAGENT_SOURCE_REVISION --artifact-hash $hash --output "$env:UNITYAGENT_G1_EVIDENCE/acceptance.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-e2e-g1-${{ github.run_id }}
          path: ${{ env.UNITYAGENT_G1_EVIDENCE }}
          if-no-files-found: error
