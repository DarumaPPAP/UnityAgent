name: Validate Policy Context

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Policy/**"
      - "Context/**"
      - "Orchestration/Contracts/TaskContracts/**"
      - "Runtime/Permissions/**"
      - "Runtime/Profiles/**"
      - "Runtime/Guardrails/**"
      - "Prompt/**"
      - ".github/workflows/validate-policy-context.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "Policy/**"
      - "Context/**"
      - "Orchestration/Contracts/TaskContracts/**"
      - "Runtime/Permissions/**"
      - "Runtime/Profiles/**"
      - "Runtime/Guardrails/**"
      - ".github/workflows/validate-policy-context.yml"

jobs:
  canonical-policy-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Canonical user policy integrity
        run: python Policy/Validators/validate_user_policy_integrity.py
      - name: Policy tests
        run: python -m unittest discover -s Policy/Tests -p "test_*.py"
      - name: Context tests
        run: python -m unittest discover -s Context/Tests -p "test_*.py"
      - name: Cutover stale legacy path guard
        run: python Context/Validators/validate_stale_paths.py
