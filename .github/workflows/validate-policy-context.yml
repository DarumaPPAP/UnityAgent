name: Validate Policy Context

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Policy/**"
      - "Context/**"
      - "Runtime/Permissions/**"
      - "Prompt/**"
      - ".ai/user-policy.yaml"
      - ".ai/context-*.yaml"
      - ".ai/context-packs/**"
      - ".ai/knowledge/**"
      - ".ai/knowledge-graph-pilot.yaml"
      - ".ai/harness/mcp-activation.yaml"
      - ".ai/harness/risk-levels.yaml"
      - ".github/workflows/validate-policy-context.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "Policy/**"
      - "Context/**"
      - "Runtime/Permissions/**"
      - ".github/workflows/validate-policy-context.yml"

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Policy lossless migration
        run: python Policy/Validators/validate_user_policy_equivalence.py
      - name: Policy tests
        run: python -m unittest discover -s Policy/Tests -p "test_*.py"
      - name: Context tests
        run: python -m unittest discover -s Context/Tests -p "test_*.py"
      - name: Stale legacy path guard
        env:
          PHASE2_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python Context/Validators/validate_stale_paths.py
