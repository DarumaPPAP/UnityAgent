name: Validate Canonical Contracts

on:
  pull_request:
    paths:
      - "Runtime/**"
      - "Persistence/**"
      - "Operations/**"
      - "Eval/**"
      - ".github/workflows/validate-canonical-contracts.yml"
  push:
    branches: [main]
    paths:
      - "Runtime/**"
      - "Persistence/**"
      - "Operations/**"
      - "Eval/**"
      - ".github/workflows/validate-canonical-contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Runtime contracts
        run: python -m unittest discover -s Runtime/Tests -p "test_*.py"
      - name: Persistence contracts
        run: python -m unittest discover -s Persistence/Tests -p "test_*.py"
      - name: Operations contracts
        run: python -m unittest discover -s Operations/Tests -p "test_*.py"
      - name: Eval contracts and legacy replay
        run: python -m unittest discover -s Eval/Tests -p "test_*.py"
