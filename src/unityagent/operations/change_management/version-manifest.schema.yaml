$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:operations:version-manifest
title: VersionManifest
type: object
additionalProperties: false
required: [schema_version, manifest_id, architecture_version, policy_revision, prompt_revision, context_revision, graph_revision, runtime_profile_revision, tool_schema_revision, checkpoint_schema_revision, evidence_schema_revision, eval_contract_revision, operations_revision, generated_at]
properties:
  schema_version: {const: '1.0'}
  manifest_id: {type: string, minLength: 1}
  architecture_version: {type: string, minLength: 1}
  policy_revision: {type: string, minLength: 1}
  prompt_revision: {type: string, minLength: 1}
  context_revision: {type: string, minLength: 1}
  graph_revision: {type: string, minLength: 1}
  runtime_profile_revision: {type: string, minLength: 1}
  tool_schema_revision: {type: string, minLength: 1}
  checkpoint_schema_revision: {type: string, minLength: 1}
  evidence_schema_revision: {type: string, minLength: 1}
  eval_contract_revision: {type: string, minLength: 1}
  operations_revision: {type: string, minLength: 1}
  generated_at: {type: string, format: date-time}
