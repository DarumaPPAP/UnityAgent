$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:persistence:execution-state
title: ExecutionState
type: object
additionalProperties: false
required: [schema_version, run_id, status, current_step_id, current_action_id, evidence_refs, updated_at]
properties:
  schema_version: {const: '1.0'}
  run_id: {type: string, minLength: 1}
  status:
    enum: [idle, running, waiting, blocked, completed, failed, cancelled]
  current_step_id: {type: [string, 'null']}
  current_action_id: {type: [string, 'null']}
  active_tool_invocation_ref: {type: [string, 'null']}
  evidence_refs:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  updated_at: {type: string, format: date-time}
