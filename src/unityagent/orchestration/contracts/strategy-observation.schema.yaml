$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:orchestration:strategy-observation
title: 戦略の観測記録
type: object
additionalProperties: false
required:
- schema_version
- run_id
- step_id
- result_run_id
- current_path
- proposed_path
- recommendation
- reason_codes
- applied
- evidence_refs
- definition_fingerprint
- input_digest
- selection_inputs
- failure_class
- uncertain_side_effects
- result_status
- gates
- context_manifest_ref
- orchestration_decision_ref
properties:
  schema_version:
    const: '1.0'
  run_id:
    type: string
    minLength: 1
  step_id:
    type: string
    minLength: 1
  result_run_id:
    type: string
    minLength: 1
  current_path:
    enum:
    - fast
    - standard
    - orchestrated
    - null
  proposed_path:
    enum:
    - fast
    - standard
    - orchestrated
    - null
  recommendation:
    enum:
    - keep
    - promote
    - demote
    - blocked
    - not_evaluated
  reason_codes:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  applied:
    const: false
  evidence_refs:
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
  definition_fingerprint:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - architecture_version
    - policy_revision
    - prompt_revision
    - context_revision
    - graph_revision
    - runtime_profile_revision
    - tool_schema_revision
    - checkpoint_schema_revision
    - evidence_schema_revision
    - eval_contract_revision
    properties:
      schema_version:
        const: '1.0'
      architecture_version:
        type: string
        minLength: 1
      policy_revision:
        type: string
        minLength: 1
      prompt_revision:
        type: string
        minLength: 1
      context_revision:
        type: string
        minLength: 1
      graph_revision:
        type: string
        minLength: 1
      runtime_profile_revision:
        type: string
        minLength: 1
      tool_schema_revision:
        type: string
        minLength: 1
      checkpoint_schema_revision:
        type: string
        minLength: 1
      evidence_schema_revision:
        type: string
        minLength: 1
      eval_contract_revision:
        type: string
        minLength: 1
  input_digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  selection_inputs:
    type: object
    additionalProperties: false
    properties:
      task_count:
        type: integer
        minimum: 1
      simple_task:
        type: boolean
      requires_replan:
        type: boolean
      project_bound:
        type: boolean
      scope_known:
        type: boolean
      resource_conflict:
        type: boolean
      risk:
        enum:
        - low
        - medium
        - high
        - critical
      design_review:
        enum:
        - not_required
        - conditional
        - required
      context_profile:
        enum:
        - tight
        - standard
        - wide
      requested_subagent:
        type:
        - string
        - 'null'
        pattern: ^[a-z][a-z0-9_]*_subagent$
      required_subagents:
        type: array
        items:
          type: string
          pattern: ^[a-z][a-z0-9_]*_subagent$
  failure_class:
    type:
    - string
    - 'null'
  uncertain_side_effects:
    type: boolean
  result_status:
    type: string
    minLength: 1
  gates:
    type: object
    additionalProperties:
      type: string
  context_manifest_ref:
    type:
    - string
    - 'null'
  orchestration_decision_ref:
    type:
    - string
    - 'null'
  task_id:
    type: string
    minLength: 1
  attempt:
    type: integer
    minimum: 0
dependentRequired:
  task_id:
  - attempt
  attempt:
  - task_id
allOf:
- if:
    properties:
      recommendation:
        enum:
        - blocked
        - not_evaluated
  then:
    properties:
      proposed_path:
        const: null
  else:
    properties:
      proposed_path:
        enum:
        - fast
        - standard
        - orchestrated
      current_path:
        enum:
        - fast
        - standard
        - orchestrated
