$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:runtime:mutation-evidence
title: MutationEvidence
type: object
additionalProperties: false
required:
- schema_version
- mutation_id
- run_id
- step_id
- scope
- changed_paths
- diff_ref
- before_fingerprint
- after_fingerprint
- scope_status
- verification_refs
properties:
  schema_version:
    enum: ['1.0', '1.1']
  mutation_id: {type: string, minLength: 1}
  run_id: {type: string, minLength: 1}
  step_id: {type: string, minLength: 1}
  scope:
    type: object
    additionalProperties: false
    required: [allowed_paths, prohibited_paths]
    properties:
      allowed_paths:
        type: array
        items: {type: string, minLength: 1}
        uniqueItems: true
      prohibited_paths:
        type: array
        items: {type: string, minLength: 1}
        uniqueItems: true
  changed_paths:
    $ref: urn:unityagent:runtime:execution-result#/$defs/changed_paths
  diff_ref: {type: [string, 'null']}
  before_fingerprint: {type: [string, 'null']}
  after_fingerprint: {type: [string, 'null']}
  scope_status:
    enum: [within_scope, escaped, not_observed]
  verification_refs:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  approval_ref:
    type: [string, 'null']
  expected_revision:
    type: [integer, 'null']
  exact_diff_ref:
    type: [string, 'null']
  diff_digest:
    type: [string, 'null']
  provider_ref:
    type: [string, 'null']
  provider_plan_ref:
    type: [string, 'null']
  provider_session_ref:
    type: [string, 'null']
  mutation_scope_fingerprint:
    type: [string, 'null']
allOf:
- if:
    properties:
      schema_version: {const: '1.1'}
    required: [schema_version]
  then:
    required:
    - approval_ref
    - expected_revision
    - exact_diff_ref
    - diff_digest
    - provider_ref
    - provider_plan_ref
    - provider_session_ref
    - mutation_scope_fingerprint
- if:
    properties:
      changed_paths:
        properties:
          observation_state:
            const: not_observed
    required: [changed_paths]
  then:
    properties:
      scope_status:
        const: not_observed
