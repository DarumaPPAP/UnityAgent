$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:runtime:execution-evidence
title: ExecutionEvidence
type: object
additionalProperties: false
required:
- schema_version
- evidence_id
- run_id
- step_id
- producer
- source_type
- source_ref
- status
- payload_ref
- hash
- timestamp
- provenance
- definition_fingerprint
properties:
  schema_version:
    enum: ['1.0', '1.1']
  evidence_id: {type: string, minLength: 1}
  run_id: {type: string, minLength: 1}
  step_id: {type: string, minLength: 1}
  producer: {type: string, minLength: 1}
  source_type: {type: string, minLength: 1}
  source_ref: {type: [string, 'null']}
  status:
    enum: [passed, failed, unavailable, unverified]
  payload_ref: {type: [string, 'null']}
  hash: {type: [string, 'null']}
  timestamp: {type: [string, 'null'], format: date-time}
  provenance:
    type: array
    items: {type: string, minLength: 1}
    minItems: 1
    uniqueItems: true
  gate_outcome:
    anyOf:
    - type: 'null'
    - $ref: urn:unityagent:runtime:execution-result#/$defs/gate_outcome
  definition_fingerprint:
    $ref: urn:unityagent:persistence:definition-fingerprint
  capability:
    type: string
    minLength: 1
  provider_ref:
    type: string
    minLength: 1
  project_root:
    type: string
    minLength: 1
  environment:
    $ref: urn:unityagent:runtime:execution-evidence#/$defs/environment
  target:
    $ref: urn:unityagent:runtime:execution-evidence#/$defs/target
  safety_strength:
    type: integer
    minimum: 0
    maximum: 5
  evidence_strength:
    type: integer
    minimum: 0
    maximum: 5
  completion:
    enum: [verified, partial_verified, implemented_unverified, blocked_by_environment, not_applicable]
  observation_state:
    enum: [observed, not_observed]
  failure_class:
    type: [string, 'null']
    enum:
    - null
    - unavailable
    - unknown
    - unhealthy
    - ambiguous_binding
    - blocked_by_policy
    - blocked_by_approval
    - scope_violation
    - unsupported
    - backend_not_implemented
    - precondition_failed
    - execution_failed
    - cancelled
    - timeout
    - observed_test_failure
    - not_observed
  observed_evidence:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  required_evidence:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  raw_refs:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  mutation_provenance:
    anyOf:
    - type: 'null'
    - $ref: urn:unityagent:runtime:execution-evidence#/$defs/mutation_provenance
  latency_ms:
    type: [number, 'null']
    minimum: 0
  fallback_from:
    type: [string, 'null']
  durability:
    enum: [current_run]
allOf:
- if:
    properties:
      schema_version: {const: '1.1'}
    required: [schema_version]
  then:
    required:
    - capability
    - provider_ref
    - project_root
    - environment
    - target
    - safety_strength
    - evidence_strength
    - completion
    - observation_state
    - failure_class
    - observed_evidence
    - required_evidence
    - raw_refs
    - mutation_provenance
    - latency_ms
    - fallback_from
    - durability
- if:
    properties:
      completion: {const: verified}
    required: [completion]
  then:
    properties:
      observation_state: {const: observed}
$defs:
  environment:
    type: object
    additionalProperties: false
    required: [profile_hint, binding_fingerprint, unity_version, requested_target]
    properties:
      profile_hint: {type: [string, 'null']}
      binding_fingerprint: {type: string}
      unity_version: {type: [string, 'null']}
      requested_target: {type: [string, 'null']}
  target:
    type: object
    additionalProperties: false
    required: [surface, instance_id, device_id, artifact_id, command_ref]
    properties:
      surface:
        type: [string, 'null']
        enum: [project, host, editor, live_editor, player, null]
      instance_id: {type: [string, 'null']}
      device_id: {type: [string, 'null']}
      artifact_id: {type: [string, 'null']}
      command_ref: {type: [string, 'null']}
  mutation_provenance:
    type: object
    additionalProperties: false
    required:
    - approval_ref
    - expected_revision
    - exact_diff_ref
    - diff_digest
    - scope_fingerprint
    - plan_ref
    - session_ref
    - approval_group
    - before_fingerprint
    - after_fingerprint
    properties:
      approval_ref: {type: [string, 'null']}
      expected_revision: {type: [integer, 'null']}
      exact_diff_ref: {type: [string, 'null']}
      diff_digest: {type: [string, 'null']}
      scope_fingerprint: {type: [string, 'null']}
      plan_ref: {type: [string, 'null']}
      session_ref: {type: [string, 'null']}
      approval_group: {type: [string, 'null']}
      before_fingerprint: {type: [string, 'null']}
      after_fingerprint: {type: [string, 'null']}
