schema_version: "3.0"
id: rendering-incident
primary_skill: .agents/skills/unity-incident-investigation/SKILL.md

metadata:
  type: context
  title: Rendering Incident
  summary:
    - Investigate unknown rendering, platform, RenderGraph, or visual regressions.
  purpose:
    - Confirm the smallest rendering cause before allowing a mutation.
  decisions:
    - id: cause-before-mutation
      label: Rendering mutation requires a confirmed cause
      source_ref: src/unityagent/context/packs/rendering-incident.yaml#rules
  forbidden:
    - id: premature-rendering-mutation
      label: Mutation before confirmed cause is forbidden
      source_ref: src/unityagent/orchestration/contracts/task_contracts/rendering-incident.yaml#prohibited_mutations
  related: []
  priority: critical
  tags: [rendering, incident, investigation]

use_when:
  - rendering root cause is unknown
  - Editor Player or platform difference
  - RenderGraph validation error
  - visual regression caused by rendering behavior

required:
  - type: binding
    name: rendering_symptom
  - type: binding
    name: requested_rendering_scope
  - type: repository_reference
    path: docs/standards/RENDERING_STANDARDS.md

conditional:
  verification_requested: &reproduction_inputs
    - {type: binding, name: symptom_and_exact_error, required_when_active: true}
    - {type: binding, name: reproduction_conditions, required_when_active: true}
    - {type: binding, name: affected_rendering_sources, required_when_active: true}
    - {type: binding, name: renderer_feature_order, required_when_active: true}
  mutation_requested: *reproduction_inputs
  project_fallback:
    - type: repository_reference
      path: docs/architecture/specifications/ProjectProfile.md
  render_graph:
    - type: repository_reference
      path: .agents/skills/unity-rendering/SKILL.md
  shader_compile_or_variant:
    - type: repository_reference
      path: docs/standards/SHADER_PERFORMANCE_STANDARDS.md
    - type: repository_reference
      path: docs/standards/ShaderPerformance/UNITY_URP_POLICY.md
  strict_variant:
    - type: binding
      name: matching Variant Policy and governor Skill
  player_only:
    - type: binding
      name: build and platform evidence

excluded_by_default:
  - docs/standards/BEAUTIFUL_DEFINITION_INTEGRATION.md
  - unrelated CSharp antipattern catalog

rules:
  mutation_before_confirmed_cause: false
  one_primary_hypothesis_per_patch: true
  editor_result_does_not_prove_player: true
  direct_source_read_required: true
  detected_project_facts_override_project_profile: true
  project_profile_is_fallback_only: true
  initial_analysis_is_not_runtime_reproduction: true
  unknown_reproduction_and_feature_order_require_observation: true

limits:
  initial_file_reads: 7
  context_expansion_hops: 1

output:
  - confirmed_facts
  - hypotheses
  - rejected_hypotheses
  - smallest_observation_needed
  - domain_evidence_required
  - mutation_gate
