id: visual.unity_artist_cli
version: "2.0.0"
status: reviewed

use_when:
  - explicit visual intent requires LookDev, Lighting, Environment, Camera, Capture, Evaluation, or Refine
  - explicit cinematic intent requires Timeline, Cinemachine Shot, Track, Clip, Binding, Marker, Signal, Activation, Control, or Animation work

required_inputs:
  - project_root
  - exact_scene_or_asset_scope
  - visual_or_cinematic_intent
  - technical_constraints
  - prohibited_changes

principles:
  - UnityAgentがPolicy、Approval、Mutation Scope、Routing、Loop、Fallback、Evidence永続化を所有する。
  - ArtistSubAgentが専門Agentであり、unity_cliは導入済みArtist UPMの全9コマンドをUnity Pipelineから実行する。独立Artist Hostは使用しない。
  - 要求はscene.inspect、visual.capture、domain.workflowの意味的Capabilityとdomain／workflow qualifiersを用い、Provider identityを利用者の意図へ混ぜない。
  - Unity CLIは自動化の入口であり、Unity Pipelineが対象ProjectにBindした実Editorへ接続する。
  - Unity 2022.3は現行Production対象外であり、過去のBatch Evidenceを現在のFallbackへ昇格しない。
  - 未対応Version／Pipeline、未観測の到達性、Project binding不成立はMutation前に拒否する。
  - Plan、Revision、Exact Diff、mutationPathsとScope、Project／Run／Context、承認期限／取消／再利用をControl PlaneとEditorの実行直前照合で検証する。
  - Captureは技術Evidenceであり、Human Visual Acceptanceではない。EvaluateはCaptureとdecisionの計画を明示承認した後に記録し、Refineは同Run／ContextのEvaluationへ接続する。
  - Editor製品名UnityArtistCLIとこのKnowledge IDは互換性のため維持するが、旧Hostや旧Providerの実行依存を意味しない。

workflow:
  - inspect
  - visual_intent
  - exact_plan_and_diff
  - expected_revision
  - unity_agent_approval
  - apply
  - undo_and_evidence
  - capture
  - human_evaluate
  - refine

formal_release_matrix:
  - { unity_version: "Unity 6.x+", render_pipeline: builtin, support_tier: primary }
  - { unity_version: "Unity 6.x+", render_pipeline: urp, support_tier: primary }
  - { unity_version: "Unity 6.x+", render_pipeline: hdrp, support_tier: primary }

non_goals:
  - generic GameObject, hierarchy, compile, test, build, play, stop, log, Addressables, UI, or Audio operations
  - arbitrary eval or raw serialized Unity mutation
  - automatic save, automatic visual acceptance, or silent fallback
