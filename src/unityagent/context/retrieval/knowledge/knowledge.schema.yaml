schema_version: "1.0"
kind: unity_knowledge_contract

required_fields:
  - id
  - version
  - status
  - use_when
  - required_inputs
  - implementation_contract
  - prohibited
  - required_evidence

field_rules:
  id:
    pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
  status:
    allowed:
      - draft
      - reviewed
      - deprecated
  use_when:
    min_items: 1
  required_inputs:
    min_items: 1
  implementation_contract:
    min_items: 1
  prohibited:
    min_items: 1
  required_evidence:
    min_items: 1
  related:
    required_default: []
    conditional_default: []

content_limits:
  max_lines_recommended: 250
  long_explanations: prohibited
  embedded_images: prohibited
  copied_source_documents: prohibited
  source_summary_dump: prohibited

ownership:
  ai_contract_source_of_truth: UnityAgent
  reference_projection_source_of_truth: MyResourceCenter catalog/reference-snapshot.json
  raw_source_source_of_truth: Google Drive KnowledgeLibrary/Sources
