id: asset-data-change
default_execution_profile: personal_full_control
risk_level: R3
mutation_channel_binding: request

required_inputs:
  - target_asset_type
  - requested_change
  - serialization_compatibility_requirements

allowed_mutations:
  - target_asset_through_authoritative_editor_channel
  - directly_required_meta_or_import_state

prohibited_mutations:
  - raw_scene_yaml_edit
  - raw_prefab_yaml_edit
  - raw_material_yaml_edit
  - broad_asset_database_scan_without_scope
  - public_or_serialized_contract_change_without_migration

required_knowledge: []
required_quality_gates:
  - static_review
  - serialization_validation
  - missing_reference_check
conditional_quality_gates:
  - compile
  - editmode
  - playmode

completion:
  - authoritative_mutation_channel_is_used
  - asset_and_meta_state_are_consistent
  - missing_references_are_not_introduced
  - rollback_or_restore_path_is_recorded

stop_conditions:
  - authoritative_editor_channel_is_unavailable_for_direct_mutation
  - target_asset_identity_is_unresolved
  - migration_of_existing_serialized_data_is_required_but_undefined

result_format:
  summary: asset_change_and_compatibility
  changed_artifacts: asset_meta_and_support_paths
  validation: serialization_reference_and_runtime_statuses
  unresolved: manual_bindings_and_unavailable_gates
