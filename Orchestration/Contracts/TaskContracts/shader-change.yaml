id: shader-change
default_execution_profile: personal_full_control
risk_level: R2
mutation_channels:
  - shader

required_inputs:
  - shader_or_include_targets
  - requested_visual_or_functional_change
  - unity_and_pipeline_version
  - target_platforms

allowed_mutations:
  - target_shaderlab_hlsl_compute_source
  - directly_required_renderer_integration

prohibited_mutations:
  - unrequested_shader_name_change
  - unrequested_property_keyword_pass_or_lightmode_change
  - variant_removal_without_runtime_source_review
  - performance_claim_without_measurement

required_knowledge:
  - select_primary_rendering_knowledge_from_index
required_quality_gates:
  - static_review
  - shader_compile
conditional_quality_gates:
  - material_visual_case
  - player
  - target_device
  - performance_capture

completion:
  - shader_contract_is_preserved_or_explicitly_migrated
  - include_and_keyword_dependencies_are_recorded
  - shader_compile_is_passed_or_reported_unavailable
  - visual_or_runtime_gate_is_reported_separately

stop_conditions:
  - required_pass_contract_is_unknown
  - requested_result_requires_unavailable_visual_reference

result_format:
  summary: shader_contract_and_effect
  changed_artifacts: shader_paths_and_contract_changes
  validation: compile_visual_runtime_statuses
  unresolved: variants_platforms_and_unavailable_gates
