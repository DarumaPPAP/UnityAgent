id: visual-direction
default_execution_profile: generic_planning
risk_level: R1
mutation_channel_binding: request

required_inputs:
  - visual_goal
  - scene_or_capture_scope
  - visual_reference_or_definition
  - technical_constraints
  - prohibited_changes

allowed_mutations:
  - visual_intent
  - composition_plan
  - lighting_plan
  - color_and_atmosphere_plan
  - camera_presentation_plan
  - explicitly_approved_scene_or_asset_changes

prohibited_mutations:
  - visual_acceptance_without_human_review
  - unapproved_scene_mutation
  - unapproved_lighting_bake
  - arbitrary_post_effect_addition
  - copying_reference_identity_or_protected_expression
  - technical_quality_claim_from_capture_generation_only

required_knowledge: []

required_quality_gates:
  - static_review
  - graphics_compare

conditional_quality_gates:
  - compile
  - playmode
  - player
  - performance_capture
  - target_device

completion:
  - visual_intent_is_explicit
  - selected_visual_definition_or_reference_boundary_is_recorded
  - technical_translation_is_defined
  - required_captures_are_defined
  - human_review_status_is_reported

stop_conditions:
  - visual_goal_is_undefined
  - mutation_is_requested_without_scene_or_asset_scope
  - final_visual_acceptance_has_no_human_review_path
  - reference_boundary_is_unclear

result_format:
  summary: visual_direction_and_review_state
  changed_artifacts: visual_intent_plans_and_explicitly_approved_changes
  validation: capture_technical_and_human_review_status
  unresolved: technical_bindings_and_visual_decisions
