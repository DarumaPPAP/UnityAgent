schema_version: "1.1"
kind: unity_task_contract

required_fields:
  - id
  - default_execution_profile
  - risk_level
  - required_inputs
  - allowed_mutations
  - prohibited_mutations
  - required_knowledge
  - required_quality_gates
  - completion
  - stop_conditions
  - result_format

field_rules:
  id:
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  default_execution_profile:
    allowed:
      - generic_planning
      - personal_full_control
      - team_safe_import
  risk_level:
    allowed:
      - R0
      - R1
      - R2
      - R3
      - R4
  mutation_channels:
    min_items: 1
  mutation_channel_binding:
    allowed:
      - request
  required_inputs:
    min_items: 1
  allowed_mutations:
    min_items: 1
  prohibited_mutations:
    min_items: 1
  required_quality_gates:
    min_items: 1
  completion:
    min_items: 1
  result_format:
    required:
      - summary
      - changed_artifacts
      - validation
      - unresolved

mutation_channel_rules:
  allowed_mutations_require_explicit_channels_or_request_binding: true
  mutation_channels_and_binding_are_mutually_exclusive: true
  task_contract_id_must_not_infer_mutation_channel: true
  request_bound_channel_may_remain_unresolved_during_planning: true
  direct_mutation_requires_resolved_known_channel: true

execution_rules:
  select_exactly_one_primary_contract: true
  missing_capability_does_not_block_planning: true
  unavailable_gate_must_be_reported: true
  unavailable_gate_must_not_be_reported_as_passed: true
  unresolved_project_binding_must_not_be_guessed: true
