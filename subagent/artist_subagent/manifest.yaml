schema_version: '5.0'
kind: subagent_manifest
execution:
  kind: provider_backed
identity:
  id: artist_subagent
  name: ArtistSubAgent
  version: 0.0.2-beta
lifecycle: active
installation:
  mode: optional
  required: false
  auto_install: false
activation:
  required_before_resolution:
  - unity_artist_cli.available
  - unity_artist_cli.compatible
  - unity_artist_cli.project_bound
  - unity_artist_cli.package_installed
  - unity_artist_cli.pipeline_reachable
  false_behavior: exclude_from_resolution
  unknown_behavior: exclude_from_resolution
capabilities:
- id: artist.camera
  operations:
  - inspect
  - refine
- id: visual
  operations:
  - capture
capability_contract_ref: subagent/artist_subagent/contracts/capability-contracts.yaml
compatibility:
  supported_targets:
  - unity_version: Unity 6.x+
    render_pipeline: builtin
  - unity_version: Unity 6.x+
    render_pipeline: urp
  - unity_version: Unity 6.x+
    render_pipeline: hdrp
dependencies:
- id: unity_artist_cli
  kind: backend
  required: true
  eligibility_gate: unity_artist_cli.available
- id: com.darumappap.artist-subagent
  kind: unity_package
  required: true
  eligibility_gate: unity_artist_cli.package_installed
- id: com.unity.pipeline
  kind: unity_package
  required: true
  eligibility_gate: unity_artist_cli.pipeline_reachable
backends:
- id: unity_artist_cli
  kind: cli
  contract_ref: subagent/artist_subagent/contracts/backend-surface-contract.yaml
evidence:
  required: true
  required_artifacts:
  - provider_result
  - normalized_evidence
  runtime_types:
  - mutation_diff
  - editor_observation
  - visual_capture
  terminal_states:
  - verified
  - partial_verified
  - blocked_by_environment
  - unavailable
