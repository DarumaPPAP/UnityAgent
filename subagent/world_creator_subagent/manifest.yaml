schema_version: '5.0'
kind: subagent_manifest
identity:
  id: world_creator_subagent
  name: WorldCreatorSubAgent
  version: 0.0.1-beta
lifecycle: active
installation:
  mode: optional
  required: false
  auto_install: false
activation:
  required_before_resolution:
  - project.exists
  - filesystem.readable
  false_behavior: exclude_from_resolution
  unknown_behavior: exclude_from_resolution
execution:
  kind: reasoning
  reasoning_runtime: codex_runner
  execution_mode: planning_only
  source_context_binding: required
  required_observation_capabilities: []
  instructions_ref: subagent/world_creator_subagent/instructions.md
  output_contract_ref: subagent/world_creator_subagent/contracts/world-plan-result.schema.json
capabilities:
- id: world
  operations:
  - plan
capability_contract_ref: subagent/world_creator_subagent/contracts/production-capability-contract.yaml
compatibility:
  supported_targets:
  - unity_version: Unity 6.x+
    render_pipeline: builtin
  - unity_version: Unity 6.x+
    render_pipeline: urp
  - unity_version: Unity 6.x+
    render_pipeline: hdrp
dependencies: []
backends: []
evidence:
  required: true
  required_artifacts:
  - structured_reasoning_artifact
  - normalized_evidence
  - source_context_binding
  runtime_types:
  - world_plan
  terminal_states:
  - verified
  - partial_verified
  - blocked_by_environment
  - unavailable
