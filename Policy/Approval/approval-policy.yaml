schema_version: "1.0"
kind: approval_policy
authority: Policy
risk_source: Policy/Risk/risk-levels.yaml
requirements:
  R0: not_required
  R1: conditional
  R2: before_destructive_or_contract_change
  R3: required_for_project_asset_or_settings_change
  R4: always_required
tool_operations:
  mutate: explicit_permission_required
  bake: separate_explicit_permission_required
  visual_acceptance: human_review_required
rules:
  policy_decides_whether_approval_is_required: true
  orchestration_places_human_gate: true
  runtime_pauses_serializes_and_applies_decision: true
  runtime_revalidates_high_risk_action_before_execution: true

authorization_scope:
  existing_explicit_authorization_remains_valid_within_scope: true
  read_search_analysis_review_do_not_require_reconfirmation: true
  requested_reversible_source_edits_and_local_validation_do_not_require_reconfirmation: true
  scope_expansion_or_destructive_action_requires_existing_policy_decision: true
  tool_approval_revision_diff_and_permission_contracts_remain_required: true
