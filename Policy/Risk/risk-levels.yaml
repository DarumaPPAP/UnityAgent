schema_version: "1.0"

levels:
  R0:
    description: 説明、Read-only監査、設計のみ
    mutation: none
    human_approval: not_required

  R1:
    description: 局所Source修正、公開契約変更なし
    mutation: bounded_source
    human_approval: conditional

  R2:
    description: 複数Source、Shader、Runtime挙動、Portable Package
    mutation: multi_artifact_bounded
    human_approval: before_destructive_or_contract_change

  R3:
    description: RendererFeature、Scene、Prefab、Material、Project統合
    mutation: project_integration
    human_approval: required_for_project_asset_or_settings_change

  R4:
    description: Package内部改造、Project Settings、実機配布、破壊的Migration
    mutation: high_impact
    human_approval: always_required

escalation:
  - from: R1
    to: R2
    when: direct_dependency_requires_change
  - from: R2
    to: R3
    when: scene_prefab_material_or_renderer_data_change_required
  - from: R3
    to: R4
    when: package_internal_or_project_settings_change_required

rules:
  capability_unavailable_does_not_raise_risk_by_itself: true
  unknown_project_binding_blocks_direct_mutation_not_planning: true
  team_safe_import_never_grants_project_export_capability: true
