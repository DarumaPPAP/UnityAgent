schema_version: "1.1"
authority: Policy
kind: quality_gate_catalog

result_statuses:
  - passed
  - failed
  - unavailable

rules:
  unavailable_is_not_failure: true
  unavailable_is_not_success: true
  unavailable_requires_reason: true
  unavailable_requires_remaining_validation: true
  evidence_scope_must_not_be_overclaimed: true

gates:
  architecture_fit:
    proves:
      - selected_architecture_matches_confirmed_problem_and_constraints
      - simpler_candidates_were_considered
      - simplest_cohesive_candidate_was_considered_first
      - speculative_structure_is_not_required_by_the_selected_design
      - abstractions_are_backed_by_confirmed_duplication_variation_or_boundary
      - solid_principles_are_applied_conditionally_not_mechanically
      - rejected_alternatives_have_reasons
      - reevaluation_conditions_are_declared
    does_not_prove:
      - unity_compile
      - runtime_behavior
      - performance_improvement
  file_granularity:
    proves:
      - every_new_file_has_a_split_reason
      - each_new_primary_type_has_a_real_responsibility_or_boundary_reason
      - feature_local_types_were_considered_for_co_location
      - property_level_type_proliferation_was_reviewed
      - speculative_abstractions_are_not_required_by_the_plan
    does_not_prove:
      - long_term_maintainability
      - runtime_correctness
  ownership_and_lifetime:
    proves:
      - creator_owner_readers_writers_and_release_responsibility_are_declared
      - scene_domain_reload_and_native_resource_lifetimes_are_considered
    does_not_prove:
      - runtime_cleanup_on_all_paths
      - absence_of_resource_leaks
  ecs_data_layout:
    proves:
      - component_and_query_boundaries_are_declared
      - managed_references_structural_changes_and_sync_points_are_reviewed
      - gameobject_bridge_and_baking_boundaries_are_declared
    does_not_prove:
      - chunk_utilization_at_runtime
      - performance_improvement
      - target_device_support
  static_review:
    proves:
      - source_structure
      - declared_contract_consistency
      - prohibited_api_usage
    does_not_prove:
      - unity_compile
      - runtime_behavior
      - visual_quality
  compile:
    proves:
      - csharp_or_shader_syntax_for_executed_scope
      - assembly_reference_resolution_for_executed_scope
    does_not_prove:
      - runtime_behavior
      - visual_quality
      - platform_compatibility
  unity_compile:
    alias_of: compile
    proves:
      - unity_compile_for_executed_scope
    does_not_prove:
      - runtime_behavior
      - target_device_support
  shader_compile:
    proves:
      - shader_compilation_for_executed_variants_and_backend
    does_not_prove:
      - all_player_variants
      - runtime_keyword_coverage
      - visual_correctness
  render_graph_validation:
    proves:
      - declared_pass_and_resource_validity_for_executed_path
    does_not_prove:
      - visual_correctness
      - target_device_support
  runtime_reproduction:
    proves:
      - reported_runtime_symptom_was_reproduced_or_resolved_under_recorded_conditions
    does_not_prove:
      - other_scenes
      - other_platforms
  editmode:
    proves:
      - tested_editor_logic
      - tested_asset_or_serialization_contract
  playmode:
    proves:
      - tested_runtime_behavior_in_editor_or_test_player_scope
  player:
    proves:
      - tested_player_code_path
    does_not_prove:
      - all_target_devices
  player_capture:
    alias_of: player
    proves:
      - captured_player_output_under_recorded_conditions
    does_not_prove:
      - all_target_devices
  graphics_compare:
    proves:
      - visual_difference_under_fixed_capture_conditions
    does_not_prove:
      - artistic_acceptance
  material_visual_case:
    proves:
      - requested_material_or_shader_visual_case_was_checked_under_recorded_conditions
    does_not_prove:
      - all_materials
      - artistic_acceptance
  editor_capture:
    proves:
      - captured_editor_visual_state_under_recorded_conditions
    does_not_prove:
      - player_equivalence
      - target_device_support
  performance_capture:
    proves:
      - measured_performance_under_recorded_conditions
    does_not_prove:
      - other_platforms_or_scenes
  baseline_measurement:
    proves:
      - before_metric_was_measured_under_fixed_conditions
    does_not_prove:
      - candidate_improvement
  candidate_measurement:
    proves:
      - candidate_metric_was_measured_under_fixed_conditions
    does_not_prove:
      - baseline_equivalence_without_recorded_conditions
  quality_regression_check:
    proves:
      - declared_quality_constraints_were_checked_for_candidate
    does_not_prove:
      - unrelated_visual_or_runtime_quality
  before_after_gpu_measurement:
    alias_of: performance_capture
    proves:
      - before_after_gpu_measurement_under_recorded_conditions
    does_not_prove:
      - other_hardware_or_scenes
  target_device:
    proves:
      - tested_behavior_on_the_named_device_and_build
  target_device_capture:
    alias_of: target_device
    proves:
      - captured_output_on_the_named_device_and_build
    does_not_prove:
      - other_devices_or_builds
  package_security_scan:
    proves:
      - configured_rules_found_no_blocking_pattern
    does_not_prove:
      - complete_security_of_all_dependencies
  dependency_validation:
    proves:
      - declared_dependencies_were_checked_against_configured_policy
    does_not_prove:
      - future_dependency_safety
  staging_integrity:
    proves:
      - package_mutation_stayed_inside_the_declared_staging_boundary
    does_not_prove:
      - target_project_integration
  package_structure_validation:
    proves:
      - portable_layout_and_declared_boundaries
  serialization_validation:
    proves:
      - tested_serialization_contract_and_reference_integrity
  missing_reference_check:
    proves:
      - checked_changed_asset_scope_for_missing_references
    does_not_prove:
      - unrelated_project_assets
  specification_traceability:
    proves:
      - requested_mcp_capability_maps_to_explicit_contract_and_artifacts
    does_not_prove:
      - runtime_implementation_correctness
  architecture_policy_review:
    proves:
      - mcp_architecture_was_reviewed_against_unityagent_policy
    does_not_prove:
      - unity_compile
  namespace_and_type_naming_review:
    proves:
      - generated_or_planned_names_follow_selected_naming_contract
      - type_naming_occurs_after_responsibility_and_structure_are_resolved
      - contextual_redundancy_was_reviewed
      - unexplained_abbreviation_was_reviewed
      - role_suffix_stacking_was_reviewed
      - namespace_repetition_was_reviewed
      - excessive_length_triggered_responsibility_review
      - existing_public_or_serialized_names_were_preserved_unless_rename_was_requested
    does_not_prove:
      - runtime_behavior
      - architecture_correctness_by_itself
      - semantic_correctness_of_domain_terms_without_context
  mcp_catalog_and_manifest_consistency:
    proves:
      - selected_mcp_catalog_manifest_and_tool_schema_bindings_are_consistent
    does_not_prove:
      - backend_runtime_availability
  environment_resolution_contract_review:
    proves:
      - detected_facts_requested_targets_and_unresolved_bindings_are_separated
    does_not_prove:
      - target_environment_availability
