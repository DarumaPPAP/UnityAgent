$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:operations:incident
title: Incident
type: object
additionalProperties: false
required: [schema_version, incident_id, severity, status, summary, detection_refs, run_ids, runbook_id, created_at, updated_at]
properties:
  schema_version: {const: '1.0'}
  incident_id: {type: string, minLength: 1}
  severity: {enum: [warning, error, critical]}
  status: {enum: [open, mitigated, resolved]}
  summary: {type: string, minLength: 1}
  detection_refs:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
    uniqueItems: true
  run_ids:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
    uniqueItems: true
  runbook_id: {type: string, minLength: 1}
  created_at: {type: string, format: date-time}
  updated_at: {type: string, format: date-time}
