version: 2
purpose: Canonical Route選択後のSpecialist SkillとUser Policy Operationを検証する
cases:
  - id: SKILL-001
    category: incident-csharp
    prompt: "原因不明のInvalidOperationExceptionを調査して。"
    selected_route: csharp-local-fix
    expected_specialist: unity-incident-investigation
    must_include:
      - Expected
      - Actual
      - 仮説
    must_not:
      - 原因未確定の全面リファクタリング

  - id: SKILL-002
    category: csharp-audit
    prompt: "このUnity C#コードを変更せず、所有権とAllocationを監査して。"
    selected_route: csharp-local-fix
    expected_specialist: csharp-antipattern-audit
    must_include:
      - 根拠
      - 確度
    must_not:
      - コード変更

  - id: SKILL-003
    category: renderer-feature
    prompt: "Shaderを変更せずRendererFeatureのInjection Pointを修正して。"
    selected_route: renderer-feature-change
    expected_specialist: unity-rendering
    must_not_require:
      - target_shader

  - id: SKILL-004
    category: shader-audit
    prompt: "このHLSLのifとdiscardを全部消して高速化して。"
    selected_route: shader-change
    expected_specialist: shader-performance-auditor
    must_include:
      - 一律禁止しない
      - 実測
    must_not:
      - 無条件のif削除
      - 無条件のdiscard削除

  - id: SKILL-005
    category: performance-evidence
    prompt: "この最適化で本当にSwitch実機が速くなったか判定して。"
    selected_route: performance-experiment
    expected_specialist: unity-runtime-evidence
    must_include:
      - 同条件
      - sample
      - Inconclusive
    must_not:
      - Editor数値だけの実機判定

  - id: SKILL-006
    category: bounded-implementation
    prompt: "指定した3クラスだけ修正して。ControllerやProfileは追加しないで。"
    selected_route: csharp-local-fix
    expected_operation: unity-implement
    must_include:
      - 指定3クラス
      - Split Reason
    must_not:
      - Controller追加
      - Profile追加
      - Manager追加

  - id: SKILL-007
    category: comment-production
    prompt: "この完成コードへ本番用の日本語コメントを追加して。"
    expected_operation: production-code-comments
    must_include:
      - 意図
      - 制約
      - 所有権または寿命
    must_not:
      - 逐行の日本語訳
      - ロジック変更

  - id: SKILL-008
    category: comment-learning
    prompt: "このコードを新人向け教材にして、処理順を詳しくコメントして。"
    expected_operation: learning-code-comments
    must_include:
      - 処理の流れ
      - データフロー
      - Unityライフサイクル
    must_not:
      - ロジック変更

  - id: SKILL-009
    category: comment-review
    prompt: "既存の日本語コメントがコードと矛盾していないか監査して。"
    expected_operation: comment-quality-reviewer
    must_include:
      - 正確性
      - 冗長
      - 陳腐化
    must_not:
      - コード本体の変更

  - id: SKILL-010
    category: namespace-placeholder-guard
    prompt: "RootNamespace未設定のFeatureを実装して。FeatureNameはUnityAgentValidation。"
    selected_route: csharp-local-fix
    expected_operation: unity-implement
    must_include:
      - UnityAgentValidation
      - Root Namespaceなし
    must_not:
      - namespace Namespace.UnityAgentValidation
      - namespace .UnityAgentValidation
      - CHANGE_ME.UnityAgentValidation

  - id: SKILL-011
    category: simple-explanation
    prompt: "material.shader = Shader.Find(material.shader.name); は何をしているの？"
    expected_behavior: explanation_without_route_or_mutation
    must_not:
      - Spec作成
      - Plan作成
      - Supervisor State
      - ファイル変更
