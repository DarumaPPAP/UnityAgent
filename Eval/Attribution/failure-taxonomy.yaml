schema_version: '1.2'
principles:
  - typed_facts_only_no_text_inference
  - not_observed_is_excluded_from_agent_quality_denominator
  - runtime_and_evaluator_defects_are_not_agent_regressions
  - provider_environment_failure_is_not_agent_regression
  - observed_product_failure_requires_eval_expectation_before_agent_regression
  - eval_may_classify_and_propose_but_must_not_mutate_production_definitions
failures:
  agent_behavior_regression:
    attribution: agent_quality
    observation_state: observed
    quality_denominator_eligible: true
  runtime_timeout:
    attribution: runtime_infrastructure
    observation_state: not_observed
    quality_denominator_eligible: false
  runtime_protocol_failure:
    attribution: runtime_infrastructure
    observation_state: not_observed
    quality_denominator_eligible: false
  runtime_cancelled:
    attribution: runtime_infrastructure
    observation_state: not_observed
    quality_denominator_eligible: false
  runtime_tool_unavailable:
    attribution: runtime_infrastructure
    observation_state: not_observed
    quality_denominator_eligible: false
  runtime_permission_denied:
    attribution: policy_or_permission
    observation_state: not_observed
    quality_denominator_eligible: false
  evaluator_contract_failure:
    attribution: evaluator_infrastructure
    observation_state: not_observed
    quality_denominator_eligible: false
  task_fixture_invalid:
    attribution: fixture_invalid
    observation_state: not_observed
    quality_denominator_eligible: false
  unavailable_required_evidence:
    attribution: unavailable_evidence
    observation_state: not_observed
    quality_denominator_eligible: false
provider_failures:
  unavailable: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  unknown: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  unhealthy: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  ambiguous_binding: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  unsupported: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  backend_not_implemented: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  precondition_failed: {attribution: environment_or_provider, eval_failure_class: runtime_tool_unavailable}
  timeout: {attribution: provider_infrastructure, eval_failure_class: runtime_timeout}
  cancelled: {attribution: provider_infrastructure, eval_failure_class: runtime_cancelled}
  blocked_by_policy: {attribution: policy_or_permission, eval_failure_class: runtime_permission_denied}
  blocked_by_approval: {attribution: policy_or_permission, eval_failure_class: runtime_permission_denied}
  scope_violation: {attribution: policy_or_permission, eval_failure_class: runtime_permission_denied}
  not_observed: {attribution: unavailable_evidence, eval_failure_class: unavailable_required_evidence}
  execution_failed: {attribution: observed_product_failure, eval_failure_class: null}
  observed_test_failure: {attribution: observed_product_failure, eval_failure_class: null}
legacy_golden_failure_details:
  - routing_miss
  - context_miss
  - policy_violation
  - harness_violation
  - mutation_violation
  - evidence_overclaim
  - model_failure
  - broken_eval
  - unavailable_evidence
