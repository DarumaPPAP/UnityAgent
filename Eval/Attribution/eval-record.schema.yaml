$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:eval:eval-record
title: EvalRecord
type: object
additionalProperties: false
required: [schema_version, eval_id, run_id, observation_state, failure_class, quality_denominator_eligible, runtime_failure_ref, evidence_refs, reason, source_execution_result_ref]
properties:
  schema_version: {const: '1.0'}
  eval_id: {type: string, minLength: 1}
  run_id: {type: string, minLength: 1}
  observation_state:
    enum: [observed, not_observed]
  failure_class:
    type: [string, 'null']
    enum: [null, agent_behavior_regression, runtime_timeout, runtime_protocol_failure, evaluator_contract_failure, task_fixture_invalid, unavailable_required_evidence]
  quality_denominator_eligible: {type: boolean}
  runtime_failure_ref: {type: [string, 'null']}
  evidence_refs:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  reason: {type: string}
  source_execution_result_ref: {type: string, minLength: 1}
allOf:
- if:
    properties:
      observation_state: {const: not_observed}
    required: [observation_state]
  then:
    properties:
      quality_denominator_eligible: {const: false}
- if:
    properties:
      failure_class:
        enum: [runtime_timeout, runtime_protocol_failure, evaluator_contract_failure, task_fixture_invalid, unavailable_required_evidence]
    required: [failure_class]
  then:
    properties:
      quality_denominator_eligible: {const: false}
      observation_state: {const: not_observed}
- if:
    properties:
      failure_class: {const: agent_behavior_regression}
    required: [failure_class]
  then:
    properties:
      quality_denominator_eligible: {const: true}
      observation_state: {const: observed}
