$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:eval:change-proposal
title: ChangeProposal
type: object
additionalProperties: false
required: [schema_version, proposal_id, created_at, source_eval_refs, target_authority, proposed_change, rationale, evidence_refs, status, applies_change, requires_human_review]
properties:
  schema_version: {const: '1.0'}
  proposal_id: {type: string, minLength: 1}
  created_at: {type: string, format: date-time}
  source_eval_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  target_authority:
    enum: [Policy, Context, Orchestration, Runtime, Persistence, Operations, Eval]
  proposed_change: {type: string, minLength: 1}
  rationale: {type: string, minLength: 1}
  evidence_refs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  status: {const: proposed}
  applies_change: {const: false}
  requires_human_review: {const: true}
