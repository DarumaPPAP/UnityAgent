$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:eval:retrieval-report
title: RetrievalEvalReport
type: object
additionalProperties: false
required: [schema_version, run_id, dataset_revision, rag_contract_revision, index_revision, backend, ranking_config, metrics, performance, decision, failure_attribution, cases]
properties:
  schema_version: {const: '1.0'}
  run_id: {type: string, minLength: 1}
  generated_at: {type: string, minLength: 1}
  dataset_revision: {type: string, minLength: 1}
  rag_contract_revision: {type: string, minLength: 1}
  index_revision: {type: string, minLength: 1}
  backend: {type: object}
  ranking_config: {type: object}
  metrics: {type: object}
  performance: {type: object}
  thresholds: {type: object}
  decision: {enum: [PASS, FAIL]}
  failure_attribution: {type: object}
  cases: {type: array, minItems: 20, items: {type: object}}
