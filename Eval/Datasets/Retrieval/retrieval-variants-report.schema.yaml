$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:eval:retrieval-variants-report
title: RetrievalVariantsReport
type: object
additionalProperties: false
required: [schema_version, run_id, generated_at, dataset_revision, index_revision, rag_contract_revision, overall_decision, variants]
properties:
  schema_version: {const: '1.0'}
  run_id: {type: string, minLength: 1}
  generated_at: {type: string, minLength: 1}
  dataset_revision: {type: string, minLength: 1}
  index_revision: {type: string, minLength: 1}
  rag_contract_revision: {type: string, minLength: 1}
  overall_decision: {enum: [PASS, FAIL]}
  variants:
    type: object
    minProperties: 1
    additionalProperties: {type: object}
