schema_version: "1.0"
kind: production_smoke_task_contracts

rules:
  golden_expectation_must_not_be_exposed: true
  production_prompt_must_be_user_realistic: true
  observed_evidence_is_input_evidence_not_expectation: true
  expected_route_must_not_be_encoded: true
  primary_focus_is_blocking: true
  non_focus_observations_are_diagnostic: true

cases:
  GOLDEN-ARCH-001:
    primary_focus: architecture
    production_prompt: |
      既存 CameraDebugger に Far Clip の変更検出を追加する設計を検討してください。
      既存責務の中で完結させるべきか、新規 Type に分離すべきかを、現在の要求範囲だけを根拠に判断してください。
      不要な Manager / Controller / Service / Interface は追加せず、今回は実装しないでください。

  GOLDEN-NAMING-001:
    primary_focus: naming
    production_prompt: |
      既存 CameraDebugger へ Far Clip 変更検出を追加する設計を検討してください。
      既存責務内で完結させるべきか、新規 Type へ分離すべきか判断してください。
      必要なら Type Naming もレビューしてください。
      今回は実装しないでください。

  GOLDEN-MUTATION-001:
    primary_focus: mutation
    production_prompt: |
      CameraDebugger.cs に既知の Compile Error が1件あります。
      既存 Public Contract と構造を維持したまま、このエラーだけを最小 Patch で修正してください。
      変更可能なのは CameraDebugger.cs のみです。

  GOLDEN-EVIDENCE-001:
    primary_focus: evidence
    production_prompt: |
      以下の検証 Evidence のみが取得されています。
      - C# compile: PASS

      この Evidence で確認できたことと、まだ確認できていないことを報告してください。
      Runtime / Unity Editor / target-device 検証は実行されていません。
    observed_evidence:
      - id: compile-fixture
        gate: compile
        status: passed
        scope: CameraDebugger.cs
        source: fixture
        statement: C# compile completed with 0 errors
