schema_version: "3.0"
kind: typed_context_pack_contract

metadata:
  type: context
  title:
    max_length: 80
  summary:
    min_items: 1
    max_items: 3
    item_max_length: 160
  purpose:
    min_items: 1
    max_items: 5
  decisions:
    min_items: 1
    max_items: 12
    required_fields: [id, label, source_ref]
  forbidden:
    min_items: 1
    max_items: 12
    required_fields: [id, label, source_ref]
  related:
    max_items: 8
    required_fields: [id, relation, reason, source_ref]
  priority:
    allowed: [critical, high, normal, low]
  tags:
    max_items: 8

relations:
  allowed:
    - related-to
    - depends-on
    - hands-off-to
    - conflicts-with
    - refines

typed_context:
  allowed_types:
    - binding
    - repository_reference
    - external_reference
    - context_include
    - route_handoff
  binding:
    required_fields: [type, name]
    forbidden_fields: [path, repository, context_id, route_id]
  repository_reference:
    required_fields: [type, path]
    repository_relative: true
    forbidden_fields: [name, repository, context_id, route_id]
  external_reference:
    required_fields: [type, repository, path]
    repository_format: owner/name
    forbidden_fields: [name, context_id, route_id]
  context_include:
    required_fields: [type, context_id]
    recursion: false
    max_expansion_hops: 1
    forbidden_fields: [name, repository, route_id]
  route_handoff:
    required_fields: [type, route_id]
    changes_primary_ownership: true
    forbidden_fields: [name, repository, context_id]

source_refs:
  allowed_roots:
    - .ai/
    - .agents/
    - SkillReferences/
    - Specs/
    - Tools/
  fragment_separator: "#"
  fragment_format: dot-separated-mapping-keys

fallback_context:
  project_profile:
    path: Specs/ProjectProfile.md
    required_type: repository_reference
    allowed_section: conditional.project_fallback
    prohibited_sections:
      - required
    precedence:
      - detected_project_fact
      - user_confirmed_project_fact
      - project_specific_context
      - project_profile
    load_only_when_required_fact_is_unresolved: true

project_fact_contract:
  source_kinds:
    - detected_project
    - user_confirmed
    - project_profile
  freshness_statuses:
    - current
    - stale
    - unknown
  required_fields:
    - key
    - value
    - source_kind
    - source_path
    - revision
    - observed_at_attempt
    - freshness
  freshness_required_fields:
    - status
    - checked_at_attempt
  current_requires_check_in_current_attempt: true
  retry_does_not_implicitly_copy_previous_facts: true
  stale_or_unknown_fact_must_not_override_fallback: true

invariants:
  metadata_is_not_execution_authority: true
  related_context_must_be_explicit: true
  scalar_required_or_conditional_entries_are_forbidden: true
  repository_and_external_references_are_distinct: true
  context_include_and_route_handoff_are_distinct: true
  context_include_does_not_change_primary_route: true
  route_handoff_changes_primary_ownership: true
  project_profile_is_fallback_only: true
  fallback_context_must_not_appear_in_required: true
  detected_project_facts_precede_project_profile: true
  current_project_fact_requires_current_attempt_freshness_check: true
