schema_version: "1.0"
kind: improvement_candidate
source_of_truth: false

required_fields:
  - candidate_id
  - trigger
  - source_run
  - evidence_refs
  - canonical_owner
  - target
  - failure_signature
  - boundary_pair
  - status

allowed_statuses: [proposed, reviewed, accepted, rejected]

invariants:
  evidence_refs_are_references_only: true
  canonical_files_are_not_written_automatically: true
  user_policy_must_be_preserved: true
  human_review_required_before_acceptance: true
