schema_version: "3.0"

# Context Manifest is one task-attempt runtime trace.
# Canonical Policy / Context / Harness YAML remains authoritative.
# Generated manifests belong under ignored Artifacts/ContextManifests by default.

runtime:
  builder: Tools/ContextManifest/build_context_manifest.py
  evidence_recorder: Tools/ContextManifest/record_manifest_evidence.py
  validator: Tools/ContextManifest/validate_context_manifest.py
  graph_projector: Tools/ContextManifest/project_execution_graph.py
  default_output_root: Artifacts/ContextManifests
  generated_manifest_is_not_canonical_policy: true
  generated_graph_is_derived_view: true

manifest:
  id: required
  graph_kind: execution
  attempt:
    required: true
    minimum: 1
  previous_manifest_id: optional
  previous_attempt: optional

retry_rules:
  attempt_one_has_no_previous_manifest: true
  retry_requires_previous_manifest_id: true
  retry_previous_attempt_equals_current_minus_one: true
  retry_must_keep_same_task_id: true
  previous_failure_is_summary_not_context_copy: true
  retry_decision_owner: DarumaPPAP/Unity-Graph-Engineering

task:
  id: required
  route: required
  fingerprint:
    intent: required
    artifact: required
    scope: required
    failure_mode: required
    architecture_state: required
    mutation_target: required
    evidence_state: required
    project_access: required

policy:
  loaded:
    - node_id: required_when_emitted
      source_path: required
      reason: required

project_facts:
  loaded:
    - node_id: required_when_emitted
      key: required
      value: required
      source_path: required
      reason: required

context:
  context_pack:
    node_id: required_when_emitted
    source_path: required
  primary_skill:
    node_id: required_when_emitted
    source_path: required
  bindings:
    - name: required
      kind: required
      values: []
      reason: required
  conditions_applied: []
  required_context:
    - node_id: required_when_emitted
      source_path: required
      reason: required
  conditional_context:
    - node_id: required_when_emitted
      source_path: required
      reason: required
  source_files:
    - node_id: required_when_emitted
      source_path: required
      binding: optional
      reason: required
  excluded_context:
    - node_id: required_when_emitted
      source_path: required
      reason: required

knowledge:
  loaded:
    - node_id: required_when_emitted
      source_path: required
      reason: required

harness:
  task_contract:
    node_id: required_when_emitted
    source_path: required
  mutation_rules:
    - node_id: required_when_emitted
      id: required
      effect:
        allowed:
          - allow
          - prohibit
  risk_level:
    node_id: required_when_emitted
    id: required
  quality_gates:
    - node_id: required_when_emitted
      id: required
      requirement:
        allowed:
          - required
          - conditional
      status:
        optional: true
        allowed:
          - passed
          - failed
          - unavailable

tools:
  activated:
    - node_id: required_when_emitted
      id: required
      reason: required

execution:
  evidence:
    - node_id: required_when_emitted
      id: required
      gate: required
      status:
        allowed:
          - passed
          - failed
          - unavailable
      source_path: optional
      reason: required
      remaining_validation: required_when_status_is_unavailable
  unresolved_bindings: []
  previous_failure:
    manifest_id: optional
    attempt: optional
    status: optional
    failure_reason: optional
    evidence_ids: []
  failure_reason: optional
  status:
    allowed:
      - in_progress
      - passed
      - failed
      - complete_with_unavailable

status_rules:
  required_gate_failed: failed
  all_required_gates_passed: passed
  all_required_gates_terminal_with_any_unavailable: complete_with_unavailable
  otherwise: in_progress
  unavailable_requires_reason: true
  unavailable_requires_remaining_validation: true
  unavailable_is_not_passed: true

graph_projection:
  contract: .ai/graph-contract.yaml
  graph_kind: execution
  manifest_is_graph_instance: true
  stable_node_ids_required_when_emitted: true
  typed_edges_required: true
  provenance_required: true
  source_of_truth_remains_canonical_yaml: true
