schema_version: "3.1"
extensions:
  context_budget: "1.0"

# Context Manifest is one task-attempt runtime trace.
# Canonical Policy / Context / Harness YAML remains authoritative.
# Generated manifests belong under ignored Artifacts/ContextManifests by default.

runtime:
  builder: Tools/ContextManifest/build_context_manifest.py
  evidence_recorder: Tools/ContextManifest/record_manifest_evidence.py
  validator: Tools/ContextManifest/validate_context_manifest.py
  graph_projector: Tools/ContextManifest/project_execution_graph.py
  budget_engine: Tools/ContextBudget/context_budget_runtime.py
  budget_validator: Tools/ContextBudget/validate_context_budget.py
  default_output_root: Artifacts/ContextManifests
  generated_manifest_is_not_canonical_policy: true
  generated_graph_is_derived_view: true

manifest:
  id: required
  graph_kind: execution
  attempt:
    required: true
    minimum: 1
  previous_manifest_id: optional
  previous_attempt: optional

retry_rules:
  attempt_one_has_no_previous_manifest: true
  retry_requires_previous_manifest_id: true
  retry_previous_attempt_equals_current_minus_one: true
  retry_must_keep_same_task_id: true
  previous_failure_is_summary_not_context_copy: true
  previous_project_facts_are_not_implicitly_copied: true
  current_project_fact_must_be_checked_in_current_attempt: true
  retry_decision_owner: DarumaPPAP/Unity-Graph-Engineering

task:
  id: required
  route: required
  fingerprint:
    intent: required
    artifact: required
    scope: required
    failure_mode: required
    architecture_state: required
    mutation_target: required
    evidence_state: required
    project_access: required

policy:
  loaded:
    - node_id: required_when_emitted
      source_path: required
      reason: required

project_facts:
  loaded:
    - node_id: required_when_emitted
      key: required
      value: required
      source_kind:
        allowed:
          - detected_project
          - user_confirmed
          - project_profile
      source_path: required
      revision: required
      observed_at_attempt: required
      freshness:
        status:
          allowed:
            - current
            - stale
            - unknown
        checked_at_attempt: required
      reason: required

context:
  context_pack:
    node_id: required_when_emitted
    source_path: required
  primary_skill:
    node_id: required_when_emitted
    source_path: required
  bindings:
    - name: required
      kind: required
      values: []
      reason: required
  conditions_applied: []
  required_context:
    - node_id: required_when_emitted
      reference_type: repository_reference
      source_path: required
      reason: required
  conditional_context:
    - node_id: required_when_emitted
      reference_type: repository_reference
      source_path: required
      condition: required
      reason: required
  external_references:
    - node_id: required_when_emitted
      repository: required
      path: required
      requirement:
        allowed: [required, conditional]
      condition: optional
      reason: required
  context_includes:
    - node_id: required_when_emitted
      context_id: required
      source_path: required
      requirement:
        allowed: [required, conditional]
      condition: optional
      reason: required
  route_handoffs:
    - node_id: required_when_emitted
      route_id: required
      requirement:
        allowed: [required, conditional]
      condition: optional
      reason: required
  source_files:
    - node_id: required_when_emitted
      source_path: required
      binding: optional
      reason: required
  excluded_context:
    - node_id: required_when_emitted
      source_path: required
      reason: required

knowledge:
  loaded:
    - node_id: required_when_emitted
      source_path: required
      reason: required

harness:
  task_contract:
    node_id: required_when_emitted
    source_path: required
  mutation_rules:
    - node_id: required_when_emitted
      id: required
      effect:
        allowed:
          - allow
          - prohibit
  risk_level:
    node_id: required_when_emitted
    id: required
  quality_gates:
    - node_id: required_when_emitted
      id: required
      requirement:
        allowed:
          - required
          - conditional
      status:
        optional: true
        allowed:
          - passed
          - failed
          - unavailable

tools:
  activated:
    - node_id: required_when_emitted
      id: required
      reason: required

budget:
  contract: .ai/context-budget.yaml
  profile: required_on_canonical_builder
  estimator:
    id: required_on_canonical_builder
    exact_model_tokenizer: false
    utf8_bytes_per_estimated_token: required_on_canonical_builder
  coverage:
    expected_artifacts: required_on_canonical_builder
    measured_artifacts: required_on_canonical_builder
    missing_observations: []
  retrieval:
    artifacts: required_on_canonical_builder
    original_utf8_bytes: required_on_canonical_builder
    selected_utf8_bytes: required_on_canonical_builder
    external_fetches: required_on_canonical_builder
    context_includes: required_on_canonical_builder
    expansion_hops: required_on_canonical_builder
    limits: required_on_canonical_builder
  context:
    estimated_tokens: required_on_canonical_builder
    soft_estimated_tokens: required_on_canonical_builder
    hard_estimated_tokens: required_on_canonical_builder
  compression:
    applied: required_on_canonical_builder
    compressed_artifacts: required_on_canonical_builder
    saved_utf8_bytes: required_on_canonical_builder
    modes: []
    candidates: []
  artifacts:
    - source_id: required
      role: required
      source_revision: required
      original_utf8_bytes: required
      selected_utf8_bytes: required
      estimated_tokens: required
      compression: required
  decision:
    allowed:
      - within_budget
      - compression_required
      - blocked
      - unmeasured
  blocking_reasons: []

budget_rules:
  canonical_builder_must_attach_budget_report: true
  estimated_tokens_are_not_exact_provider_tokens: true
  local_repository_sources_may_be_auto_measured: true
  project_and_external_sources_require_observation: true
  mutation_requires_within_budget: true
  compression_required_must_be_resolved_before_mutation: true
  blocked_must_stop_before_mutation: true
  unmeasured_must_stop_before_mutation: true
  compression_must_not_rewrite_canonical_source: true
  required_artifact_must_not_be_silently_dropped: true

execution:
  evidence:
    - node_id: required_when_emitted
      id: required
      gate: required
      status:
        allowed:
          - passed
          - failed
          - unavailable
      source_path: optional
      reason: required
      remaining_validation: required_when_status_is_unavailable
  unresolved_bindings: []
  previous_failure:
    manifest_id: optional
    attempt: optional
    status: optional
    failure_reason: optional
    evidence_ids: []
  failure_reason: optional
  status:
    allowed:
      - in_progress
      - passed
      - failed
      - complete_with_unavailable

project_fact_rules:
  current_requires_checked_at_attempt_equal_manifest_attempt: true
  checked_at_attempt_must_not_precede_observed_at_attempt: true
  observed_at_attempt_must_not_exceed_manifest_attempt: true
  stale_or_unknown_must_not_be_presented_as_current: true
  retry_requires_explicit_reobservation_or_revalidation: true

status_rules:
  required_gate_failed: failed
  all_required_gates_passed: passed
  all_required_gates_terminal_with_any_unavailable: complete_with_unavailable
  otherwise: in_progress
  unavailable_requires_reason: true
  unavailable_requires_remaining_validation: true
  unavailable_is_not_passed: true

graph_projection:
  contract: .ai/graph-contract.yaml
  graph_kind: execution
  manifest_is_graph_instance: true
  stable_node_ids_required_when_emitted: true
  typed_edges_required: true
  provenance_required: true
  source_of_truth_remains_canonical_yaml: true
