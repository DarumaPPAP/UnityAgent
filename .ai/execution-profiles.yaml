schema_version: "1.2"

planning_baseline:
  project_context_required: false
  capability_manifest_required: false
  minimum_manual_inputs:
    - unity_version
    - render_pipeline
    - goal
    - constraints
    - prohibited_changes
    - expected_result
  conditional_manual_inputs:
    target_platforms:
      required_when:
        - platform_sdk_or_api_is_used
        - platform_specific_build_is_requested
        - platform_specific_compatibility_is_claimed
        - platform_specific_performance_is_claimed
    performance_class:
      required_when:
        - performance_budget_is_part_of_goal
  platform_policy:
    runtime_default: platform_independent
    separate_performance_class_from_target_platform: true
    performance_reference_does_not_imply:
      - supported_platform
      - build_target
      - sdk_dependency
      - module_dependency
      - platform_define
      - completion_gate
  unresolved_project_bindings:
    policy: record_and_continue
    never_guess:
      - asset_path
      - scene_name
      - renderer_data_name
      - layer
      - shader_tag
      - package_version

profiles:
  generic_planning:
    purpose: Projectへアクセスせず設計、Portable実装、導入契約を生成する
    project_access: none
    project_context: optional
    allowed_outputs:
      - architecture
      - implementation_plan
      - portable_source
      - setup_wizard
      - integration_contract
      - validation_instructions
      - unresolved_project_bindings
    prohibited:
      - claim_project_validation
      - assume_project_paths
      - assume_project_asset_names
      - mutate_project_settings

  personal_full_control:
    purpose: 個人Projectで直接実装、Unity検証、Git操作を行う
    project_access: full_when_authorized
    project_context: optional_accelerator
    optional_tools:
      - project_context_generator
      - unity_command_surface
      - screenshot
      - profiler
      - git_integration
    fallback_when_tools_unavailable: continue_from_manual_inputs_and_source
    secrets_never_collect:
      - credentials
      - private_keys
      - passwords
      - environment_variable_values
      - certificate_contents
      - keystore_secrets

  team_safe_import:
    purpose: Project外で生成したPortable成果物を一方向にImportする
    project_access: no_external_export
    project_context: prohibited
    package_dependency_on_personal_tools: prohibited
    allowed_local_operations:
      - package_security_scan
      - dependency_validation
      - staging_import
      - package_compile
      - package_tests
      - rollback
    absent_capabilities:
      - project_scanner
      - source_export
      - screenshot_capture
      - hierarchy_export
      - unity_project_id_access
      - git_access
      - issue_access
      - cloud_settings_access
      - environment_variable_access
      - organization_metadata_access
      - customer_metadata_access

environment_fallback:
  policy: record_once_and_continue
  retry_same_capability_check: prohibited
  missing_module_device_license_or_tool:
    does_not_block:
      - platform_independent_design
      - implementation
      - static_review
      - unity_compile
      - editmode_tests
      - playmode_tests
      - available_player_validation
      - burst_compatibility_review
      - aot_and_stripping_static_review
      - available_profiler_measurement
    fallback_order:
      - static_review
      - unity_compile
      - editmode_tests
      - playmode_tests
      - available_player
      - burst_compatibility_review
      - aot_and_stripping_static_review
      - available_fixed_environment_performance_measurement
    unavailable_evidence:
      status: unavailable
      reason_code: deferred-environment
      scope: unavailable_claim_only
      continue_independent_tasks: true
  block_only_when:
    - implementation_requires_unavailable_platform_specific_dependency
    - no_platform_independent_fallback_exists
    - user_explicitly_requires_named_platform_artifact_as_current_deliverable

quality_gate_result:
  allowed_statuses:
    - passed
    - failed
    - unavailable
  unavailable_policy:
    continue_planning: true
    continue_implementation: true
    claim_success: false
    append_to_remaining_validation: true
    record_capability_once_per_goal: true
    reason_code_required: true
