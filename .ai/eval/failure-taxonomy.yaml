schema_version: "1.0"
failures:
  routing_miss:
    meaning: selected_route_or_fingerprint_does_not_match_golden_expectation
  context_miss:
    meaning: required_context_or_required_knowledge_was_not_loaded_or_explicitly_unresolved
  policy_violation:
    meaning: user_policy_invariant_was_violated
  harness_violation:
    meaning: required_gate_or_task_contract_constraint_was_violated
  mutation_violation:
    meaning: mutation_exceeded_allowed_scope_or_hit_a_prohibited_change
  evidence_overclaim:
    meaning: reported_claim_exceeded_available_evidence_scope
  model_failure:
    meaning: model_failed_despite_correct_route_context_policy_and_harness
  broken_eval:
    meaning: golden_task_or_grader_is_ambiguous_contradictory_or_not_executable
  unavailable_evidence:
    meaning: required_evidence_could_not_be_obtained_and_must_not_be_treated_as_passed
