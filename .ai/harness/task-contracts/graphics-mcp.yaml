id: graphics-mcp
default_execution_profile: generic_planning
risk_level: R3
mutation_channel_binding: request

required_inputs:
  - graphics_mcp_goal
  - requested_operation_scope
  - detected_project_context_when_accessible
  - explicit_requested_targets_when_applicable
  - project_profile_fallback_when_project_is_unavailable
  - visual_goal_or_reference_when_applicable
  - constraints
  - prohibited_changes

allowed_mutations:
  - unity_agent_route_context_task_and_knowledge_contracts
  - MyUnityMCP specifications
  - MyUnityMCP catalogs manifests workflows and tool schemas
  - MyUnityMCP package source after implementation approval
  - isolated editor tests
  - compatibility_verification_matrix
  - documentation

prohibited_mutations:
  - mcp_package_implementation_inside_UnityAgent
  - mcp_specification_inside_UnityAgent
  - mcp_implementation_or_specification_inside_UnityAIGC_Archive
  - generated_project_specific_scene_prefab_material_or_timeline_inside_MyUnityMCP
  - loading_unselected_mcp_manifests
  - loading_mcp_package_source_during_normal_tool_use
  - fixed_unity_version_pipeline_rendering_path_or_platform_as_global_mcp_contract
  - treating_project_profile_as_detected_project_fact
  - treating_unverified_as_unsupported
  - placeholder_namespace_output
  - unapproved_project_settings_change
  - unapproved_render_pipeline_asset_change
  - unapproved_renderer_data_change
  - automatic_scene_prefab_or_material_mutation
  - automatic_lighting_bake
  - automatic_save
  - silent_pipeline_fallback
  - visual_acceptance_without_human_review

required_knowledge:
  - graphics.unity_graphics_mcp

required_quality_gates:
  - static_review
  - specification_traceability
  - architecture_policy_review
  - namespace_and_type_naming_review
  - mcp_catalog_and_manifest_consistency
  - environment_resolution_contract_review

conditional_quality_gates:
  - package_structure_validation
  - unity_compile
  - editmode
  - playmode
  - render_graph_validation
  - editor_capture
  - player_capture
  - target_device_capture
  - before_after_gpu_measurement

completion:
  - UnityAgent_contains_only_preferences_routes_context_task_knowledge_and_activation_contracts
  - MCP_specification_and_implementation_are_stored_in_MyUnityMCP
  - generated_Unity_assets_are_owned_by_the_target_Unity_project
  - exactly_one_primary_creator_or_domain_mcp_is_selected
  - conditional_domain_mcp_count_does_not_exceed_two
  - unselected_manifests_and_package_sources_are_not_loaded
  - tool_groups_are_released_in_inspect_plan_mutate_bake_capture_order
  - target_project_is_inspected_before_backend_selection_when_accessible
  - detected_project_facts_requested_targets_profiles_and_preferences_are_separated
  - no_fixed_Unity_version_pipeline_rendering_path_or_platform_is_used_as_global_MCP_default
  - unverified_and_unsupported_are_distinct
  - backend_not_implemented_and_project_configuration_required_are_explicit
  - compatibility_matrix_records_evidence_not_global_support
  - root_namespace_resolution_is_explicit
  - enum_and_struct_naming_follow_UnityAgent_rules
  - ownership_lifetime_change_axes_and_split_reasons_are_recorded
  - mutation_approval_and_undo_requirements_are_explicit
  - unavailable_Unity_gates_are_reported_not_claimed_as_passed

stop_conditions:
  - active_pipeline_is_unknown_and_native_api_choice_depends_on_it
  - requested_mutation_requires_unapproved_project_settings_or_asset_changes
  - root_namespace_cannot_be_resolved_for_product_code_generation
  - selected_creator_or_domain_mcp_manifest_cannot_be_resolved
  - selected_backend_is_not_implemented_for_required_operation
  - visual_acceptance_is_requested_without_reference_or_human_review_path

result_format:
  summary: graphics_mcp_contract_and_MyUnityMCP_changes
  changed_artifacts: UnityAgent_contract_paths_and_MyUnityMCP_paths
  validation: static_contract_catalog_manifest_environment_resolution_and_available_Unity_gate_statuses
  unresolved: project_bindings_pipeline_capabilities_requested_target_mismatches_import_time_checks_and_unimplemented_tool_groups
