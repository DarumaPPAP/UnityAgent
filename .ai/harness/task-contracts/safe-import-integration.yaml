id: safe-import-integration
default_execution_profile: team_safe_import
risk_level: R3

required_inputs:
  - portable_package
  - supported_unity_version
  - supported_render_pipeline
  - local_security_policy

allowed_mutations:
  - staging_import
  - package_local_compile
  - package_local_tests
  - local_integration_checklist
  - rollback

prohibited_mutations:
  - project_export
  - external_telemetry
  - screenshot_capture
  - hierarchy_export
  - git_access
  - issue_access
  - cloud_settings_access
  - unity_project_id_access
  - organization_metadata_access
  - customer_metadata_access
  - environment_variable_access

required_knowledge: []
required_quality_gates:
  - package_security_scan
  - dependency_validation
  - staging_integrity
conditional_quality_gates:
  - compile
  - editmode
  - playmode

completion:
  - prohibited_capabilities_are_absent_from_package_and_tool
  - package_is_imported_only_to_staging
  - local_validation_result_contains_no_project_metadata
  - manual_binding_and_rollback_steps_are_provided

stop_conditions:
  - package_attempts_external_communication
  - package_reads_credentials_or_project_metadata
  - dependency_or_license_is_unapproved
  - staging_isolation_cannot_be_guaranteed

result_format:
  summary: package_id_version_and_local_verdict
  changed_artifacts: staging_package_only
  validation: security_dependency_compile_and_test_codes
  unresolved: manual_bindings_without_project_details
