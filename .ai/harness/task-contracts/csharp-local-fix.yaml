id: csharp-local-fix
default_execution_profile: personal_full_control
risk_level: R1
mutation_channels:
  - csharp

required_inputs:
  - goal_or_confirmed_error
  - target_source

required_policy_clauses:
  - id: single_purpose_change
    source_path: .ai/user-policy.yaml#core_user_policies.single_purpose_change
    reason: A bounded C# fix must keep one change reason and must not expand into unrelated cleanup or convenience work.
  - id: preserve_existing_structure
    source_path: .ai/user-policy.yaml#core_user_policies.preserve_existing_structure
    reason: A local C# fix must preserve existing names, file structure, and public or serialized contracts unless the request explicitly authorizes a broader change.

conditional_inputs:
  unity_version:
    required_when:
      - fix_depends_on_unity_api_version
      - compile_error_is_caused_by_version_specific_unity_api
    inputs:
      - unity_version
  direct_dependencies:
    required_when:
      - fix_requires_signature_or_contract_change
      - root_cause_crosses_target_source_boundary
    inputs:
      - direct_callers_or_interfaces
  semantic_type_naming:
    required_when:
      - new_type_is_required_by_confirmed_fix
      - explicit_type_rename_is_requested
    inputs:
      - type_responsibility
      - namespace_context
      - compatibility_constraints

allowed_mutations:
  - target_csharp_file
  - directly_required_dependency_when_proven

prohibited_mutations:
  - unrelated_refactor
  - new_controller_or_manager
  - public_or_serialized_contract_change_without_request
  - naming_only_existing_api_rename
  - scene_prefab_or_project_settings_change

required_knowledge: []
required_quality_gates:
  - static_review
  - compile
conditional_quality_gates:
  - namespace_and_type_naming_review
  - editmode
  - playmode

completion:
  - requested_behavior_or_confirmed_error_is_addressed
  - changed_scope_is_bounded
  - single_purpose_change_policy_is_applied_and_recorded
  - preserve_existing_structure_policy_is_applied_and_recorded
  - semantic_type_naming_is_reviewed_only_when_new_or_renamed_type_exists
  - existing_api_names_are_preserved_unless_rename_is_requested
  - compile_is_passed_or_reported_unavailable

stop_conditions:
  - root_cause_is_not_local
  - required_public_contract_change_is_unapproved

result_format:
  summary: one_paragraph
  changed_artifacts: paths_and_reasons
  validation: gate_statuses
  unresolved: remaining_risks_and_unavailable_gates
