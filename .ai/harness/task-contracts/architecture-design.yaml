id: architecture-design
default_execution_profile: generic_planning
risk_level: R1
mutation_channel_binding: request

required_inputs:
  - goal
  - scope_classification
  - prohibited_changes

conditional_inputs:
  local_behavior:
    required_when:
      - scope_classification_is_local_behavior
    inputs:
      - attachment_target
      - lifecycle_or_callback
      - state_or_resource
      - side_effect_or_restore
  feature_or_larger:
    required_when:
      - scope_classification_is_not_local_behavior
    inputs:
      - current_or_expected_scale
      - ownership_and_lifetime
      - change_axes
  target_platform:
    required_when:
      - platform_specific_api_is_used
      - platform_specific_build_is_requested
      - platform_specific_compatibility_is_claimed
      - platform_specific_performance_is_claimed
  performance_constraints:
    required_when:
      - performance_budget_is_part_of_goal
      - ecs_jobs_burst_adoption_is_being_evaluated
  semantic_type_naming:
    required_when:
      - new_type_is_planned
      - type_rename_is_proposed
    inputs:
      - type_responsibility
      - namespace_context
      - compatibility_constraints

allowed_mutations:
  - architecture_specification
  - file_plan
  - dependency_plan
  - migration_plan
  - explicitly_requested_source_files

prohibited_mutations:
  - architecture_pattern_application_without_problem_fit
  - system_level_analysis_for_resolved_local_behavior
  - speculative_target_generalization
  - speculative_watcher_or_trigger
  - speculative_state_cache
  - speculative_controller_or_manager
  - speculative_interface
  - speculative_scriptable_object
  - speculative_dependency_injection_container
  - property_level_type_proliferation_without_responsibility_boundary
  - abstraction_from_syntax_similarity_only
  - solid_as_mechanical_layering_rule
  - naming_driving_architecture_before_responsibility_is_resolved
  - invented_abbreviation_for_length_reduction
  - role_suffix_stacking_without_distinct_responsibility
  - naming_only_existing_public_or_serialized_type_rename
  - polling_when_unity_lifecycle_or_existing_callback_is_sufficient
  - unrelated_refactor
  - project_setting_change_without_approval
  - public_or_serialized_contract_change_without_analysis
  - naming_convention_change_without_user_approval
  - generic_best_practice_overriding_user_policy

required_knowledge: []

# Architecture-only planning can complete from architecture evidence alone.
# Serialization/compile/runtime gates become blocking only when the selected plan actually
# crosses those boundaries. This prevents optional unavailable evidence from failing design-only tasks.
required_quality_gates:
  - architecture_fit
  - file_granularity

conditional_quality_gates:
  - serialization_validation
  - namespace_and_type_naming_review
  - ownership_and_lifetime
  - ecs_data_layout
  - static_review
  - compile
  - editmode
  - playmode
  - performance_capture
  - player
  - target_device

completion:
  - scope_specific_design_depth_is_used
  - local_behavior_uses_fast_path_when_sufficient
  - unity_lifecycle_is_checked_before_polling
  - requirement_surface_is_preserved
  - simplest_cohesive_solution_was_considered_first
  - speculative_structure_was_removed
  - unnecessary_state_and_generalization_are_removed
  - abstractions_are_backed_by_confirmed_need
  - proven_knowledge_duplication_is_required_for_dry_abstraction
  - solid_was_not_used_as_a_mechanical_layering_rule
  - selected_architecture_is_explained
  - every_planned_file_has_a_split_reason
  - unnecessary_abstractions_are_removed
  - naming_is_deferred_until_type_responsibility_is_resolved
  - planned_new_or_renamed_types_follow_semantic_naming_contract_when_applicable
  - existing_public_and_serialized_names_are_preserved_unless_rename_is_requested
  - user_policy_is_preserved
  - naming_convention_is_preserved
  - reevaluation_conditions_are_defined_when_needed

stop_conditions:
  - required_existing_contract_is_unknown
  - architecture_change_requires_unapproved_serialization_break
  - project_wide_refactor_scope_is_not_authorized
  - proposed_design_conflicts_with_user_policy_without_explicit_user_approval

result_format:
  summary: architecture_decision
  changed_artifacts: paths_responsibilities_and_split_reasons
  validation: gate_statuses
  unresolved: bindings_risks_and_reevaluation_conditions
