schema_version: "1.1"

purpose: define_machine_readable_graph_projection_for_unityagent

source_of_truth:
  canonical_yaml_remains_authoritative: true
  graph_is_derived_view: true
  graph_editor_mutation_enabled: false
  generated_graph_must_not_override_policy_or_harness: true

graph_kinds:
  definition:
    description: Canonical UnityAgent relationships between Policy, Context, Harness, Skill and Tool definitions.
  execution:
    description: One task execution projected from Context Manifest, selected Context, Harness constraints and Evidence.

node_contract:
  stable_node_ids_required: true
  node_type_required: true
  source_provenance_required: true
  id_format: "<type>:<stable-id>"

node_types:
  - task
  - task_fingerprint
  - route
  - policy
  - project_fact
  - context_pack
  - knowledge
  - source
  - task_contract
  - mutation_rule
  - risk_level
  - quality_gate
  - skill
  - tool
  - evidence
  - attempt
  - golden_task

edge_contract:
  typed_edges_required: true
  source_node_required: true
  target_node_required: true

edge_types:
  - classifies_as
  - selects
  - requires
  - conditionally_requires
  - excludes
  - applies_policy
  - uses_skill
  - uses_knowledge
  - reads_source
  - allows_mutation
  - prohibits_mutation
  - requires_gate
  - uses_tool
  - produces_evidence
  - validates
  - depends_on
  - escalates_to
  - retries_as
  - evaluated_by

provenance:
  required_fields:
    - source_path
    - reason
  reasons:
    - canonical_binding
    - mutation_target
    - direct_dependency
    - required_context
    - conditional_context
    - excluded_context
    - user_policy
    - project_fact
    - harness_contract
    - quality_gate
    - runtime_evidence
    - regression_expectation

projection_rules:
  definition_graph:
    root_sources:
      - .ai/context-index.yaml
      - .ai/context-packs/
      - .ai/harness/
      - .ai/user-policy.yaml
      - .agents/skills/
    runtime_data_forbidden: true

  execution_graph:
    root_source: .ai/context-manifest.schema.yaml
    runtime_builder: Tools/ContextManifest/build_context_manifest.py
    runtime_projector: Tools/ContextManifest/project_execution_graph.py
    manifest_is_graph_instance: true
    include_only_selected_context: true
    include_attempt_and_evidence_when_available: true
    include_project_facts_when_recorded: true
    generated_artifact_default_root: Artifacts/ContextManifests
    generated_artifact_is_not_source_of_truth: true

visualization_contract:
  required_views:
    - architecture
    - task
    - execution
  architecture_view_focus:
    - policy
    - context
    - harness
    - skill
    - tool
  task_view_focus:
    - task_fingerprint
    - route
    - context_pack
    - task_contract
    - quality_gate
  execution_view_focus:
    - attempt
    - source
    - project_fact
    - mutation_rule
    - quality_gate
    - evidence

anti_regression:
  stable_ids_must_not_be_reassigned: true
  edge_semantics_must_not_be_encoded_only_in_labels: true
  source_provenance_must_not_be_dropped: true
  runtime_graph_must_not_become_canonical_policy: true
