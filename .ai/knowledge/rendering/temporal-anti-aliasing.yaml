id: rendering.temporal_anti_aliasing
version: "1.0.0"
status: reviewed

use_when:
  - temporal_aliasing
  - subpixel_flicker
  - motion_ghosting
  - post_taa_softness
  - thin_geometry_instability

required_inputs:
  - unity_version
  - render_pipeline_version
  - render_graph_usage
  - target_platforms
  - camera_configuration
  - motion_vector_source
  - transparent_render_order
  - ui_composition_stage

implementation_contract:
  - history_is_scoped_per_camera
  - jitter_matches_projection_and_reconstruction
  - disocclusion_rejection_is_defined
  - invalid_or_missing_motion_vector_regions_are_identified
  - history_reset_conditions_are_defined
  - resolve_input_and_output_color_spaces_are_explicit
  - sharpening_stage_and_ownership_are_explicit
  - transparent_outline_and_ui_behavior_are_not_assumed

prohibited:
  - share_history_across_unrelated_cameras
  - treat_sharpening_as_a_temporal_stability_fix
  - claim_transparent_motion_vector_support_without_evidence
  - claim_outline_stability_without_outline_motion_evidence
  - claim_player_or_target_device_quality_from_editor_capture
  - change_urp_package_internals_without_explicit_mode_and_revert_contract

required_evidence:
  - static_contract_review
  - unity_compile
  - render_graph_validation
  - static_camera_capture
  - moving_camera_capture
  - moving_object_capture

conditional_evidence:
  transparent_present:
    - transparent_motion_case
  outline_present:
    - outline_motion_case
  ui_before_taa_possible:
    - ui_composition_case
  performance_claim:
    - before_after_gpu_measurement
  target_device_claim:
    - target_device_capture

failure_signatures:
  - ghosting_on_disocclusion
  - thin_line_flicker
  - post_resolve_blur
  - highlight_trailing
  - outline_lag
  - transparent_history_trail
  - contrast_loss
  - sharpening_ringing

related:
  required:
    - rendering.motion_vectors
  conditional:
    - rendering.transparent_rendering
    - rendering.outline_rendering
    - rendering.ui_composition
    - rendering.shader_variants

stop_conditions:
  - unity_or_urp_version_is_unknown_and_api_choice_depends_on_it
  - camera_history_ownership_cannot_be_determined
  - requested_quality_claim_requires_unavailable_visual_evidence

human_reference:
  repository: DarumaPPAP/Unity-Knowledge-Products
  knowledge_id: rendering.temporal_anti_aliasing
  entry: Rendering/TemporalAntiAliasing/index.html
