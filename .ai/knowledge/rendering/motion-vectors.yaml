id: rendering.motion_vectors
version: "0.1.0"
status: draft

use_when:
  - temporal_reprojection
  - motion_blur
  - object_motion_instability
  - outline_motion

required_inputs:
  - unity_version
  - render_pipeline_version
  - camera_motion_source
  - object_motion_source
  - previous_transform_contract

implementation_contract:
  - camera_and_object_motion_are_distinguished
  - previous_frame_state_lifetime_is_explicit
  - skinned_mesh_and_deformation_support_is_declared
  - missing_motion_regions_are_not_silently_treated_as_valid

prohibited:
  - assume_all_transparents_write_motion_vectors
  - reuse_current_transform_as_previous_without_declaring_zero_motion
  - claim_temporal_stability_from_motion_texture_presence_alone

required_evidence:
  - static_contract_review
  - unity_compile
  - camera_motion_case
  - object_motion_case

related:
  required: []
  conditional:
    - rendering.temporal_anti_aliasing
    - rendering.outline_rendering
    - rendering.transparent_rendering

human_reference:
  repository: DarumaPPAP/Unity-Knowledge-Products
  knowledge_id: rendering.motion_vectors
  entry: Rendering/MotionVectors/index.html
