schema_version: "2.2"
repository_role: unity_domain_knowledge
execution_owner: DarumaPPAP/Unity-Graph-Engineering
user_policy: .ai/user-policy.yaml
execution_profiles: .ai/execution-profiles.yaml
task_contract_schema: .ai/harness/task-contracts/task-contract.schema.yaml
knowledge_index: .ai/knowledge/index.yaml
quality_gates: .ai/harness/quality-gates.yaml
mutation_channels: .ai/harness/mutation-channels.yaml
risk_levels: .ai/harness/risk-levels.yaml
mcp_activation_policy: .ai/harness/mcp-activation.yaml
mcp_repository: DarumaPPAP/MyUnityMCP

routing_rules:
  user_policy_must_be_loaded_before_domain_decision: true
  generic_best_practice_must_not_override_user_policy: true
  select_exactly_one_primary_route: true
  select_exactly_one_primary_task_contract: true
  select_at_most_one_primary_knowledge: true
  select_exactly_one_primary_creator_or_domain_mcp_when_mcp_is_required: true
  conditional_domain_mcp_limit: 2
  load_all_skills: false
  load_all_references: false
  load_all_mcp_manifests: false
  load_all_mcp_tool_schemas: false
  load_mcp_package_source_by_default: false
  project_context_required_for_planning: false
  capability_manifest_required_for_planning: false
  direct_source_read_required_before_mutation: true
  knowledge_graph_is_navigation_only: true
  human_html_is_conditional_reference: true
  route_id_format: kebab-case
  mapping_key_is_not_route_id: true

profile_selection:
  project_not_accessible:
    profile: generic_planning
  personal_project_full_access_authorized:
    profile: personal_full_control
  company_project_external_authoring_or_import:
    profile: team_safe_import

conditional_operations:
  production_comment_addition:
    skill: production-code-comments
    policy: .ai/user-policy.yaml#comment_system
  learning_comment_addition:
    skill: learning-code-comments
    policy: .ai/user-policy.yaml#comment_system
  existing_comment_review:
    skill: comment-quality-reviewer
    policy: .ai/user-policy.yaml#comment_system

routes:
  architecture_design:
    id: architecture-design
    triggers:
      - new Unity feature architecture
      - new gameplay system design
      - class or file responsibility design
      - MonoBehaviour and plain C# separation
      - ScriptableObject adoption decision
      - MVP MVVM MVC selection
      - ECS Jobs Burst adoption decision
      - Controller Manager Service necessity
      - architecture refactoring
      - excessive C# file split review
    primary_skill: unity-architecture-design
    context_pack: .ai/context-packs/architecture-design.yaml
    task_contract: .ai/harness/task-contracts/architecture-design.yaml
    knowledge_selection: optional

  graphics_mcp:
    id: graphics-mcp
    triggers:
      - UnityAgentMCP
      - MyUnityMCP
      - UnityGraphicsMCP
      - Unity graphics MCP
      - Unity Visual Director MCP
      - Creator Workflow
      - LiveCreator
      - MovieCreator
      - reference image to Unity graphics direction
      - Timeline Cinemachine Volume lighting GI reflection VFX tool integration
      - Built-in URP HDRP graphics capability routing
      - graphics inspect plan apply bake capture refine workflow
    primary_skill: unity-architecture-design
    context_pack: .ai/context-packs/graphics-mcp.yaml
    task_contract: .ai/harness/task-contracts/graphics-mcp.yaml
    knowledge_selection: required_when_domain_matches
    mcp_selection: required

  csharp_local_fix:
    id: csharp-local-fix
    triggers:
      - bounded C# change
      - known compile error
      - single behavior correction
    primary_skill: csharp-safe-patch
    context_pack: .ai/context-packs/csharp-local-fix.yaml
    task_contract: .ai/harness/task-contracts/csharp-local-fix.yaml

  rendering_incident:
    id: rendering-incident
    triggers:
      - unknown rendering failure
      - Editor Player difference
      - RenderGraph validation error
      - rendering regression
    primary_skill: unity-incident-investigation
    context_pack: .ai/context-packs/rendering-incident.yaml
    task_contract: .ai/harness/task-contracts/rendering-incident.yaml

  shader_change:
    id: shader-change
    triggers:
      - ShaderLab
      - HLSL
      - Compute Shader
      - motion vector or temporal shader work
    primary_skill: unity-rendering
    context_pack: .ai/context-packs/shader-change.yaml
    task_contract: .ai/harness/task-contracts/shader-change.yaml
    knowledge_selection: required_when_domain_matches

  renderer_feature_change:
    id: renderer-feature-change
    triggers:
      - RendererFeature
      - ScriptableRenderPass
      - RenderGraph pass
      - injection point change
      - renderer resource integration
    primary_skill: unity-rendering
    context_pack: .ai/context-packs/renderer-feature-change.yaml
    task_contract: .ai/harness/task-contracts/renderer-feature-change.yaml
    knowledge_selection: required_when_domain_matches

  performance_experiment:
    id: performance-experiment
    triggers:
      - CPU optimization
      - GPU optimization
      - memory optimization
      - shader performance
      - build size
      - Before After measurement
    primary_skill: unity-runtime-evidence
    context_pack: .ai/context-packs/performance.yaml
    task_contract: .ai/harness/task-contracts/performance-experiment.yaml

  asset_data_change:
    id: asset-data-change
    triggers:
      - Scene asset change
      - Prefab change
      - Material change
      - ScriptableObject asset change
      - serialized asset change
    primary_skill: csharp-safe-patch
    context_pack: .ai/context-packs/asset-data-change.yaml
    task_contract: .ai/harness/task-contracts/asset-data-change.yaml

  portable_feature:
    id: portable-feature
    triggers:
      - project independent package
      - external authoring
      - portable UPM package
      - company project without source access
    primary_skill: unity-architecture-design
    context_pack: .ai/context-packs/portable-feature.yaml
    task_contract: .ai/harness/task-contracts/portable-feature.yaml
    forced_profile: generic_planning

  safe_import_integration:
    id: safe-import-integration
    triggers:
      - team safe import
      - staging package import
      - local package security validation
    primary_skill: csharp-safe-patch
    context_pack: .ai/context-packs/asset-data-change.yaml
    task_contract: .ai/harness/task-contracts/safe-import-integration.yaml
    forced_profile: team_safe_import

  visual_direction:
    id: visual-direction
    triggers:
      - scene beauty
      - lighting look development
      - composition
      - color atmosphere
      - visual quality review
    primary_skill: unity-visual-direction
    context_pack: .ai/context-packs/visual-direction.yaml
    task_contract: .ai/harness/task-contracts/visual-direction.yaml
    knowledge_selection: optional

conflicts:
  architecture_design_and_csharp_local_fix:
    primary_when_structure_is_undecided: architecture-design
    primary_when_change_is_bounded: csharp-local-fix

  architecture_design_and_performance_experiment:
    primary_when_runtime_baseline_is_goal: performance-experiment
    primary_when_execution_model_is_undecided: architecture-design

  architecture_design_and_renderer_feature_change:
    primary_when_pass_structure_is_undecided: architecture-design
    primary_when_rendering_contract_is_confirmed: renderer-feature-change

  graphics_mcp_and_architecture_design:
    primary_when_goal_is_UnityAgentMCP_MyUnityMCP_GraphicsMCP_Creator_or_Module_architecture: graphics-mcp
    primary_when_goal_is_unrelated_Unity_architecture: architecture-design

  graphics_mcp_and_visual_direction:
    primary_when_goal_is_tool_contract_capability_mutation_or_creator_workflow: graphics-mcp
    primary_when_goal_is_scene_beauty_or_human_visual_review: visual-direction

  graphics_mcp_and_renderer_feature_change:
    primary_when_goal_is_MCP_orchestrated_graphics_system: graphics-mcp
    primary_when_goal_is_bounded_RendererFeature_implementation: renderer-feature-change

  rendering_incident_and_architecture_design:
    primary: rendering-incident
    secondary_after_evidence: architecture-design

  rendering_incident_and_shader_change:
    primary: rendering-incident
    secondary_after_evidence: shader-change

  rendering_incident_and_renderer_feature_change:
    primary: rendering-incident
    secondary_after_evidence: renderer-feature-change

  visual_direction_and_rendering:
    primary_when_goal_is_beauty: visual-direction
    primary_when_goal_is_technical_fix: rendering-incident

  portable_feature_and_direct_project_change:
    primary_when_project_is_not_accessible: portable-feature
    primary_when_personal_access_is_authorized: renderer-feature-change

fallback:
  action: report_unmatched_route_and_continue_with_bounded_generic_planning
  allow_simple_read_only_explanation_without_domain_route: true
  do_not_use_legacy_routing_document: true
  do_not_load_every_route: true
  do_not_load_every_mcp_manifest: true
  continue_with_generic_planning_when_project_context_is_missing: true
  never_guess_project_binding: true
