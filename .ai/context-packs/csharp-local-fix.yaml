schema_version: "1.1"
id: csharp-local-fix
primary_skill: .agents/skills/csharp-safe-patch/SKILL.md

use_when:
  - bounded C# correction
  - known compile failure
  - one behavior change with deterministic validation

required:
  - target_source
  - direct_callers_or_interfaces
  - Specs/ProjectProfile.md
  - SkillReferences/CODING_STANDARDS.md
  - SkillReferences/CODE_FORMATTING_STANDARDS.md

conditional:
  architecture_change:
    - SkillReferences/ARCHITECTURE_STANDARDS.md
    - SkillReferences/ARCHITECTURE_DECISION_POLICY.md
  antipattern_finding:
    - SkillReferences/CSHARP_ANTIPATTERN_RULES.md
    - SkillReferences/CSHARP_ANTIPATTERN_POLICY.md
  burst_jobs_entities:
    - matching Burst Jobs Entities reference

excluded_by_default:
  - SkillReferences/UNITY_AGENT_SUPERVISOR_MODEL.md
  - SkillReferences/RENDERING_STANDARDS.md
  - SkillReferences/SHADER_PERFORMANCE_STANDARDS.md
  - SkillReferences/BEAUTIFUL_DEFINITION_INTEGRATION.md

rules:
  preserve_current_naming_convention: true
  short_assignment_stays_on_one_line: true
  no_mechanical_line_break_after_assignment_operator: true
  no_unrelated_formatting_churn: true
  no_premature_generalization: true

limits:
  initial_file_reads: 5
  context_expansion_hops: 1

output:
  - confirmed_namespace
  - compatibility_constraints
  - bounded_patch_requirements
  - deterministic_validation
  - unverified_conditions
