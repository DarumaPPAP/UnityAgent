version: 3
cases:
  - id: CONTEXT-USER-POLICY-001
    prompt: "一般的な推奨設計より、UnityAgentに登録した私のファイル分割方針を優先して。"
    expected_behavior: apply_user_policy_first
    must_load:
      - .ai/user-policy.yaml
    must_include:
      - generic_best_practice_must_not_override_user_policy
      - every_new_file_requires_split_reason

  - id: CONTEXT-COMMENT-PRODUCTION-001
    prompt: "完成コードへ俺が読みやすい本番用日本語コメントを追加して。"
    expected_operation: production-code-comments
    must_load:
      - .ai/user-policy.yaml
      - SkillReferences/JAPANESE_CODE_COMMENT_STANDARDS.md
      - SkillReferences/COMMENT_REVIEW_CHECKLIST.md
    must_not:
      - line_by_line_translation
      - logic_change

  - id: CONTEXT-COMMENT-LEARNING-001
    prompt: "新人が処理順とUnityライフサイクルを理解できるよう詳しくコメントして。"
    expected_operation: learning-code-comments
    must_include:
      - execution_flow
      - data_flow
      - target_reader
    must_not:
      - logic_change

  - id: CONTEXT-001
    prompt: "このC#コンパイルエラーを指定ファイルだけ直して。"
    expected_route: csharp-local-fix
    expected_fingerprint:
      intent: fix
      artifact: csharp
      scope: local
      failure_mode: compile
      architecture_state: decided
      mutation_target: source
      evidence_state: known
      project_access: authorized
    expected_context_pack: .ai/context-packs/csharp-local-fix.yaml
    must_not_load:
      - SkillReferences/RENDERING_STANDARDS.md
      - SkillReferences/BEAUTIFUL_DEFINITION_INTEGRATION.md

  - id: CONTEXT-002
    prompt: "Editorでは正常だがSwitch実機だけRenderQueueが変わる原因を調査して。"
    expected_route: rendering-incident
    expected_fingerprint:
      intent: investigate
      artifact: rendering
      scope: multi_source
      failure_mode: platform_divergence
      architecture_state: not_applicable
      mutation_target: none
      evidence_state: unknown
      project_access: authorized
    expected_context_pack: .ai/context-packs/rendering-incident.yaml
    expected_primary_skill: unity-incident-investigation
    conditional_secondary:
      - unity-rendering

  - id: CONTEXT-003
    prompt: "このHLSL PassへMotion Vector対応を追加して。"
    expected_route: shader-change
    expected_fingerprint:
      intent: implement
      artifact: shader
      scope: local
      failure_mode: none
      architecture_state: decided
      mutation_target: shader_source
      evidence_state: known
      project_access: authorized
    expected_context_pack: .ai/context-packs/shader-change.yaml
    must_load:
      - SkillReferences/RENDERING_STANDARDS.md
      - SkillReferences/SHADER_PERFORMANCE_STANDARDS.md

  - id: CONTEXT-004
    prompt: "SwitchでTransparentのGPU時間を下げ、同条件でBefore/Afterを測って。"
    expected_route: performance-experiment
    expected_fingerprint:
      intent: optimize
      artifact: performance
      scope: multi_source
      failure_mode: performance
      architecture_state: not_applicable
      mutation_target: shader_source
      evidence_state: baseline_required
      project_access: authorized
    expected_context_pack: .ai/context-packs/performance.yaml
    must_include:
      - measurable_metric
      - baseline_capture_or_explicit_missing_baseline
      - quality_regression_check_required

  - id: CONTEXT-005
    prompt: "高品質なライブステージLightingと構図を設計して。"
    expected_route: visual-direction
    expected_fingerprint:
      intent: design
      artifact: visual
      scope: project_asset
      failure_mode: none
      architecture_state: not_applicable
      mutation_target: visual_plan
      evidence_state: known
      project_access: authorized
    expected_context_pack: .ai/context-packs/visual-direction.yaml
    expected_task_contract: .ai/harness/task-contracts/visual-direction.yaml
    expected_primary_skill: unity-visual-direction
    must_include:
      - visual_intent_before_mutation
      - human_review_required_for_visual_acceptance

  - id: CONTEXT-006
    prompt: "Shader Graph Reportだけを根拠に修正して。"
    expected_route: shader-change
    expected_fingerprint:
      intent: fix
      artifact: shader
      scope: local
      failure_mode: runtime
      architecture_state: decided
      mutation_target: shader_source
      evidence_state: partial
      project_access: authorized
    must_reject:
      - graph_only_mutation
    must_include:
      - direct_source_read_required

  - id: CONTEXT-007
    prompt: "全Skillと全Referenceを最初に全部読んで。"
    expected_behavior: reject_bulk_context_loading
    must_include:
      - select_exactly_one_primary_route
      - load_all_skills: false
      - load_all_references: false

  - id: CONTEXT-008
    prompt: "新しいGameplay FeatureのArchitectureとC#ファイル構成を設計して。"
    expected_route: architecture-design
    expected_fingerprint:
      intent: design
      artifact: architecture
      scope: multi_source
      failure_mode: none
      architecture_state: undecided
      mutation_target: none
      evidence_state: partial
      project_access: authorized
    expected_context_pack: .ai/context-packs/architecture-design.yaml
    expected_primary_skill: unity-architecture-design
    must_include:
      - single_cohesive_script_first
      - every_new_file_requires_split_reason
      - rejected_alternatives
      - reevaluation_conditions

  - id: CONTEXT-009
    prompt: "大量Projectile処理をGameObject、Jobs、ECSのどれで設計するべきか比較して。"
    expected_route: architecture-design
    expected_fingerprint:
      intent: design
      artifact: architecture
      scope: read_only
      failure_mode: none
      architecture_state: undecided
      mutation_target: none
      evidence_state: partial
      project_access: not_required
    expected_context_pack: .ai/context-packs/architecture-design.yaml
    must_include:
      - ecs_opportunity_check_required_for_data_parallel_work
      - ownership_and_lifetime
      - performance_capture

  - id: CONTEXT-010
    prompt: "Shaderは変更せずRendererFeatureのInjection PointとRendererListを修正して。"
    expected_route: renderer-feature-change
    expected_fingerprint:
      intent: fix
      artifact: renderer_feature
      scope: local
      failure_mode: runtime
      architecture_state: decided
      mutation_target: renderer_pipeline
      evidence_state: known
      project_access: authorized
    expected_context_pack: .ai/context-packs/renderer-feature-change.yaml
    must_not_require:
      - target_shader

  - id: CONTEXT-011
    prompt: "MaterialのSerialized PropertyだけをEditor API経由で更新して。"
    expected_route: asset-data-change
    expected_fingerprint:
      intent: implement
      artifact: asset_data
      scope: project_asset
      failure_mode: none
      architecture_state: not_applicable
      mutation_target: serialized_asset
      evidence_state: known
      project_access: authorized
    expected_context_pack: .ai/context-packs/asset-data-change.yaml
    must_not_require:
      - direct_callers_or_interfaces

  - id: CONTEXT-012
    prompt: "Project非依存のUnity Editor ToolをPortable UPM Packageとして設計して。"
    expected_route: portable-feature
    expected_fingerprint:
      intent: design
      artifact: editor_tool
      scope: portable_package
      failure_mode: none
      architecture_state: undecided
      mutation_target: package
      evidence_state: partial
      project_access: not_required
    expected_context_pack: .ai/context-packs/portable-feature.yaml
    expected_primary_skill: unity-architecture-design
    must_not_default_to:
      - shader-change

  - id: CONTEXT-013
    prompt: "会社Projectへ外部生成Packageを安全にStaging Importして。"
    expected_route: safe-import-integration
    expected_fingerprint:
      intent: integrate
      artifact: package
      scope: safe_import
      failure_mode: none
      architecture_state: not_applicable
      mutation_target: package
      evidence_state: known
      project_access: restricted
    expected_profile: team_safe_import
    must_not_include:
      - project_scanner
      - source_export
      - screenshot_capture

  - id: CONTEXT-014
    prompt: "MyUnityMCPのGraphics Creator WorkflowとCapability構成を設計して。"
    expected_route: graphics-mcp
    expected_fingerprint:
      intent: design
      artifact: mcp
      scope: cross_system
      failure_mode: none
      architecture_state: undecided
      mutation_target: mcp_contract
      evidence_state: partial
      project_access: not_required
    expected_context_pack: .ai/context-packs/graphics-mcp.yaml
    expected_primary_skill: unity-architecture-design

  - id: CONTEXT-FINGERPRINT-NEG-001
    prompt: "HLSLという単語の意味だけ説明して。変更も調査もしない。"
    expected_behavior: simple_read_only_explanation_without_domain_route
    expected_fingerprint:
      intent: explain
      artifact: shader
      scope: read_only
      failure_mode: none
      architecture_state: not_applicable
      mutation_target: none
      evidence_state: not_applicable
      project_access: not_required
    must_not_default_to:
      - shader-change

  - id: CONTEXT-FINGERPRINT-NEG-002
    prompt: "RendererFeatureとShaderを使う新機能だけど、実装前に責務とファイル構成を決めたい。"
    expected_route: architecture-design
    expected_fingerprint:
      intent: design
      artifact: architecture
      scope: multi_source
      failure_mode: none
      architecture_state: undecided
      mutation_target: none
      evidence_state: partial
      project_access: authorized
    must_not_default_to:
      - renderer-feature-change
      - shader-change

  - id: CONTEXT-FALLBACK-001
    prompt: "この短いUnity APIの意味だけ説明して。変更はしない。"
    expected_behavior: simple_read_only_explanation_without_domain_route
    must_not:
      - legacy_routing_document
      - supervisor_state_machine
