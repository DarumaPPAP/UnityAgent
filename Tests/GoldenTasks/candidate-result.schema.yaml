schema_version: "1.4"
kind: unityagent_golden_candidate_result_schema

result_fields:
  task_id: required
  route: optional
  fingerprint: optional
  applied_policies: []
  gates: []
  signals: []
  knowledge: []
  unresolved: []
  failure_types: []
  failure_class: optional
  outcome: required
  attempt_count: optional
  manifest_path: optional
  generated_artifacts: []
  execution: optional

generated_artifact_fields:
  path: required
  language: required
  kind: required

execution_fields:
  mode:
    optional: true
    allowed:
      - actual_behavior
  run_id: optional
  observation_state:
    optional: true
    allowed:
      - observed
      - not_observed
  failure_class: optional
  execution_fingerprint: optional
  evidence_provenance: optional
  evidence_coverage: optional
  behavior_findings: optional
  structure: optional
  execution_owner: optional
  runtime: optional

rules:
  default_generated_artifact_root: Artifacts/GoldenEval
  actual_behavior_generated_artifact_root: Artifacts/BehaviorEval
  generated_artifact_root_is_selected_by_execution_mode: true
  path_traversal_is_forbidden: true
  missing_generated_artifact_is_broken_eval: true
  unsupported_language_is_not_naming_evidence: true
  candidate_declared_identifier_names_are_not_artifact_evidence: true
  actual_behavior_candidate_must_be_evidence_derived: true
  agent_self_report_is_not_actual_behavior_provenance: true
  execution_provenance_is_backward_compatible_optional: true
  not_observed_runtime_failure_must_not_be_graded_as_route_policy_or_harness_failure: true

failure_types_allowed:
  - routing_miss
  - context_miss
  - policy_violation
  - harness_violation
  - mutation_violation
  - evidence_overclaim
  - model_failure
  - agent_behavior_regression
  - broken_eval
  - unavailable_evidence
  - evaluator_contract_failure
  - runtime_timeout
  - runtime_protocol_failure
  - unavailable_required_evidence
  - task_fixture_invalid

outcome_allowed:
  - passed
  - failed
  - unavailable
