schema_version: "1.0"
kind: unityagent_golden_candidate_result_schema

result_fields:
  task_id: required
  route: optional
  fingerprint: optional
  applied_policies: []
  gates: []
  signals: []
  knowledge: []
  unresolved: []
  outcome: required
  attempt_count: optional
  manifest_path: optional

outcome_allowed:
  - passed
  - failed
  - unavailable
