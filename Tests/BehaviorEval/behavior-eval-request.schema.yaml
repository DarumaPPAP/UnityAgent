schema_version: "1.0"
kind: unityagent_behavior_eval_request_schema

required_fields:
  - schema_version
  - run_id
  - golden_task_id
  - unityagent_revision
  - task
  - execution
  - workspace
  - evidence
  - result_root

execution_fields:
  mode:
    required: true
    allowed:
      - prompt
      - graph
  profile: required
  work_kind: required
  max_agent_attempts:
    required: true
    minimum: 1

workspace_fields:
  fixture: required
  mutation_mode:
    required: true
    allowed:
      - sandbox

evidence_fields:
  require: []
  optional: []

rules:
  golden_expectation_is_not_part_of_request: true
  request_task_is_copied_from_golden_task_only: true
  smoke_max_agent_attempts_must_equal_one: true
  mutation_mode_must_be_sandbox: true
  fixture_must_be_repository_relative: true
  result_root_must_be_under_Artifacts_BehaviorEval: true
  provider_credentials_are_forbidden: true
  provider_selection_policy_is_not_owned_by_request: true
  execution_budget_is_not_owned_by_request: true
  loop_or_retry_policy_is_not_owned_by_request: true
