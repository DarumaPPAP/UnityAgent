schema_version: "1.1"
kind: unityagent_behavior_execution_envelope_schema

required_fields:
  - schema_version
  - run_id
  - golden_task_id
  - execution_owner
  - unityagent
  - executor
  - attempt
  - status
  - evidence
  - execution_fingerprint

execution_owner_fields:
  repository: required
  revision: required

unityagent_fields:
  repository: required
  revision: required

executor_fields:
  profile: required
  mode: required
  execution_class: optional
  agent_id: optional
  provider: required
  model: required
  model_revision: required

attempt_fields:
  agent_attempt:
    required: true
    minimum: 1
  infrastructure_attempts:
    required: true
    minimum: 1

status_allowed:
  - completed
  - unavailable
  - failed
  - protocol_error

failure_fields:
  required: false
  class:
    allowed:
      - agent_behavior_regression
      - evaluator_contract_failure
      - runtime_timeout
      - runtime_protocol_failure
      - unavailable_required_evidence
      - task_fixture_invalid
  reason: optional
  observation_state:
    allowed: [observed, not_observed]

evidence_fields:
  context_manifest: required
  response: required
  diff: optional
  artifact_index: required
  gate_evidence: []
  metrics_ref: optional
  codex_events_ref: optional
  codex_stderr_ref: optional

runtime_fields:
  timeout_seconds: optional
  root_pid: optional
  process_tree_cleanup: optional
  remaining_processes: optional
  duration_seconds: optional
  first_output_latency_seconds: optional
  event_count: optional
  last_event_timestamp: optional

execution_fingerprint_fields:
  unityagent_revision: required
  graph_engineering_revision: required
  golden_suite_revision: required
  execution_profile: required
  execution_mode: required
  provider: required
  model: required
  reasoning_effort: optional
  tool_manifest_hash: required
  workspace_fixture_hash: required

rules:
  execution_owner_repository_must_be_DarumaPPAP_Unity_Graph_Engineering: true
  unityagent_repository_must_be_DarumaPPAP_UnityAgent: true
  smoke_agent_attempt_must_equal_one: true
  production_smoke_requires_execution_class_production: true
  production_smoke_requires_real_agent_provider_and_model_identity: true
  infrastructure_attempts_must_be_recorded: true
  provider_or_model_revision_must_not_be_guessed: true
  unavailable_provider_or_model_revision_uses_literal_unavailable: true
  timeout_must_set_failure_class_runtime_timeout: true
  timeout_route_policy_and_harness_are_not_observed: true
  runtime_failure_must_not_be_regraded_as_agent_behavior_regression: true
  reasoning_effort_must_be_pinned_for_production_smoke: true
  evidence_paths_must_be_case_relative: true
  evidence_path_traversal_is_forbidden: true
  secret_fields_are_forbidden: true
  raw_environment_variables_are_forbidden: true
  private_absolute_project_paths_are_forbidden: true
