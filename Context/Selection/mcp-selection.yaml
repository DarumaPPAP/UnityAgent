schema_version: "1.0"
kind: mcp_context_selection
authority: Context
catalogs:
  mcp: Catalog/mcp-catalog.yaml
  creator: Catalog/creator-catalog.yaml
  capability: Catalog/capability-catalog.yaml
selection:
  select_exactly_one_primary_creator_or_domain_mcp: true
  conditional_domain_mcp_limit: 2
  load_all_catalog_entries: false
  load_all_manifests: false
  load_all_tool_schemas: false
  load_package_source_by_default: false
context_activation:
  level_0:
    load:
      - compact_catalog_entry
  level_1:
    condition: primary_creator_or_domain_selected
    load:
      - selected_manifest
      - selected_workflow_contract_when_creator
rules:
  context_selects_only_relevant_descriptions_and_schemas: true
  runtime_owns_actual_tool_exposure: true
  policy_owns_permission_requirements: true
