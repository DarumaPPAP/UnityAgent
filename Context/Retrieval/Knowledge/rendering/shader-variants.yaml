id: rendering.shader_variants
version: "0.1.0"
status: draft

use_when:
  - shader_variant_failure
  - strict_variant_matching
  - keyword_audit
  - build_only_shader_failure

required_inputs:
  - unity_version
  - render_pipeline_version
  - target_platforms
  - runtime_keyword_sources
  - stripping_configuration

implementation_contract:
  - shader_pass_and_keyword_ownership_are_explicit
  - runtime_keyword_sources_are_inspected
  - editor_player_and_assetbundle_paths_are_distinguished
  - strict_variant_behavior_is_verified_per_target

prohibited:
  - remove_variants_from_source_pattern_alone
  - claim_player_support_from_editor_shader_compile
  - rename_pass_or_lightmode_without_dependency_review

required_evidence:
  - static_keyword_audit
  - unity_shader_compile
  - player_or_build_variant_evidence

related:
  required: []
  conditional:
    - rendering.temporal_anti_aliasing
    - rendering.outline_rendering

human_reference:
  repository: DarumaPPAP/Unity-Knowledge-Products
  knowledge_id: rendering.shader_variants
  entry: Rendering/ShaderVariants/index.html
