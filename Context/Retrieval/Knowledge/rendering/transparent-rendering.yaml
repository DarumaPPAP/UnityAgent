id: rendering.transparent_rendering
version: "0.1.0"
status: draft

use_when:
  - transparent_rendering
  - additive_rendering
  - overdraw
  - transparent_temporal_artifact

required_inputs:
  - render_queue_range
  - sorting_policy
  - depth_test_and_write
  - blend_state
  - target_platforms

implementation_contract:
  - queue_filter_and_sorting_are_explicit
  - depth_ownership_is_explicit
  - blend_and_composite_stage_are_explicit
  - temporal_and_motion_vector_support_is_declared

prohibited:
  - include_transparent_objects_in_opaque_range_without_explicit_reason
  - assume_outline_or_motion_vector_support
  - claim_overdraw_reduction_without_measurement

required_evidence:
  - static_contract_review
  - unity_compile
  - overlap_case
  - depth_intersection_case

related:
  required: []
  conditional:
    - rendering.temporal_anti_aliasing
    - rendering.motion_vectors
    - rendering.outline_rendering
    - rendering.ui_composition

human_reference:
  repository: DarumaPPAP/Unity-Knowledge-Products
  knowledge_id: rendering.transparent_rendering
  entry: Rendering/TransparentRendering/index.html
