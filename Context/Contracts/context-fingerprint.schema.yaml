$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:context:context-fingerprint
title: ContextFingerprint
type: object
additionalProperties: false
required: [schema_version, algorithm, value, selected_source_revisions]
properties:
  schema_version: {const: "1.0"}
  algorithm: {const: sha256}
  value: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  selected_source_revisions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ref, revision]
      properties:
        ref: {type: string, minLength: 1}
        revision: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
