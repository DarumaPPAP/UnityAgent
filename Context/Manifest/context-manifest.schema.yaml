$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:unityagent:context:context-manifest
title: ContextManifest
type: object
additionalProperties: false
required:
  - schema_version
  - manifest_id
  - run_id
  - attempt
  - materialized_context
  - project_facts
  - budget_report
  - unresolved_bindings
  - generated_at
properties:
  schema_version: {const: "1.0"}
  manifest_id: {type: string, minLength: 1}
  run_id: {type: string, minLength: 1}
  attempt: {type: integer, minimum: 1}
  previous_manifest_ref: {type: [string, "null"]}
  materialized_context:
    $ref: urn:unityagent:context:materialized-context-view
  project_facts:
    type: array
    items:
      $ref: urn:unityagent:context:project-fact-observation
  budget_report:
    type: object
  unresolved_bindings:
    type: array
    items: {type: string}
  generated_at: {type: string, minLength: 1}
x-unityagent-rules:
  context_manifest_is_current_call_trace: true
  workflow_state_is_not_authoritative_here: true
  evidence_truth_is_not_authoritative_here: true
  graph_topology_is_not_authoritative_here: true
  current_project_fact_requires_checked_at_attempt_equal_manifest_attempt: true
  project_fact_checked_at_attempt_must_not_precede_observed_at_attempt: true
  project_fact_observed_at_attempt_must_not_exceed_manifest_attempt: true
  retry_requires_explicit_project_fact_reobservation_or_revalidation: true
