schema_version: "3.0"
id: architecture-design
primary_skill: .agents/skills/unity-architecture-design/SKILL.md

metadata:
  type: context
  title: Architecture Design
  summary:
    - Select architecture depth and file responsibility for Unity features.
  purpose:
    - Decide the smallest cohesive architecture supported by the task scope.
  decisions:
    - id: engineering-principles-foundation
      label: User engineering principles are foundational for every architecture decision
      source_ref: .ai/user-policy.yaml#core_user_policies.engineering_principles
    - id: architecture-rules-authoritative
      label: Existing architecture rules remain authoritative
      source_ref: .ai/context-packs/architecture-design.yaml#rules
  forbidden:
    - id: speculative-architecture-mutation
      label: Speculative architecture changes are forbidden
      source_ref: .ai/harness/task-contracts/architecture-design.yaml#prohibited_mutations
  related: []
  priority: high
  tags: [architecture, csharp, unity]

use_when:
  - new Unity feature or system architecture
  - class and C# file responsibility design
  - MonoBehaviour Plain C# ScriptableObject separation
  - MVP MVVM MVC selection
  - Controller Manager Service Interface necessity review
  - ECS Jobs Burst or hybrid adoption decision
  - excessive file split or architecture refactoring review

required:
  - type: repository_reference
    path: .ai/user-policy.yaml
  - type: binding
    name: goal
  - type: binding
    name: scope_classification
  - type: binding
    name: prohibited_changes
  - type: repository_reference
    path: SkillReferences/ENGINEERING_DESIGN_PRINCIPLES.md
  - type: repository_reference
    path: SkillReferences/ARCHITECTURE_DECISION_POLICY.md
  - type: repository_reference
    path: SkillReferences/ARCHITECTURE_STANDARDS.md
  - type: repository_reference
    path: SkillReferences/CODING_STANDARDS.md

conditional:
  csharp_output:
    - type: repository_reference
      path: SkillReferences/CODE_FORMATTING_STANDARDS.md
  local_behavior:
    - type: binding
      name: attachment_target
    - type: binding
      name: lifecycle_or_callback
    - type: binding
      name: state_or_resource
    - type: binding
      name: side_effect_or_restore
  feature_or_larger:
    - type: binding
      name: current_or_expected_scale
    - type: binding
      name: ownership_and_lifetime
    - type: binding
      name: change_axes
  platform_specific_api_build_compatibility_or_performance_claim:
    - type: binding
      name: target_platform
  performance_sensitive_goal:
    - type: binding
      name: performance_constraints
    - type: binding
      name: measurable_workload
  existing_project:
    - type: binding
      name: target source and direct dependencies
    - type: binding
      name: asmdef and rootNamespace
    - type: binding
      name: public and serialized contracts
  ecs_jobs_burst:
    - type: binding
      name: Entities package version
    - type: binding
      name: Burst and Jobs availability
    - type: binding
      name: managed reference boundary
    - type: binding
      name: GameObject bridge requirements
    - type: binding
      name: measurable workload
  ui_presentation:
    - type: binding
      name: UI framework
    - type: binding
      name: binding complexity
    - type: binding
      name: presentation testability
  rendering:
    - type: repository_reference
      path: SkillReferences/RENDERING_STANDARDS.md
    - type: repository_reference
      path: .agents/skills/unity-rendering/SKILL.md

excluded_by_default:
  - unrelated domain catalogs
  - all architecture patterns
  - all project source files
  - long human Knowledge Products without a comparison need
  - legacy Supervisor routing documents

rules:
  user_policy_has_priority_over_generic_architecture_pattern: true
  engineering_principles_review_required: true
  minimum_cohesive_solution_first: true
  local_behavior_fast_path: true
  unity_lifecycle_first: true
  requirement_surface_lock: true
  no_extra_state_without_reason: true
  no_premature_generalization: true
  architecture_depth_is_scope_dependent: true
  architecture_is_local_to_problem: true
  every_new_file_requires_split_reason: true
  hypothetical_reuse_is_not_split_reason: true
  pattern_name_is_not_design_evidence: true
  simple_solution_must_be_considered_first: true
  ecs_opportunity_check_required_for_data_parallel_work: true
  production_performance_claim_requires_evidence: true
  public_and_serialized_contracts_are_preserved: true
  target_platform_is_conditional_not_global_default: true
  naming_convention_is_preserved: true

limits:
  initial_file_reads: 8
  context_expansion_hops: 1
  architecture_candidates: 4
  local_behavior_architecture_candidates: 1

output:
  - scope_classification
  - confirmed_context
  - selected_architecture
  - validation_plan
  - local_behavior_fast_path_result_when_applicable
  - ownership_and_lifetime_when_applicable
  - change_axes_when_applicable
  - architecture_candidates_when_applicable
  - rejected_alternatives_when_applicable
  - file_plan_when_multiple_files_are_needed
  - types_kept_in_same_file
  - intentionally_not_created_types
  - dependency_direction_when_applicable
  - serialization_contracts_when_applicable
  - reevaluation_conditions_when_applicable
