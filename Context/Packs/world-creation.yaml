schema_version: "3.0"
id: world-creation
primary_skill: .agents/skills/unity-architecture-design/SKILL.md
metadata:
  type: context
  title: World Creation Planning
  summary: [Turn a bounded world goal into a structured, reviewable plan.]
  purpose: [Preserve scope, constraints, dependencies, evidence, and open decisions without scene mutation.]
  decisions:
    - id: plan-before-execution
      label: UnityAgent owns routing and execution after planning
      source_ref: Orchestration/Contracts/TaskContracts/world-creation.yaml#completion
  forbidden:
    - id: direct-world-mutation
      label: Planning does not mutate Unity content
      source_ref: Orchestration/Contracts/TaskContracts/world-creation.yaml#prohibited_mutations
  related: []
  priority: high
  tags: [world, planning, review]
use_when: [A high-level World or Scene goal needs bounded work decomposition.]
required:
  - {type: repository_reference, path: Policy/User/user-policy.yaml}
  - {type: binding, name: goal}
  - {type: binding, name: scene_scope}
conditional: {}
excluded_by_default: [unrelated domain catalogs, mutation tools]
rules:
  read_only: true
  human_review_required: true
  automatic_visual_acceptance: false
  unknown_decisions_remain_open: true
limits:
  initial_file_reads: 5
  context_expansion_hops: 1
output: [world_plan, open_decisions, required_evidence]
