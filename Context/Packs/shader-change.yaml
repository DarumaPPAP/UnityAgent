schema_version: "3.0"
id: shader-change
primary_skill: .agents/skills/unity-rendering/SKILL.md

metadata:
  type: context
  title: Shader Change
  summary:
    - Change ShaderLab, HLSL, or Compute Shader code under explicit compatibility constraints.
  purpose:
    - Preserve shader identity, properties, keywords, passes, and runtime evidence boundaries.
  decisions:
    - id: shader-contract-preservation
      label: Shader contract preservation remains authoritative
      source_ref: Context/Packs/shader-change.yaml#rules
  forbidden:
    - id: unsupported-shader-contract-change
      label: Unbounded shader contract changes are forbidden
      source_ref: Orchestration/Contracts/TaskContracts/shader-change.yaml#prohibited_mutations
  related: []
  priority: high
  tags: [shader, hlsl, rendering]

use_when:
  - ShaderLab HLSL or Compute Shader change
  - RendererFeature and shader integration
  - motion vector temporal or depth shader work
  - shader performance correction

required:
  - type: binding
    name: target_shader
  - type: binding
    name: direct_includes
  - type: binding
    name: material_or_pass_contract
  - type: repository_reference
    path: SkillReferences/RENDERING_STANDARDS.md
  - type: repository_reference
    path: SkillReferences/SHADER_PERFORMANCE_STANDARDS.md
  - type: repository_reference
    path: SkillReferences/ShaderPerformance/UNITY_URP_POLICY.md

conditional:
  project_fallback:
    - type: repository_reference
      path: Specs/ProjectProfile.md
  read_only_audit:
    - type: repository_reference
      path: .agents/skills/shader-performance-auditor/SKILL.md
    - type: repository_reference
      path: SkillReferences/ShaderPerformance/SHADER_REVIEW_GATE.md
    - type: repository_reference
      path: SkillReferences/ShaderPerformance/RULE_CATALOG.md
  confirmed_refactor:
    - type: repository_reference
      path: .agents/skills/shader-performance-refactor/SKILL.md
    - type: repository_reference
      path: SkillReferences/ShaderPerformance/REFACTOR_POLICY.md
  variant_change:
    - type: repository_reference
      path: .agents/skills/unity-shader-variant-governor/SKILL.md
    - type: repository_reference
      path: SkillReferences/ShaderPerformance/VARIANT_POLICY.md
  runtime_measurement:
    - type: binding
      name: matching shader runtime evidence Skill

excluded_by_default:
  - SkillReferences/BEAUTIFUL_DEFINITION_INTEGRATION.md
  - unrelated CSharp architecture references

rules:
  preserve_shader_name: true
  preserve_properties: true
  preserve_keywords: true
  preserve_pass_lightmode_renderstate: true
  direct_source_read_required: true
  pattern_does_not_prove_gpu_cost: true
  editor_does_not_prove_target_platform: true
  detected_project_facts_override_project_profile: true
  project_profile_is_fallback_only: true

limits:
  initial_file_reads: 6
  context_expansion_hops: 1

output:
  - shader_contract
  - pass_and_resource_contract
  - compatibility_constraints
  - variant_impact
  - required_compile_and_runtime_evidence
  - revert_condition
