schema_version: "3.0"
id: visual-direction
primary_skill: .agents/skills/unity-visual-direction/SKILL.md

metadata:
  type: context
  title: Visual Direction
  summary:
    - Define scene composition, lighting, color, atmosphere, and human visual review.
  purpose:
    - Separate visual intent, technical validation, and beauty acceptance.
  decisions:
    - id: visual-intent-before-mutation
      label: Visual intent and beauty gates remain authoritative
      source_ref: .ai/context-packs/visual-direction.yaml#rules
  forbidden:
    - id: visual-acceptance-without-human-review
      label: Visual acceptance without human review is forbidden
      source_ref: .ai/harness/task-contracts/visual-direction.yaml#prohibited_mutations
  related: []
  priority: normal
  tags: [visual, beauty, human-review]

use_when:
  - scene visual quality
  - lighting and look development
  - composition camera color atmosphere
  - human visual review

required:
  - type: binding
    name: user_visual_goal_or_reference
  - type: repository_reference
    path: SkillReferences/BEAUTIFUL_DEFINITION_INTEGRATION.md
  - type: external_reference
    repository: DarumaPPAP/Beautiful-Definition
    path: AGENTS.md
  - type: external_reference
    repository: DarumaPPAP/Beautiful-Definition
    path: Catalog/definitions.yaml
  - type: binding
    name: selected_definition
  - type: binding
    name: matching_core_principles

conditional:
  technical_rendering_work:
    - type: repository_reference
      path: .agents/skills/unity-rendering/SKILL.md
    - type: repository_reference
      path: SkillReferences/RENDERING_STANDARDS.md
  shader_or_material_work:
    - type: context_include
      context_id: shader-change
  performance_constraint:
    - type: context_include
      context_id: performance

excluded_by_default:
  - unselected_visual_definitions
  - unrelated_shader_rule_catalogs

rules:
  visual_intent_before_mutation: true
  beauty_gate_separate_from_technical_gate: true
  compile_is_not_beauty_evidence: true
  capture_generation_is_not_acceptance: true
  human_review_required_for_visual_acceptance: true
  preserve_originality_and_reference_boundaries: true

limits:
  initial_file_reads: 6
  context_expansion_hops: 1

output:
  - selected_definition_id
  - visual_intent_contract
  - technical_translation_constraints
  - required_captures
  - beauty_review_questions
  - human_review_status
