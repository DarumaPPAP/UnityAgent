schema_version: "3.0"
id: portable-feature
primary_skill: .agents/skills/unity-architecture-design/SKILL.md

metadata:
  type: context
  title: Portable Feature
  summary:
    - Design a project-independent Unity package with explicit unresolved bindings.
  purpose:
    - Keep portable source independent from guessed project paths and settings.
  decisions:
    - id: portable-boundaries-explicit
      label: Portable package boundaries remain explicit
      source_ref: Context/Packs/portable-feature.yaml#rules
  forbidden:
    - id: guessed-project-binding
      label: Guessed project bindings and unrequested setup are forbidden
      source_ref: Orchestration/Contracts/TaskContracts/portable-feature.yaml#prohibited_mutations
  related: []
  priority: normal
  tags: [portable, package, bindings]

use_when:
  - project independent Unity package
  - portable UPM feature
  - external authoring without project source access
  - reusable Unity feature with unresolved project bindings

required:
  - type: repository_reference
    path: Policy/User/user-policy.yaml
  - type: binding
    name: portable_goal
  - type: binding
    name: portable_domain
  - type: binding
    name: supported_unity_and_pipeline_range
  - type: binding
    name: prohibited_project_assumptions
  - type: binding
    name: unresolved_project_bindings
  - type: binding
    name: integration_contract

conditional:
  csharp_feature:
    - type: repository_reference
      path: SkillReferences/CODING_STANDARDS.md
    - type: repository_reference
      path: SkillReferences/ARCHITECTURE_DECISION_POLICY.md
  rendering_feature:
    - type: context_include
      context_id: renderer-feature-change
  shader_feature:
    - type: context_include
      context_id: shader-change
  asset_authoring:
    - type: context_include
      context_id: asset-data-change
  team_safe_import:
    - type: repository_reference
      path: Runtime/Profiles/runtime-profiles.yaml
    - type: repository_reference
      path: Orchestration/Contracts/TaskContracts/safe-import-integration.yaml

excluded_by_default:
  - assumed project paths scene names renderer data layers and shader tags
  - personal project tools in team safe import
  - project settings mutation
  - platform SDK dependency without an explicit requirement
  - setup systems that were not requested
  - legacy Supervisor routing documents

rules:
  portable_domain_must_be_resolved_before_implementation: true
  project_bindings_must_remain_explicit: true
  no_project_path_guessing: true
  no_unrequested_environment_setup: true
  single_cohesive_script_first: true
  every_new_file_requires_split_reason: true
  user_policy_has_priority_over_generic_package_architecture: true

limits:
  initial_file_reads: 7
  context_expansion_hops: 1

output:
  - portable_domain
  - package_boundary
  - architecture_and_file_plan
  - integration_contract
  - unresolved_project_bindings
  - validation_instructions
  - compatibility_range
  - rollback_or_uninstall_contract
