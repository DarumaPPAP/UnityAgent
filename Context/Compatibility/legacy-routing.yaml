schema_version: "3.3"
repository_role: unity_domain_knowledge
execution_owner: DarumaPPAP/Unity-Graph-Engineering
user_policy: .ai/user-policy.yaml
execution_profiles: .ai/execution-profiles.yaml
context_pack_contract: .ai/context-pack.schema.yaml
context_manifest_schema: .ai/context-manifest.schema.yaml
context_budget: .ai/context-budget.yaml
task_contract_schema: .ai/harness/task-contracts/task-contract.schema.yaml
knowledge_index: .ai/knowledge/index.yaml
quality_gates: .ai/harness/quality-gates.yaml
mutation_channels: .ai/harness/mutation-channels.yaml
risk_levels: .ai/harness/risk-levels.yaml
mcp_activation_policy: .ai/harness/mcp-activation.yaml
mcp_repository: DarumaPPAP/MyUnityMCP

routing_rules:
  user_policy_must_be_loaded_before_domain_decision: true
  generic_best_practice_must_not_override_user_policy: true
  task_fingerprint_required_before_domain_route: true
  route_match_uses_fingerprint_not_trigger_strings: true
  primary_goal_controls_fingerprint: true
  unknown_dimensions_must_not_be_guessed: true
  prompt_examples_are_test_only: true
  select_exactly_one_primary_route: true
  select_exactly_one_primary_task_contract: true
  select_at_most_one_primary_knowledge: true
  select_exactly_one_primary_creator_or_domain_mcp_when_mcp_is_required: true
  conditional_domain_mcp_limit: 2
  load_all_skills: false
  load_all_references: false
  load_all_mcp_manifests: false
  load_all_mcp_tool_schemas: false
  load_mcp_package_source_by_default: false
  typed_context_pack_version: "3.0"
  scalar_context_entries_forbidden: true
  repository_reference_must_be_explicit: true
  external_reference_must_be_explicit: true
  context_include_does_not_change_primary_route: true
  route_handoff_changes_primary_route: true
  project_context_required_for_planning: false
  capability_manifest_required_for_planning: false
  detected_project_facts_override_project_profile: true
  user_confirmed_project_facts_override_project_profile: true
  project_profile_is_fallback_only: true
  project_profile_must_not_be_required_context: true
  project_profile_load_requires_missing_project_fact: true
  project_fact_provenance_required: true
  current_project_fact_requires_current_attempt_check: true
  retry_must_not_implicitly_reuse_project_facts: true
  context_budget_contract_version: "1.0"
  context_budget_required_before_mutation: true
  estimated_context_tokens_are_not_exact_provider_tokens: true
  project_and_external_budget_observation_required: true
  authoritative_context_lossy_compression_forbidden: true
  hard_context_budget_overflow_stops_mutation: true
  direct_source_read_required_before_mutation: true
  knowledge_graph_is_navigation_only: true
  human_html_is_conditional_reference: true
  route_id_format: kebab-case
  mapping_key_is_not_route_id: true

task_fingerprint:
  purpose: classify_task_semantics_before_route_selection
  required_dimensions:
    - intent
    - artifact
    - scope
    - failure_mode
    - architecture_state
    - mutation_target
    - evidence_state
    - project_access
  dimensions:
    intent:
      - explain
      - investigate
      - fix
      - implement
      - design
      - optimize
      - integrate
      - review
      - refactor
    artifact:
      - csharp
      - shader
      - renderer_feature
      - rendering
      - asset_data
      - performance
      - visual
      - architecture
      - mcp
      - package
      - editor_tool
      - mixed
    scope:
      - read_only
      - local
      - multi_source
      - project_asset
      - portable_package
      - safe_import
      - cross_system
    failure_mode:
      - none
      - compile
      - runtime
      - rendering_unknown
      - platform_divergence
      - performance
      - serialization
      - visual
    architecture_state:
      - decided
      - undecided
      - not_applicable
    mutation_target:
      - none
      - source
      - shader_source
      - renderer_pipeline
      - serialized_asset
      - package
      - mcp_contract
      - visual_plan
    evidence_state:
      - known
      - partial
      - unknown
      - baseline_required
      - not_applicable
    project_access:
      - authorized
      - unavailable
      - restricted
      - not_required
  classification_rules:
    classify_primary_goal_before_mentioned_technologies: true
    mentioned_api_or_technology_name_is_not_route_authority: true
    unknown_rendering_root_cause_prefers_incident_classification: true
    confirmed_shader_change_prefers_shader_artifact: true
    confirmed_renderer_feature_change_prefers_renderer_feature_artifact: true
    measurable_optimization_goal_prefers_performance_artifact: true
    architecture_undecided_prefers_architecture_artifact: true
    read_only_explanation_does_not_require_domain_mutation_route: true
    unresolved_dimension_value: unknown_when_supported_otherwise_fallback

profile_selection:
  project_not_accessible:
    profile: generic_planning
  personal_project_full_access_authorized:
    profile: personal_full_control
  company_project_external_authoring_or_import:
    profile: team_safe_import

conditional_operations:
  production_comment_addition:
    skill: production-code-comments
    policy: .ai/user-policy.yaml#comment_system
  learning_comment_addition:
    skill: learning-code-comments
    policy: .ai/user-policy.yaml#comment_system
  existing_comment_review:
    skill: comment-quality-reviewer
    policy: .ai/user-policy.yaml#comment_system

routes:
  architecture_design:
    id: architecture-design
    fingerprint_match:
      intent:
        - design
        - review
        - refactor
      artifact:
        - architecture
      architecture_state:
        - undecided
      mutation_target:
        - none
        - source
    primary_skill: unity-architecture-design
    context_pack: .ai/context-packs/architecture-design.yaml
    task_contract: .ai/harness/task-contracts/architecture-design.yaml
    knowledge_selection: optional

  graphics_mcp:
    id: graphics-mcp
    fingerprint_match:
      intent:
        - design
        - implement
        - integrate
        - review
      artifact:
        - mcp
      scope:
        - cross_system
        - multi_source
        - read_only
      mutation_target:
        - mcp_contract
        - none
    primary_skill: unity-architecture-design
    context_pack: .ai/context-packs/graphics-mcp.yaml
    task_contract: .ai/harness/task-contracts/graphics-mcp.yaml
    knowledge_selection: required_when_domain_matches
    mcp_selection: required

  csharp_local_fix:
    id: csharp-local-fix
    fingerprint_match:
      intent:
        - fix
        - implement
      artifact:
        - csharp
      scope:
        - local
      architecture_state:
        - decided
        - not_applicable
      mutation_target:
        - source
      evidence_state:
        - known
        - partial
    primary_skill: csharp-safe-patch
    context_pack: .ai/context-packs/csharp-local-fix.yaml
    task_contract: .ai/harness/task-contracts/csharp-local-fix.yaml

  rendering_incident:
    id: rendering-incident
    fingerprint_match:
      intent:
        - investigate
        - fix
      artifact:
        - rendering
        - shader
        - renderer_feature
      scope:
        - local
        - multi_source
        - project_asset
      failure_mode:
        - rendering_unknown
        - platform_divergence
      evidence_state:
        - unknown
        - partial
    primary_skill: unity-incident-investigation
    context_pack: .ai/context-packs/rendering-incident.yaml
    task_contract: .ai/harness/task-contracts/rendering-incident.yaml

  shader_change:
    id: shader-change
    fingerprint_match:
      intent:
        - fix
        - implement
        - optimize
      artifact:
        - shader
      architecture_state:
        - decided
        - not_applicable
      failure_mode:
        - none
        - compile
        - runtime
        - performance
      mutation_target:
        - shader_source
      evidence_state:
        - known
        - partial
        - baseline_required
    primary_skill: unity-rendering
    context_pack: .ai/context-packs/shader-change.yaml
    task_contract: .ai/harness/task-contracts/shader-change.yaml
    knowledge_selection: required_when_domain_matches

  renderer_feature_change:
    id: renderer-feature-change
    fingerprint_match:
      intent:
        - fix
        - implement
        - refactor
      artifact:
        - renderer_feature
      architecture_state:
        - decided
        - not_applicable
      failure_mode:
        - none
        - compile
        - runtime
      mutation_target:
        - renderer_pipeline
      evidence_state:
        - known
        - partial
    primary_skill: unity-rendering
    context_pack: .ai/context-packs/renderer-feature-change.yaml
    task_contract: .ai/harness/task-contracts/renderer-feature-change.yaml
    knowledge_selection: required_when_domain_matches

  performance_experiment:
    id: performance-experiment
    fingerprint_match:
      intent:
        - optimize
        - investigate
      artifact:
        - performance
      failure_mode:
        - performance
      mutation_target:
        - none
        - source
        - shader_source
        - renderer_pipeline
      evidence_state:
        - baseline_required
        - known
        - partial
    primary_skill: unity-runtime-evidence
    context_pack: .ai/context-packs/performance.yaml
    task_contract: .ai/harness/task-contracts/performance-experiment.yaml

  asset_data_change:
    id: asset-data-change
    fingerprint_match:
      intent:
        - fix
        - implement
        - integrate
      artifact:
        - asset_data
      scope:
        - local
        - project_asset
      failure_mode:
        - none
        - serialization
        - runtime
      mutation_target:
        - serialized_asset
    primary_skill: csharp-safe-patch
    context_pack: .ai/context-packs/asset-data-change.yaml
    task_contract: .ai/harness/task-contracts/asset-data-change.yaml

  portable_feature:
    id: portable-feature
    fingerprint_match:
      intent:
        - design
        - implement
      artifact:
        - package
        - editor_tool
        - csharp
      scope:
        - portable_package
      mutation_target:
        - none
        - source
        - package
      project_access:
        - unavailable
        - not_required
    primary_skill: unity-architecture-design
    context_pack: .ai/context-packs/portable-feature.yaml
    task_contract: .ai/harness/task-contracts/portable-feature.yaml
    forced_profile: generic_planning

  safe_import_integration:
    id: safe-import-integration
    fingerprint_match:
      intent:
        - integrate
      artifact:
        - package
      scope:
        - safe_import
      mutation_target:
        - package
      project_access:
        - restricted
    primary_skill: csharp-safe-patch
    context_pack: .ai/context-packs/asset-data-change.yaml
    task_contract: .ai/harness/task-contracts/safe-import-integration.yaml
    forced_profile: team_safe_import

  visual_direction:
    id: visual-direction
    fingerprint_match:
      intent:
        - design
        - review
        - implement
      artifact:
        - visual
      failure_mode:
        - none
        - visual
      mutation_target:
        - none
        - visual_plan
        - serialized_asset
      evidence_state:
        - known
        - partial
        - not_applicable
    primary_skill: unity-visual-direction
    context_pack: .ai/context-packs/visual-direction.yaml
    task_contract: .ai/harness/task-contracts/visual-direction.yaml
    knowledge_selection: optional

conflicts:
  architecture_design_and_csharp_local_fix:
    rule: architecture_state_decides
    architecture_state_undecided: architecture-design
    architecture_state_decided_and_local_csharp: csharp-local-fix

  architecture_design_and_performance_experiment:
    rule: primary_goal_decides
    primary_goal_measurable_performance: performance-experiment
    primary_goal_execution_model_or_structure: architecture-design

  architecture_design_and_renderer_feature_change:
    rule: architecture_state_decides
    architecture_state_undecided: architecture-design
    architecture_state_decided: renderer-feature-change

  graphics_mcp_and_architecture_design:
    rule: artifact_decides
    artifact_mcp: graphics-mcp
    artifact_architecture: architecture-design

  graphics_mcp_and_visual_direction:
    rule: primary_goal_decides
    primary_goal_tool_contract_or_capability: graphics-mcp
    primary_goal_scene_beauty_or_human_review: visual-direction

  graphics_mcp_and_renderer_feature_change:
    rule: artifact_decides
    artifact_mcp: graphics-mcp
    artifact_renderer_feature: renderer-feature-change

  rendering_incident_and_shader_change:
    rule: evidence_state_and_failure_mode_decide
    root_cause_unknown_or_platform_divergence: rendering-incident
    confirmed_shader_mutation: shader-change

  rendering_incident_and_renderer_feature_change:
    rule: evidence_state_and_failure_mode_decide
    root_cause_unknown_or_platform_divergence: rendering-incident
    confirmed_renderer_feature_mutation: renderer-feature-change

  visual_direction_and_rendering:
    rule: primary_goal_decides
    primary_goal_beauty: visual-direction
    primary_goal_technical_rendering_failure: rendering-incident

  portable_feature_and_direct_project_change:
    rule: scope_and_project_access_decide
    portable_package_without_project_access: portable-feature
    project_bound_confirmed_change: renderer-feature-change

fallback:
  action: report_unmatched_fingerprint_and_continue_with_bounded_generic_planning
  allow_simple_read_only_explanation_without_domain_route: true
  do_not_route_from_technology_keyword_alone: true
  do_not_use_legacy_routing_document: true
  do_not_load_every_route: true
  do_not_load_every_mcp_manifest: true
  continue_with_generic_planning_when_project_context_is_missing: true
  never_guess_project_binding: true
